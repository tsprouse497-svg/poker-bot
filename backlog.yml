  - id: STRADDLE-RESIDUAL-BOUNDARY-IS-STATED-WIDER-THAN-MEASURED
    status: deferred
    phase: "14"
    title: Four artifacts say the straddle is invisible past one raise when it survives a short one
    reason: >-
      The residual phase 13 named as its headline is stated one raise too early. The straddle
      cancels out of the minimum-raise prediction only when every raise after the first is a full
      raise, because a short all-in raise does not move the minimum and the walk that predicts it
      floors the increment exactly as BettingRoundState.apply does.
      Measured on the committed functions rather than argued. At 50/100 with a 200 straddle, an
      open to 600 and a short all-in to 800: the straddled table's own walk holds min_raise at 400
      and offers 1,200, while predicted_min_raise_target(100, [600, 800]) returns 1,300. The gap is
      100, the straddle less the big blind, so the pot still refuses pot-holds-a-straddle. With two
      full raises - 600 then 1,500 - both walks return 2,400 and the pot is genuinely invisible,
      which is the case stage 6 measured and generalised too far.
      Four artifacts carry the wide wording: the module docstring of
      src/poker_training_bot/table_state/forced_money.py, the signal-3 comment block in
      src/poker_training_bot/strategy/preflop_chart.py, decision 8 of
      reports/phase_audits/decisions/PHASE_13_TABLE_STATE_DECISIONS.md, and the
      STRADDLE-INVISIBLE-AFTER-A-SECOND-RAISE entry above. The error is in the conservative
      direction - the phase claims to miss more than it misses - which is why it is alignment rather
      than a blocker. One sweep restating the boundary as "every raise after the first is a full
      raise" settles all four. Filed against phase 14 because it is the next phase to open
      preflop_chart.py, and because tests/ is frozen for phase 13.
      Raised by the independent stage-10 review of phase 13.
