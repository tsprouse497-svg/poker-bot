schema_version: 1
items:
  - id: V2-POKERNOW-AUTOMATION
    status: deferred
    phase: v2
    title: PokerNow automation and browser observation
    reason: >-
      Explicit v1 non-goal, and ruling 7 of docs/V2_ROADMAP.md keeps it out of v2 as well.
      No declared phase will close this, and the v2 label means after v2 rather than
      during it.
  - id: V2-TRAINING-UI
    status: deferred
    phase: v2
    title: Training UI package
    reason: >-
      V1 is CLI and report driven, and ruling 6 keeps it deferred through v2. The thing
      that would change the answer is proposed phase 15, the drill: a UI is worth arguing
      about once a CLI trainer exists and has been used, and not before.
  - id: V2-LARGE-DATASET-COMPARISON
    status: deferred
    phase: v2
    title: Large hand-history corpus comparison
    reason: >-
      V1 allows only tiny normalized sample comparison. Ruling 5 lifts that boundary for
      one player's own hands with a stated bound, but the bound is not written yet and no
      declared v2 phase owns the ingestion, so this stays deferred rather than claiming a
      phase that will not do it.
  - id: CONTRACT-REPORT-PATHS
    status: done
    phase: contract-update
    title: Point Phase 01/07/08 contract report paths at distinct report files
    reason: Resolved by MAINT-01-AGENT-STRUCTURE; every contract now names a distinct report file and the shared latest_replay_report.txt path is gone.
  - id: UNDER-RAISE-ACCUMULATION
    status: done
    phase: "11"
    title: Reopen betting when consecutive short all-ins reach a full raise
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: v1 kept seats barred once an under-raise all-in occurred even if later short
      all-ins cumulatively amounted to a full raise, where real NLHE reopens raising. Fail-closed
      but stricter than the live rule.
      The cause was that each all-in was measured against the bet level immediately before it, so
      two short all-ins that together made a full raise still left betting closed. The
      measurement is now against the last full bet or raise, and a full bet or raise resets the
      level it is measured from. Reopening restores the right to raise and not a cheaper price:
      with the level at 21 and the minimum raise still 10, the smallest legal raise is to 31. A
      single short all-in still does not reopen, and a barred seat can still call and fold.
      Pinned by test_two_short_all_ins_past_the_bar_reopen_betting,
      test_exactly_at_the_bar_reopens and test_three_short_all_ins_accumulate, guarded by
      test_one_chip_below_the_bar_does_not_reopen and
      test_a_single_short_all_in_still_does_not_reopen, and made to bite by the
      reopening-measured-against-the-preceding-bet-again canary.
      Two neighbouring rules on the same branch were deliberately left alone, because no phase 11
      acceptance criterion named them and a fix there would have been behaviour nobody asked
      for. They are open as UNDER-SIZED-ALL-IN-BET-DOES-NOT-BAR-PRIOR-CHECKERS and
      MIN-RAISE-OVER-AN-INCOMPLETE-ALL-IN-BET, and both need a ruling before an implementation.
  - id: SECOND-ORBIT-PREFLOP-SPOTS
    status: done
    phase: "12"
    title: Chart spots needing a position to act twice
    reason: >-
      Closed by phase 12 at `d046ac9`. `spot_key` accepts a position appearing more than
      once, and the order rule generalises from one pass over the preflop action order to
      repeated passes over the positions still live. A four-bet has a key from both sides
      and is pinned by test:
      `t6/d100/BTN/LJ:raise@2.5,BTN:raise@8,LJ:raise@21.5`. There is no orbit cap; what
      bounds the vocabulary is whether the sequence is a legal preflop order and whether
      its raises can be paid at the stated depth, which is decision 4.

      Two limits are recorded rather than hidden. A folded seat still cannot reappear, and
      the test that pins it had to be rewritten at stage 7 because it was passing off a
      neighbouring rule. And the depth check is table-wide rather than per-seat, so a
      five-bet to 100 is admitted at 100bb because the deepest seat could pay it, which
      waits on `ASYMMETRIC-EFFECTIVE-STACKS` at proposed phase 14.

      Expressible six-handed 100bb spots go from 1,949 to 18,773 with limps, enumerated
      rather than quoted. Vocabulary only: nothing here commits a second-orbit chart cell,
      which is `CHART-COVERAGE-EXPANSION` at proposed phase 14.

      As filed: V1 spot keys allow one entry per position, so any spot where a position
      acts twice (hero facing a 4bet or later) has no representable key; lookup misses
      those fail closed instead of guessing.
  - id: STACK-DEPTH-BUCKETS
    status: deferred
    phase: charts
    title: Stack-depth bucketing for chart lookup
    reason: >-
      V1 lookup requires an exact stack_depth_bb match. Nearest-depth or bucketed matching
      would be a heuristic, so an uncovered depth fails closed. Narrowed rather than closed
      by v2: each depth proposed phase 10 solves is one more exact match, which shrinks the
      problem without introducing the heuristic. Bucketing itself stays deferred.
  - id: ASYMMETRIC-EFFECTIVE-STACKS
    status: deferred
    phase: "14"
    title: Per-seat effective stack depth in chart spots
    reason: >-
      Half of this closed in phase 13 and the half the title names did not, so it moves to phase 14
      rather than closing with it.
      What closed is the silent wrong answer. `PreflopChartStrategy` now recomputes every seat's
      starting stack as what it holds plus what it put in, runs the flat-table test in both
      directions over live seats only, and gives a seat shallower than hero its own refusal code
      naming the seat and the depth it holds. Before phase 13 only a deeper seat refused: hero at
      100bb facing a 35bb opener was invisible and was answered at hero's depth. It now refuses as
      a-live-seat-is-shorter-than-hero, and a villain who merely has chips in the pot no longer
      reads as short. Pinned by test_a_live_seat_shallower_than_hero_refuses_with_its_own_code,
      test_each_depth_refusal_names_the_seat_and_the_depth_it_holds and
      test_a_seat_that_looks_short_only_because_it_has_invested_does_not_refuse.
      What did not close is expression, which is the whole of this entry's title. stack_depth_bb is
      still one table-wide integer on the artifact and one field on a spot key; phase 13's diff to
      solver_artifacts/spot_key.py is docstring-only, and its contract names per-seat depth in a
      key as a format change it is scoped out of. So the asymmetric table is now seen and refused
      for what it is, and is still not askable. That is the deliverable phase 13 claimed and it is
      not this entry's bar.
      Three consequences of the refusal rule are filed separately and should be read with whoever
      picks this up, because a key format that carries per-seat depth is the thing that would make
      two of them moot: COVERING-STACK-REFUSES-WITH-NO-POKER-CONTENT, which measures that better
      than one on-chart table in four is refused for a fact that changes nothing hero can do;
      ALL-IN-SEATS-COUNT-AS-SEATS-THAT-CAN-ACT; and REFUSAL-INVENTORY-FRAGMENTS-ON-PER-SEAT-DETAIL,
      which is the work list degrading under the exact per-seat detail the refusal now carries.
      SECOND-ORBIT-PREFLOP-SPOTS closed at phase 12 naming this entry as what its own table-wide
      depth check waits on, and the dependency is unchanged; the phase number in that sentence is
      not. It said proposed phase 13 and now says phase 14, corrected when this entry moved, so
      the two sides of the cross-reference name the same phase rather than one each. Solving the spots this would express also needs
      data the repo does not have, which is CORPUS-CANNOT-EXPRESS-A-TABLE-SHAPE, and depths beyond
      the one committed solve, which is CHART-COVERAGE-EXPANSION and STACK-DEPTH-BUCKETS.
      As filed: stack_depth_bb is one table-wide number, so hero at 100bb facing a 35bb opener
      cannot be expressed or queried; a caller must pick one number and silently answers a
      different question.
  - id: BLIND-STRUCTURE-VARIANTS
    status: deferred
    phase: "14"
    title: Antes and straddles in the artifact format
    reason: >-
      Detection landed in phase 13. Representation - which is what this entry asks for and what its
      title names - landed nothing, so it moves to phase 14 rather than closing with 13.
      What closed is the reading. `PreflopChartStrategy` now reconstructs what each seat should
      hold from the two declared blinds and its own recorded actions, and refuses on three signals:
      an unraised pot whose level is not the big blind, a minimum raise target disagreeing with the
      one the declared blinds predict, and a seat holding more than the reconstruction explains. A
      straddle and an ante get separate codes and separate detail, and the generous pot bound that
      preceded them was deleted only after a test showed the replacement refuses every pot the
      bound refused. Pinned by
      test_an_ante_is_found_because_every_seat_holds_more_than_the_blinds_predict,
      test_an_unraised_pot_above_the_big_blind_is_a_straddle,
      test_a_straddler_who_has_called_to_the_level_is_caught_by_the_minimum_raise_target and
      test_every_pot_the_deleted_arithmetic_bound_refused_still_refuses.
      What did not close is that the format still cannot say what game is being dealt.
      data/artifacts/preflop/six_max_nl25_100bb.json declares a table size and a stack depth and no
      blind structure; phase 13 added no field to it and its contract names that as a non-goal.
      Phase 13's own committed evidence says three times that the format is the missing piece, and
      those sentences are the bar for closing this entry. From the table-state report on the
      straddle residual - "the only thing that recovers it is a declared blind structure on the
      query - the format change this phase is scoped out of". From the same report on the blind
      ratio - "The fix is a declared blind structure on the artifact and on the query, which is the
      same format change the straddle residual above waits on and the same one this phase is scoped
      out of". And from QUERY-CANNOT-EXPRESS-A-DEAD-BLIND - "Same declared-blind-structure work as
      BLIND-STRUCTURE-VARIANTS".
      There is a third layer under those two, and it is the one that decides whether the other two
      ever get exercised. The recording format cannot hold the structure either.
      `hand_history.schema.BlindStructure` is exactly small_blind and big_blind, both positive
      integers, and its __post_init__ rejects small_blind greater than big_blind. So a straddle
      cannot be RECORDED at all - it is not that a straddled hand is read wrong, it is that a
      straddled hand cannot be written down - and an ante has nowhere to live in the record. Equal
      blinds do construct, which makes it sharper rather than softer: a $5/$5 home game is
      perfectly recordable and is then answered from a chart solved at a ratio nothing declares.
      Three layers of one defect: the history cannot record the structure, the artifact does not
      declare the structure it was solved at, and nothing compares the two.
      The phase 15 consequence is the one to schedule against. The drill's leak report runs over a
      player's own exported home-game history, which is where straddles are common by definition, so
      a straddled hand never reaches the report to be refused - it fails at ingestion or is
      normalised into something it is not. Refusing correctly at the strategy layer, which is what
      phase 13 bought, does nothing for a hand the parser cannot accept.
      What now blocks on this entry: STRADDLE-INVISIBLE-AFTER-A-SECOND-RAISE,
      BLIND-RATIO-NEVER-CHECKED-AGAINST-THE-SOLVED-STRUCTURE, QUERY-CANNOT-EXPRESS-A-DEAD-BLIND and
      STRADDLE-REFUSAL-DOES-NOT-SAY-WHICH-GAME-IT-IS all name a declared blind structure as their
      fix. BIG-BLIND-ANTE-CLASSIFIES-AS-THE-RESIDUAL and
      ANTE-WITH-A-SHORT-ALL-IN-CALLER-TAKES-THE-RESIDUAL are the ante half misclassifying under the
      detector that stands in for the declaration. CORPUS-CANNOT-EXPRESS-A-TABLE-SHAPE is why none
      of it can be measured against committed data today.
      As filed: The artifact declares no blind structure, so a straddled or anted pot reads as an
      ordinary one even though both materially change correct preflop ranges. Common in the
      home-game context this bot targets.
  - id: DECISION-LIST-HAS-NO-FIXED-PLACE-FOR-A-RULING
    status: deferred
    phase: contract-update
    title: A decision list has no convention for where a human ruling is recorded
    reason: >-
      Phase 12 put its ruling in a top-level "Ruled by Taylor" section before any decision
      body; phase 13 first put its ruling inside the decision it answered. Both are legible
      alone and neither is the convention, so a document can hold an answered question whose
      header and body still read as open, which is what the independent stage 3 reviewer
      found in phase 13 before it was corrected. The loop driver only reads the Answer
      bracket, so nothing mechanical notices. docs/LOOP.md or docs/exec_plans/TEMPLATE.md
      should name one place, and the natural one is both: a summary section at the head and
      the full record beside the item it settles.
  - id: QUERY-CANNOT-EXPRESS-RAKE-OR-DEAD-MONEY
    status: deferred
    phase: strategy
    title: A pot holding chips no seat contributed cannot be expressed as a StrategyQuery
    reason: >-
      Phase 13 decision 3 rules that pot must equal the sum of the per-seat hand
      contributions exactly, with no dead-money field, because a dead-money field is a hole
      the size of the defect the rule exists to catch: any producer whose arithmetic does not
      work can put the difference there and pass. The deliberate cost is that rake taken
      preflop, a forfeited dead blind, and any other unattributed chips make a hand
      inexpressible as a query at all. That is a hard stop for later ingestion of real online
      hands, and it is a query-format change to lift rather than a validation to relax, so
      whoever takes that ingestion owns deciding where those chips sit. Filed because the
      alternative is a paragraph in a decision list nobody reads again when the ingestion
      phase starts. Charts in this repo are rake-free by ruling, which is why the stop costs
      nothing today.
  - id: SIDE-POTS-NOT-EXPRESSIBLE-ON-THE-QUERY
    status: deferred
    phase: strategy
    title: The query carries one undivided pot, so a short all-in has no side pot
    reason: >-
      Per-seat contributions, a capped to_call, and phase 13's refusal on a live seat
      shallower than hero are exactly the state in which a side pot exists, and StrategyQuery
      still carries pot as one scalar. Hero's real price and pot odds against the main pot are
      not recoverable even with contributions in hand. Phase 13 hides the question rather than
      answering it, because decision 6 refuses every asymmetric table, which is precisely why
      it will be missed when decision 6 is re-ruled. Whoever loosens that rule owns deciding
      whether pot becomes a list of pots or the refusal survives for the all-in case alone.
      Found by the independent stage 2 reviewer.
  - id: CORPUS-CANNOT-EXPRESS-A-TABLE-SHAPE
    status: deferred
    phase: samples
    title: Nothing in this repo can produce an asymmetric, straddled, or anted table
    reason: >-
      Measured at phase 13 stage 1 over all 499 committed corpus hands: starting_stacks is
      [10000] x 6 in 499 of 499, antes is all zeros in 499 of 499, and blinds_or_straddles is
      [50, 100, 0, 0, 0, 0] in 499 of 499. data_pipeline/corpus.py rejects at parse time any
      hand that does not post exactly two positive blinds in the first two seats, the engine
      posts only two blinds and knows no ante, and simulator/config.py forces one starting
      stack for every seat. So every table-shape number phase 13 could report against the
      corpus is structurally zero before anything is measured, and the detection that phase
      builds is exercised almost entirely by synthetic fixtures with no producer behind them.
      Two independent reviewers found this at phase 13 stage 1. One exception, found at stage
      3 and worth keeping: data/samples/normalized_hands.json holds phase02-three-way-side-pot
      at 50, 100 and 200 chips, the only unequal table committed anywhere, and the postflop
      fallback report drives its three preflop decision points through PreflopChartStrategy.
      It is three-handed so it never reaches the six-max chart, but it does reach the depth
      check, which makes it the sole live evidence that a per-seat depth rule fires at all.
      Whatever schedules ASYMMETRIC-EFFECTIVE-STACKS or the format half of
      BLIND-STRUCTURE-VARIANTS needs data first, and bounded ingestion of one player's own
      hands is the ruled route to it.
  - id: ENGINE-FIDELITY-CONTRACT-IS-AT-ITS-LINE-CAP
    status: done
    phase: contract-update
    title: The Phase 11 contract is 300 of 300 lines and owes an amendment it cannot take
    reason: >-
      Closed by the ENGINE_FIDELITY_CONTRACT_REWRITE contract-update task, evidenced in
      reports/phase_audits/PHASE_13_TABLE_STATE.md. docs/phase_contracts/PHASE_11_ENGINE_FIDELITY.md
      was rewritten rather than amended, folding its appended amendments into the criteria they
      amend, and landed at 283 lines from 300 with no criterion dropped: 39 acceptance bullets
      before and after, 32 of them byte-identical, every other section unchanged in count, and only
      three Scope bullets and one Non-goal reworded. Measured with check_contracts.section_bullets,
      which is the repo's own definition of a contract bullet.

      The debt was thirteen edits, not the nine listed here and at stage 1. Four more surfaced while
      the work was being done: an eighth query-level street_bet site inside an amendment body, a
      line calling the old all-in ceiling too loose by exactly to_call, decision 1 of the phase 13
      decision list carrying the same dead preflop-equality invariant as decision 3, and this
      entry's own count of three acceptance criteria naming the field when it was more. Every list
      of stale statements the phase produced was itself incomplete.

      The arithmetic this entry states is part of what was struck. Taylor's ruling of 2026-08-20
      caps to_call at hero's remaining stack, and once capped the two ceilings do not differ by
      to_call. The chart capped at the street's bet level plus hero's stack and DecisionAuditRecord
      at hero's own street contribution plus that stack, so the gap is the bet level less hero's
      contribution - what hero still owes to match the level, which is uncapped. For a capped hero
      they are different numbers: 100 in, a level of 300, 150 behind gives to_call 150 and a gap of
      200. The Phase 11 contract now states the gap as that quantity rather than as to_call, which
      is what makes the criterion survive the cap.

      Closed on an independent review rather than on the task's own report. The task struck the
      identity from the Phase 11 contract and left it standing in three more documents it had open:
      the phase 13 contract's own two-ceilings criterion, decision 11 of the phase 13 decision list,
      and this entry. All three are corrected in the same change that closes this, which is why the
      entry does not close on the report that missed them. What still carries the identity is out of
      that task's scope and filed as SUBTRACTION-IDENTITY-SURVIVES-IN-FROZEN-TESTS-AND-CODE.

      As filed: docs/phase_contracts/PHASE_11_ENGINE_FIDELITY.md sits at exactly the 300-line cap in
      scripts/check_file_sizes.py. It names StrategyQuery.street_bet in three acceptance
      criteria, which phase 13 renames under STRATEGY-QUERY-STREET-BET-NAME, and it asserts
      that the preflop chart's raise cap is its own all-in target, which is already false:
      the chart caps at street_bet plus stack while DecisionAuditRecord caps at street_bet
      minus to_call plus stack, differing by exactly to_call. AGENTS.md forbids raising the
      cap to fit an amendment and rules that a contract at the cap is due for a rewrite
      folding its amendments into the criteria they amend, as its own contract-update task.
      That rewrite is what is owed. No check reports a contract sitting at the cap while it
      owes an amendment, which is why phase 13 stage 1 is the first place it surfaced.
  - id: CONTRACT-CRITERIA-BACKFILL
    status: deferred
    phase: contract-update
    title: Backfill phase-specific acceptance criteria for phases 00, 01, and 02
    reason: check_contracts now requires an active or completed phase to carry at least three acceptance criteria that are not gate boilerplate. Phases 00 through 02 were closed with only the four boilerplate criteria, so their gates asserted little beyond the gate passing. They are explicitly exempted in CRITERIA_BACKFILL_EXEMPT because backfilling is a semantic contract change that needs contract-update mode, which the maintenance task that added the check may not do.
  - id: CHART-COVERAGE-EXPANSION
    status: deferred
    phase: "14"
    title: More chart depths and spot classes beyond six-max 100bb first-two-decisions
    reason: Phase 05 commits one six-max 100bb solution covering opens, spots facing a single open, the opener facing a three-bet, and the big blind facing a limp. Other depths and the squeeze and cold four-bet classes are already representable and already indexed by depth, so they are additive data rather than format work; every uncovered spot refuses meanwhile.
  - id: PER-SEAT-CONTRIBUTIONS-IN-QUERY
    status: done
    phase: "13"
    title: Carry each seat's committed chips on StrategyQuery
    reason: >-
      Closed by phase 13, evidenced in reports/phase_audits/PHASE_13_TABLE_STATE.md.
      `StrategyQuery.seat_states` carries a `SeatState` per seated player - `street_bet`,
      `committed_total`, `folded` and `all_in`, under the engine's own names for them - with no
      default, one entry for every seat in `stacks` including folded ones, and `pot` validated as
      the sum of the hand figures rather than trusted. Hero's own contribution is now read off
      that record everywhere it was previously recovered as `street_bet` minus `to_call`: in
      `PreflopChartStrategy._table_depth_bb` and in the all-in ceiling on `DecisionAuditRecord`.
      Pinned by test_the_contributions_field_has_no_default_so_no_producer_can_skip_it,
      test_a_seated_player_with_no_contribution_entry_is_rejected,
      test_a_pot_holding_chips_no_seat_contributed_is_rejected and
      test_hero_s_contribution_is_carried_rather_than_recovered_from_the_price, guarded by
      test_a_folded_seat_keeps_the_chips_it_already_put_in and
      test_preflop_a_seat_may_hold_more_over_the_hand_than_on_the_street, and made to bite by the
      the-pot-stops-having-to-reconcile and hero-depth-is-derived-by-subtraction-again canaries.

      The exactness this bought is not total, and the residuals are filed by id rather than left
      in the closing line. A straddle whose poster has raised twice is still absorbed and still
      answered, which is STRADDLE-INVISIBLE-AFTER-A-SECOND-RAISE. A uniform ante misclassifies as
      soon as one seat calls all-in for less, which is
      ANTE-WITH-A-SHORT-ALL-IN-CALLER-TAKES-THE-RESIDUAL. The pot is still one undivided scalar,
      so the side pot that a capped price and a short live seat imply is not expressible, which is
      SIDE-POTS-NOT-EXPRESSIBLE-ON-THE-QUERY. And the reconciliation this entry asked for makes a
      pot holding chips no seat contributed inexpressible by ruling rather than by oversight,
      which is QUERY-CANNOT-EXPRESS-RAKE-OR-DEAD-MONEY.

      As filed: StrategyQuery gives current stacks, the pot, and the price to call, but not what
      each seat has put in. Nobody's own contribution is recoverable, hero's included - street_bet
      minus to_call was thought to give hero's, and under the 2026-08-20 ruling that to_call is the
      capped price it does not (STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS). That blocks three things
      the preflop strategy currently approximates or misses. A short villain is indistinguishable
      from one who has already invested (ASYMMETRIC-EFFECTIVE-STACKS). A straddle is only
      detectable while the pot stays smaller than the blinds plus one full bet per voluntary
      action, so a straddled pot with several callers can slip through. An ante is only detectable
      by the same bound. Adding per-seat contributions makes all three exact rather than bounded,
      and is the same shape of fix as adding the preflop action history was.
  - id: RAISE-SIZE-IN-SPOT-KEY
    status: done
    phase: "12"
    title: Record raise sizes in preflop spot keys
    reason: >-
      Closed by phase 12 at `d046ac9`. A raise entry renders the amount it raised *to* in
      big blinds after an `@`, quantized to hundredths with trailing zeros stripped, and a
      call carries no size because it pays a level the key already states:
      `t6/d100/LJ/LJ:raise@2.5,BTN:raise@8`. Decisions 1, 2 and 3, all `frozen-into-data`
      and all ruled by Taylor on 2026-08-20. A size the renderer cannot represent exactly
      is rejected rather than rounded into a neighbouring cell, and a v1 key carrying no
      size fails import rather than matching any size.

      The committed artifact was re-derived under the new keys and the ranges provably did
      not move: stripping every `@size` back out reproduces the pre-phase weights checksum
      `eaf2c6cd` exactly, so the file's changed checksum `d2d5c3fa` is accounted for
      entirely by the spot ids inside it. 36 spots before, 36 after, because each
      size-stripped prefix admits exactly one solved size.

      What the entry as filed did not anticipate is that closing it does not by itself move
      any agreement rate. Under ruling 8 and Taylor's 2026-08-20 extension of it, a price
      the tree does not hold is normalised back to the cell the coarse key already hit, so
      every corpus rate is unchanged. What the key bought is that the answer now says it
      was substituted, on 969 of 2,758 answered decisions - a measurement that was
      impossible while one cell answered every price. Making the chart *answer* those
      prices differently is a second solve, at proposed phase 14.

      As filed: V1 spot keys record action names without sizes, so a 2.5bb open and a 4bb
      open share one spot. Sizing-aware spots need a size vocabulary the artifact format
      does not yet declare.
  - id: FOLD-WHEN-FREE
    status: done
    phase: "11"
    title: Accept recorded folds when checking is free
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: the engine treated fold as illegal when to_call was zero, so real histories
      containing open folds - timeouts, surrendered rivers - failed replay, and the strategy
      contract inherited the same invariant. It was the single largest blocker on ingesting
      anybody's actual hands.
      A fold is now legal wherever a seat may act. It costs nothing and leaves the bet level and
      the minimum raise untouched. Legal is not the same as chosen, and that half is proved
      rather than asserted: no strategy in this repo folds when checking is free, measured over
      the postflop enumeration, the reference strategy, and the one committed chart spot where
      checking is free, which folds 0.00 percent. Pinned by test_a_free_spot_offers_fold and
      TestReplayAcceptsARecordedFreeFold, guarded against over-application by
      test_check_stays_legal_exactly_when_the_price_to_call_is_zero and
      test_facing_a_bet_offers_the_same_set_it_always_did, and made to bite by the
      free-fold-taken-off-the-table-again mutation canary.
  - id: POSTFLOP-UNBEATABLE-EARLIER-STREETS
    status: deferred
    phase: "16"
    title: Extend the unbeatable call from the turn back to the flop
    reason: >-
      The postflop fallback calls a bet only when no possible villain holding beats hero,
      and only on the turn and the river. On the river a complete board makes that a
      990-holding enumeration. On the turn it means safe after every one of 46 river
      cards, which decomposes into 46 river checks - 45,540 evaluations, a few seconds,
      and affordable inside the exhaustive sweep, which is why the turn is now covered.
      The flop is not: two cards are still to come, so the claim runs over C(47,2) = 1,081
      holdings against C(45,2) = 990 runouts, 1,070,190 evaluations and roughly 83 seconds
      for one decision. A sampled version would turn the fact back into a guess, so the
      fallback folds flop bets meanwhile. Almost nothing qualifies on the flop anyway, so
      the cost is small and the fix is a faster evaluator rather than a new rule. The
      earlier version of this entry gave the flop as 903 runouts against 990 holdings and
      lumped the turn in with it; both figures were the river's own, shifted by a card,
      which is what kept the turn deferred for a phase longer than it needed to be.
  - id: FALLBACK-FAIL-CLOSED-CAN-CALL
    status: done
    phase: "11"
    title: The fallback's fail-closed branch can invest, and can refuse postflop
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: PostflopFallbackStrategy._fail_closed runs when the action the rules chose is not
      on offer, and took the most passive legal action from ("fold", "call"). Where fold is
      absent that is a call, so a branch reached because something unexpected happened answered
      by investing in a hand it had not established could not lose - which the phase contract
      forbids everywhere - and where neither was legal it returned a postflop refusal, which the
      contract says never happens. Neither branch was reachable from a legal-action set the
      engine's own legal_actions produces, and the phase enumeration confirms zero postflop
      refusals, but both were reachable from a contract-valid StrategyQuery: legal_actions
      ("call", "raise") called, and ("raise",) refused. Found by the Phase 06 stage 8 mechanical
      review, which could not fix it because tests/ was out of scope for that phase after the
      freeze.
      The passive order is now ("fold",) alone, so the branch folds when folding is legal and
      refuses otherwise, and it never invests. Pinned by
      test_a_set_offering_call_but_not_fold_refuses_rather_than_investing, guarded by
      test_the_unbeatable_call_is_untouched and test_a_preflop_query_still_refuses, and made to
      bite by the fail-closed-can-invest-again canary.
  - id: POSTFLOP-BOARD-ABSTRACTION
    status: deferred
    phase: charts
    title: Group similar flops so the bot plays them identically
    reason: >-
      Ruled by Taylor on 2026-08-19: eventually needed, deliberately later. Suit isomorphism is
      exact and every solver exploits it; grouping by rank texture so an unsolved K72r reads off a
      solved Q83r is a heuristic, and AGENTS.md forbids heuristic guessing for missing chart
      spots, so adopting it is a boundary amendment rather than an optimisation. It is not needed
      for breadth: a flop-only solution covers every canonical flop, so it never meets a texture it
      has no cell for. It is needed for depth, because per preflop line the turn is 85995 spots and
      the river 4127760. So this item is what unblocks the turn, and until it is
      taken the committed solution stops at the flop and later streets refuse. Building it before
      anything requires it would produce an abstraction nobody can measure against a solved
      baseline.
  - id: V2-POSTFLOP-STRATEGY
    status: deferred
    phase: "16"
    title: A postflop strategy that can bet and raise
    reason: >-
      V1 ships a fallback that never invests unless the investment cannot lose, so it never
      bets or raises. An earlier version of this entry said a size needs a source and the only
      source in the repo is the preflop export; that was wrong. GTOpen solves postflop as its
      primary function and the Preflop Lab phase 10 uses is the bolt-on. What is missing is a
      ruling on how deep the committed solution goes and what the bot does on a board it holds
      no cell for, since mapping an unsolved rank texture onto a solved one is the heuristic
      guessing AGENTS.md forbids. Recorded with defaults in
      reports/phase_audits/decisions/PHASE_16_POSTFLOP_BETTING_DECISIONS.md.
  - id: STREET-BET-MEANING-AMBIGUOUS
    status: done
    phase: "11"
    title: Two readings of StrategyQuery.street_bet, and one consumer uses the wrong one
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: StrategyQuery.street_bet carried no docstring and two consumers read it
      differently. preflop_chart._table_depth_bb derives hero's starting stack as stacks[seat] +
      (street_bet - to_call), which is only meaningful if street_bet is the street's current bet
      level, and _blind_structure_is_representable compares it to the big blind on the same
      reading. But scripts/generate_strategy_query_report.py passed player.street_bet, hero's own
      contribution, so replayed hands reached the chart with a mis-derived depth: the small blind
      in phase02-heads-up-showdown refused with blind-structure-not-representable where the true
      miss is the table size. Found by the Phase 06 report lane.
      The meaning is now stated on the field as the street's current bet level, a query whose
      street_bet is below its to_call is rejected, and the one wrong producer is corrected.
      Pinned by test_the_query_documents_which_reading_it_carries,
      test_a_street_bet_below_the_price_to_call_is_rejected and
      test_the_query_report_generator_writes_the_street_level, guarded by
      test_a_street_bet_equal_to_the_price_to_call_is_accepted.
      Two things this closing does NOT close, stated here because done beside them reads wrong at
      a glance. The guard catches a producer passing hero's contribution only when hero has put
      in less than half the current level, so it misses the heads-up small blind, who has put in
      exactly half, and the field is still named for the reading it does not carry - both are
      STRATEGY-QUERY-STREET-BET-NAME, phase 13. And the field beside it turned out to carry the
      same undocumented pair of readings, which is STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS, ruled
      on 2026-08-20 and open for phase 13.
  - id: DECISION-AUDIT-ALL-IN-BOUND-TOO-LOOSE
    status: done
    phase: "11"
    title: The decision audit's all-in ceiling is too high by the price to call
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: DecisionAuditRecord computed max_target as street_bet + stack for the acting
      seat. Under the canonical reading of street_bet as the street's current bet level, hero has
      already committed street_bet - to_call, so the true all-in raise target is (street_bet -
      to_call) + stack and the recorded ceiling was too loose by exactly to_call. With street_bet
      20, to_call 20 and a stack of 100 the record accepted a raise to 120 and only rejected 121.
      No shipped strategy was affected, because the only strategy that returns an amount is the
      preflop chart and it caps its own raise at street_bet + stack, but the legality proof
      several phase contracts lean on was weaker than those contracts say. Found by the Phase 06
      report lane.
      The ceiling is now (street_bet - to_call) + stack, so nothing changes in play and the
      legality claim is true. Pinned by test_a_raise_above_the_corrected_ceiling_is_rejected and
      test_the_old_ceiling_is_no_longer_the_boundary, guarded by
      test_a_raise_exactly_at_the_corrected_target_is_accepted and
      test_every_committed_decision_audit_record_still_validates, and made to bite by the
      all-in-ceiling-loose-by-the-price-to-call-again canary.
      What keeps this sound is Taylor's ruling of 2026-08-20 that to_call is the capped price
      hero can actually pay. A capped hero is never offered raise, because the engine only offers
      it when stack exceeds the price owed, so the subtraction is only ever applied to an
      uncapped hero, for whom street_bet minus to_call really is hero's contribution. The guard
      that makes that airtight - StrategyQuery rejecting a query that offers raise when to_call
      equals the seat's stack - does not exist yet and is phase 13's, under
      STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS.
  - id: SAMPLE-HAND-THE-CHARTS-COVER
    status: deferred
    phase: "15"
    title: No committed sample hand is a preflop spot the charts cover
    reason: >-
      The four hands in data/samples/normalized_hands.json were written to exercise the
      replayer and are two-handed and three-handed, so the six-max artifact refuses every
      preflop point in them. The Phase 06 report can therefore only show a hand as
      refuse-preflop-then-check-through rather than decide-preflop-then-check-through,
      which is the shape Phase 07 will want to measure. A six-handed 100bb normalized
      hand added to data/samples/ would close it, and committing sample data is a
      frozen-into-data decision that needs a human, so it is not a Phase 06 change.
  - id: POSTFLOP-POT-ODDS-AGAINST-UNSEEN-DECK
    status: deferred
    phase: "16"
    title: River pot-odds calling against the full unseen-deck range
    reason: >-
      The postflop fallback folds every bet it cannot prove it wins, so it is
      exploitable by any bet at all. A middle option exists that needs no invented
      constant and no solver: hero's equity against the full unseen deck is
      (wins + ties/2) / 990, which the same enumeration hand_cannot_lose already runs
      produces, and the price is to_call / (pot + to_call) straight off the query. Call
      when equity beats the price. The honest cost, which any contract adopting this
      must state, is that a uniform range is still a model: anyone who bets the river
      is stronger than a random two cards, so uniform-range equity flatters hero and
      the bot would over-call - the mirror of its current over-folding. Unlike the
      unbeatable test, this is an assumption rather than a fact about the hand, which
      is why it is a separate rule and not an extension of that one. It is also worth
      building only once something bets at the bot: in bot-versus-bot self-play neither
      side ever bets, so the branch is unreachable, and whether a betting opponent
      exists is a Phase 07 and Phase 08 question. Superseded rather than extended by
      V2-POSTFLOP-STRATEGY, which computes equity against a modelled range.
  - id: SIMULATOR-VOIDED-HAND-RECORD
    status: done
    phase: simulator
    title: A voided hand's record discards the actions that identify the refused spot
    reason: >-
      simulator.run._voided builds its normalized record from played.streets or
      blinds_only, and played.streets is only appended once a street's betting loop
      completes. A refusal returns from inside that loop, so on a preflop refusal the
      fallback always wins and the record keeps only the two blind posts. Measured over
      the committed self-play run: 128 refused hands took between 2 and 7 decisions each,
      565 actions in total, and every record kept none of them. Because Phase 05's refusal
      codes name the kind of miss rather than the spot, that action sequence was the only
      place the spot survived, which makes the report's headline coverage figure a count
      rather than the list of uncovered spots it claims to be. The pre-refusal
      DecisionAuditRecords do keep everything, so the data is recoverable. Connected: such
      a record cannot be replayed at all - correctly, since the hand stops mid betting
      round - so a voided hand is not a completed hand history and the fix has to decide
      what a refused hand's evidence is instead. That collides with the frozen test
      asserting every hand carries a NormalizedHandHistory, which is why it is a
      contract question rather than a patch. Found by the Phase 07 stage 8 review.
  - id: SIMULATOR-NOISE-THRESHOLD-UNPINNED
    status: deferred
    phase: simulator
    title: The two-standard-error rule is never exercised between zero and overwhelming
    reason: >-
      SimulationResult.separated_profiles implements Phase 07's judgment call 3: no winner
      is named unless a figure clears two standard errors. It is only ever asked two
      degenerate questions. In self-play all six seats are one profile, so the summed
      figure is identically zero with a standard error of exactly zero and the rule returns
      nothing because zero is not greater than zero, not because a threshold did any work.
      In the floor run the figure sits 14.9 standard errors from zero. So nothing anywhere
      tests a difference that is real but too small to call, which is the only case the
      rule exists for, and the test asserting it passes on an arithmetic identity. The same
      vacuity that hid judgment call 4 until a mutation canary caught it.
  - id: SIMULATOR-REPORT-UNITS-AND-IDS
    status: deferred
    phase: "15"
    title: Report the win rate in bb/100, and disambiguate hand ids across runs
    reason: >-
      Two small things from the Phase 07 review. The floor figure is printed as 38.67 chips
      per hand at 50/100, which is 38.7 bb/100 - the unit a poker player can calibrate
      against, and the one that makes the size of the result legible as roughly four to
      eight times a strong human's win rate. And hand_id is derived from the hand's own
      seed (seed + index) with a constant table_id, so runs seeded 100 and 101 both contain
      a hand called sim-101. That is the price of making a hand reproducible from its own
      seed, which is worth keeping, so the fix is a run-scoped prefix rather than a
      different seeding scheme.
  - id: SIMULATOR-DECISION-AUDIT-NOT-COMMITTED
    status: deferred
    phase: "15"
    title: The simulator records a decision audit and never writes it out
    reason: >-
      Every decision the simulator applies becomes a Phase 03 DecisionAuditRecord and the
      whole set is regenerable from the seed, which is what the contract asks. But unlike
      Phase 06, no audit file is committed, so a reviewer cannot inspect a single decision
      without running the generator and reaching into the result object. Phase 06 commits
      latest_postflop_decision_audit.jsonl for exactly this reason. Not a criterion
      violation, an inconsistency between two adjacent phases' evidence - and the file the
      refusal inventory would naturally live beside.
  - id: MUTATION-SENTINEL-IS-COMMITTABLE
    status: done
    phase: contract-update
    title: The gate-bite sentinel and a mutated source file can be committed
    reason: >-
      check_gate_bite writes verification/.mutation_in_progress before it edits a source
      file and removes it in a finally block, so an interrupted run leaves a marker that
      refuses the next run. That protects the next run and nothing else: while a run is in
      flight the tree genuinely holds a deliberate defect, and a `git add -A` during that
      window commits both the defect and the sentinel announcing it. That happened on the
      Phase 09 branch: a commit captured the cutoff and hijack labels swapped, and the
      sentinel that said so, and the gate went red on the next scope check rather than on
      the swap. Two cheap fixes and they are not exclusive: gitignore the sentinel so it
      can never be committed, and have the sentinel's presence fail check_scope or a
      pre-commit path so a commit during a mutation run is refused rather than recorded.
      Filed rather than fixed inside Phase 09 because .gitignore and check_scope.py are
      outside this phase's approved scope, and because the phase must not edit the checks
      it is measuring itself against.
      Closed by MAINT-20 on 2026-08-18, with both fixes rather than either: the sentinel is
      gitignored so it can never be staged, and check_scope refuses while it exists, quoting
      it so the operator is told which file to restore. It had bitten a second time by then,
      when a backgrounded gate-bite run and a full gate run raced and the loser left a mutated
      replay.py in the tree.
  - id: CORPUS-CALL-AGREEMENT-IS-THE-WEAK-SPOT
    status: deferred
    phase: "14"
    title: The chart defends the big blind nothing like real players do
    reason: >-
      Measured over 499 real hands. Folds agree almost always and raises agree in the
      nineties, but calls agree 59.5% for Pluribus on 37 decisions and 60.8% for the human
      professionals on 227. The 96.3% headline is dominated by the 72% of decisions that
      are folds, which is the easiest agreement in poker and says almost nothing. Split by
      position, the deficit is one seat: human calls agree 53.2% in the big blind against
      62-77% everywhere else, and the big blind holds 58 of the 89 human call
      disagreements. The same seat is the one the chart refuses most often, on 26.6% of its
      decision points against 1.3% in the hijack, and refusals sit outside every agreement
      rate, so the big blind's rate is computed over the subset of its decisions the chart
      could answer, which is not a random sample of them.

      Most of the gap is the artifact rather than a defect, and this entry said otherwise
      until MAINT-09. The committed ranges were solved with NL25 rake and this corpus is
      rake-free; a raked solution defends the blinds more tightly, and Phase 05's own
      strategy report already says so. They were also solved against a 2.5bb open, while
      these players opened to a median 2.25, and agreement tracks that price closely: human
      calls agree 52.5% facing 2.25 or less, 69.0% between 2.26 and 2.50, and 77.8% above
      2.50. 47 of the 58 big-blind call disagreements faced an open below the solved size.
      The earlier reading - that this is the same over-folding bias Phase 05's collapse rule
      and Phase 06's fallback showed - is not supported: those are properties of how a
      decision is collapsed or declined, and this is a property of which solution was
      committed and at what price it was read.

      What is left to establish is narrower. Phase 08 may not change the chart it measures,
      so the work is recorded rather than done: get a rake-free solve, or a 2.25bb-open
      solve, and see how much of the gap survives. Start with the refused big-blind spots,
      because a cell that answers nothing and a cell that answers wrongly need different
      work and this seat has an unusual amount of both. RAISE-SIZE-IN-SPOT-KEY is the entry
      that would let a spot key carry the price at all, and until it lands every rate here
      is computed across sizes the chart cannot distinguish.
  - id: CORPUS-INEXPRESSIBLE-SPOTS
    status: done
    phase: "12"
    title: The largest refusal bucket against real hands names no spot at all
    reason: >-
      Closed by phase 12. The sample holds 0 refusals that name no spot at all now, and
      the 19 that did arrive as `lookup:spot-not-covered` instead: the vocabulary
      can name the cell, and filling it is `CHART-COVERAGE-EXPANSION` at proposed phase 14.
      The refusal total is unchanged at 290, which is the expected result rather than a
      disappointing one, because this phase added no chart coverage.

      As filed: 19 decision points across the committed sample carried no spot key, because
      the position and action sequence did not describe a spot the Phase 04 vocabulary could
      express - a
      different miss from a spot that is expressible and uncovered. It is the biggest
      single entry in the real-hand inventory.

      Diagnosed in MAINT-09, having been filed as the one entry nobody could act on. All 19
      are the same thing: a sequence in which some seat acts a second time, which is a
      four-bet or beyond. `solver_artifacts/schema.py` rejects those in as many words - "v1
      supports single-orbit spots only" - so this is not an unknown gap in the vocabulary
      but the documented edge of it, reached by real play 19 times in 3,048 decisions.
      `SECOND-ORBIT-PREFLOP-SPOTS` is the entry that would fix it; this one is the
      measurement of what that fix would buy, and the two should be worked together.
  - id: CORPUS-INVENTORY-SHOULD-DRIVE-CHART-WORK
    status: deferred
    phase: "14"
    title: Real hands find three times the coverage gap that self-play finds
    reason: >-
      78 distinct refused spots against real play versus 22 from self-play, and most of the
      78 are new. Self-play only reaches the spots its own strategy creates, so it is blind
      by construction to the lines real opponents take, and the self-play inventory has
      been standing in as the work list since Phase 07. Whatever chart phase comes next
      should be ordered by the real-hand inventory instead, with the self-play one kept as
      the cheaper signal that regenerates on every gate run.
  - id: LOOP-NO-CLASS-FOR-A-HUMAN-OWNED-THRESHOLD
    status: deferred
    phase: contract-update
    title: The loop has no reversibility class for a threshold a human must own
    reason: >-
      A decision list declares each judgment call frozen-into-data or runtime-reversible,
      and only the first stops for a human. A check threshold is neither. It lives in code
      rather than in committed data, so nothing later is measured against it the way a
      chart cell is, which makes it reversible by the letter of the rule. But
      docs/V2_RULING_MITIGATIONS.md names authoring the expectations tolerances before the
      solve as one of two things a phase could get wrong quietly, and a tolerance the loop
      proceeds on by default is a tolerance nobody ruled on. Phase 10 filed five such
      thresholds as frozen-into-data to force the stop, which works and is a stretch of the
      class. The fix is a third class, or an explicit rule that a threshold graded against
      external data counts as frozen; either way it is loop machinery and not phase work.
      Phase 13 is the third instance and the first with no workaround: phase 12 could flag a
      reversible call for a human only because policy gave it auto_advance false, and phase
      13 has auto_advance true, so a flag with no mechanism behind it reaches nobody. It was
      settled by reading docs/LOOP.md in full rather than by stretching anything: the class
      says "committed artifact or fixture", and a behaviour default a contract requires a
      frozen test to pin is a fixture. That reading covers phase 10's five thresholds too,
      so the fix may be a documentation clarification rather than a third class.
  - id: GTOPEN-NOTES-OMIT-REALIZATION
    status: deferred
    phase: contract-update
    title: The recorded GTOpen config body omits the realization field
    reason: >-
      docs/GTOPEN_SOLVER_NOTES.md publishes the config body that was posted to
      /api/preflop/spot as the accepted surface, and it has no realization field, so anyone
      following it takes the default of static. GTOpen's preflop engine resolves flops by
      scaled equity share rather than by playing them, and static is very nearly raw
      realization: measured on the six-handed 100bb rake-free tree, the big blind defends
      99.71 percent against a small-blind open under static and 49.03 percent under
      calibrated. The note needs the field in the body and the model limitation in its own
      section. Phase 10 records the finding in its decision list but may not edit the note,
      which is outside its approved scope.
  - id: MITIGATIONS-ORDERING-AND-BOUND-CLAIMS-FALSE
    status: deferred
    phase: contract-update
    title: Two claims in V2_RULING_MITIGATIONS section 1 are falsified by measurement
    reason: >-
      Section 1 asserts that rake moves the level of all eleven expectations numbers and the
      ordering of none, and that the rake-free directional bound needs no tolerance at all.
      Both fail through the small blind. Rake-free reallocates twelve points of small-blind
      limping into raising, which moves SB from second to first in the opening order, and
      BB-versus-BTN defence came back 2.55 points tighter than the raked reference, which
      between a full solver and a preflop-only equity-realization model is solver difference
      rather than a defect. Phase 10's contract and decision list carry the corrected checks;
      the document that states the false claims is outside its approved scope and still needs
      fixing.

  - id: PHASE-10-CONTRACT-MISCOUNTS-THE-FOUR-BET
    status: deferred
    phase: contract-update
    title: The phase 10 contract glosses a four-bet as the fourth raise
    reason: >-
      The whole-tree criterion asks for "a four-bet node - the fourth raise, counting the
      open as the first". A four-bet is the third raise: the open is the second bet because
      the big blind is the first, so open, three-bet, four-bet is three raises. GTOpen
      agrees and labels the action "4-bet 22.5" in its own action list, which is what the
      committed tests assert on, so nothing is measured wrongly. The parenthetical is still
      a miscount inside an acceptance criterion, and the next reader has no way to tell
      which of the two readings the phase meant. Fix the gloss at the next contract-update;
      it is not worth its own halt.
  - id: CHART-HERO-MUST-NEVER-LIMP
    status: deferred
    phase: "14"
    title: Nothing forbids a committed chart from limping, and today's chart does
    reason: >-
      A spot with an empty action_sequence is folded to hero, so a call weight in it is hero
      open-limping. The schema's action vocabulary allows one and no validation rejects it.
      The committed GTO Wizard chart limps 13.73 percent from the small blind across 103 hand
      classes, inherited from a raked solution, and it is the joint-second largest hole in the
      refusal inventory: t6/d100/SB/SB:call,BB:raise, 11 hands of 600, because the bot limps
      and then cannot play the raise that comes over the top. Taylor ruled on 2026-08-18 that
      hero never limps. The Phase 10 export enforces it by construction, since the ruled solve
      has no limp action at all, but that is a property of the data rather than a rule. Phase
      14 owns the chart schema, so the check belongs there: no spot with an empty
      action_sequence may carry a call weight.
  - id: CHART-CANNOT-ANSWER-A-LIMPED-POT
    status: deferred
    phase: "14"
    title: A no-limp solve cannot answer any spot where an opponent limped
    reason: >-
      Hero never limping and hero never facing a limp are different things, and dropping limps
      from the Phase 10 solve settles the first while making the second permanently
      unanswerable from that export. Opponents limp in real games: the refusal inventory
      already carries 12 limped rows and 21 of 3048 corpus decision points, and today's chart
      answers exactly one limp-facing spot, t6/d100/BB/SB:call, which a chart derived from a
      no-limp solve will lose. AGENTS.md forbids heuristic guessing for a missing chart spot,
      so the options are an honest refusal or reloading the saved solve with limps on and
      extracting that branch. Decision 1 keeps the save for exactly this.
  - id: GATE-COMMAND-DESCRIPTION-NAMES-A-WITHDRAWN-CHECK
    status: done
    phase: "11"
    title: check_solver_export_expectations still advertises the withdrawn directional bound
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: the COMMANDS entry in scripts/run_verify.py described the command as recomputing
      "the solver export's orderings and directional bound from the export". The directional
      bound was withdrawn on 2026-08-18 with the parity solve, and the command computes two
      internal orderings and nothing else. The registry is the list a reader scans to learn what
      the gate covers, so a description naming a check that does not exist is the same drift the
      contract's Scope section carried. Phase 10 could not fix it: the file left approved_scope
      at the freeze, and a description is not worth reopening a narrowed scope for.
      The entry now names no withdrawn check. The smallest of the six and the only one that is
      pure text, so it is pinned by a test rather than trusted:
      test_the_expectations_command_names_no_directional_bound, guarded by
      test_every_command_still_carries_a_description.
  - id: SOLVE-TARGET-LEAVES-A-NONMONOTONE-PAIR
    status: deferred
    phase: "14"
    title: At the ruled 0.01 bb target the pair ladder is still noisy in one cell
    reason: >-
      The committed export's LJ opening range raises 44 at 72.81 percent while raising 33 at
      99.88 and 22 at 99.92. A pocket pair that opens less often than both pairs beneath it is
      not poker, it is a hand that had not converged when the summed best-response gap crossed
      0.01 bb at iteration 300. Every other pair in every other opening spot sits above 99.8,
      so this is one cell rather than a pattern, and the target is decision 3 and may not be
      re-ruled by the phase that measured it. It matters to phase 14, which derives the chart:
      a cutover that copies frequencies cell by cell copies this one too, and 27 percent of a
      set-mining hand folded preflop is a real leak. Either re-solve to a tighter gap before
      deriving, or smooth the pair ladder with the reason recorded.
  - id: DEFENCE-RELATION-NARROWER-THAN-THE-CONTRACT
    status: deferred
    phase: contract-update
    title: The defence relation checks the small blind only as the wider opener
    reason: >-
      The phase 10 contract states the check as "against a position that opens wider, the big
      blind defends more, for every pair of positions". The frozen tests require something
      narrower: test_the_small_blind_is_out_of_the_opening_order_by_name_and_with_a_reason
      passes an export where the small blind opens 5 percent and is defended against most of
      all, so the relation cannot be symmetric over all five positions. As implemented, pairs
      inside LJ/HJ/CO/BTN are checked both ways and the small blind is checked only when it is
      the wider opener, which is the reading that satisfies both that test and
      test_the_defence_relation_covers_the_small_blind_even_though_the_order_does_not. The
      implementation follows the frozen tests, which are the specification. The contract's
      sentence should be narrowed to match at the next contract-update rather than left
      claiming a stronger check than exists.
  - id: LOOP-STAGE-4-RED-HIDES-LINT-AND-ASSERTIONS
    status: deferred
    phase: contract-update
    title: A stage-4 red on a missing module means no assertion and no linter ever read the tests
    reason: >-
      loop_stage.check_tests_authored accepts a ModuleNotFoundError as a legitimate red, which
      MAINT-04 ruled correctly: tests are authored before any implementation, so importing it
      is supposed to fail. The consequence nobody costed is that when the red is an import
      error, not one assertion in the file has executed and ruff has not read it either, so
      every authoring defect survives the freeze and surfaces at stage 7 where the file is
      frozen and the fix needs its own task. Phase 08 paid for it once with a 101-character
      line; phase 10 paid twice, with an exact-equality assertion against a real solver float
      and an unsorted import block. A cheap fix exists: run ruff over the phase's new test
      files at stage 4, and require that at least one test in the file reaches an assertion
      even when the module is missing. It belongs to whoever owns loop_stage.py, not to a phase
      that noticed it.
  - id: REALIZATION-MODEL-UNDERPRICES-POSITION
    status: deferred
    phase: "14"
    title: The button opens tighter than a raked reference and the big blind defends tight
    reason: >-
      GTOpen's preflop engine has no postflop play in it: a flop resolves at a pot_share
      terminal that splits by equity share, scaled by a per-seat realization weight. Two
      numbers in the committed rake-free export show what that costs. The button opens 40.26
      percent against a raked GTO Wizard reference's 40.56 - removing rake should not make the
      widest-opening non-blind position tighter, and the button's edge is almost entirely
      postflop position, which a scalar weight is the only part of the model that can express.
      The big blind defends 27.28 percent against a lowjack opening 19 percent while laying
      1.5 to win 4.5, which is 570 of 1326 combos, and 49.02 percent against a small blind
      opening 54 percent. Both are tight against what a full postflop solve gives at those
      prices, and both are the same mechanism seen from opposite sides. It is not an
      extraction defect: GTOpen's own interface shows the same numbers for the same save. It
      matters to phase 14, which decides whether a chart derived from this export is played,
      and the honest options are to accept the bias and record it in the chart's source card,
      to correct it with a stated adjustment, or to solve elsewhere.
  - id: LOOP-STAGE-10-DEMANDS-A-REVIEW-IT-FORBIDS-WRITING
    status: deferred
    phase: contract-update
    title: The closeout stage owes a review note that idle mode puts outside scope
    reason: >-
      loop_stage stage 10 requires task_mode idle, and MAINT-17 made every stage that produced
      a diff owe a review note under reports/phase_audits/reviews/<CONTRACT_STEM>/. Idle
      carries an empty approved_scope by AGENTS.md's closeout rule, and that directory is not
      in standing_scope, so the note the stage demands is out of scope by construction. Phase
      10 wrote one anyway: idle leaves base_commit null, check_scope then measures the diff
      against HEAD, and an already-committed file is invisible to it. Passing on a loophole is
      not the same as passing, and the next phase to reach closeout hits it again. Either the
      reviews directory joins standing_scope, or stage 10 stops owing a note, or the closeout
      writes its note before resetting to idle. It belongs to whoever owns loop_stage.py.
  - id: STRATEGY-QUERY-STREET-BET-NAME
