schema_version: 1
items:
  - id: V2-POKERNOW-AUTOMATION
    status: deferred
    phase: v2
    title: PokerNow automation and browser observation
    reason: Explicit v1 non-goal.
  - id: V2-TRAINING-UI
    status: deferred
    phase: v2
    title: Training UI package
    reason: V1 is CLI and report driven.
  - id: V2-LARGE-DATASET-COMPARISON
    status: deferred
    phase: v2
    title: Large hand-history corpus comparison
    reason: V1 allows only tiny normalized sample comparison.
  - id: CONTRACT-REPORT-PATHS
    status: done
    phase: contract-update
    title: Point Phase 01/07/08 contract report paths at distinct report files
    reason: Resolved by MAINT-01-AGENT-STRUCTURE; every contract now names a distinct report file and the shared latest_replay_report.txt path is gone.
  - id: UNDER-RAISE-ACCUMULATION
    status: deferred
    phase: engine
    title: Reopen betting when consecutive short all-ins reach a full raise
    reason: V1 keeps seats barred once an under-raise all-in occurs even if later short all-ins cumulatively amount to a full raise; real NLHE reopens raising there. Fail-closed but stricter than the live rule.
  - id: SECOND-ORBIT-PREFLOP-SPOTS
    status: deferred
    phase: charts
    title: Chart spots needing a position to act twice
    reason: V1 spot keys allow one entry per position, so any spot where a position acts twice (hero facing a 4bet or later) has no representable key; lookup misses those fail closed instead of guessing.
  - id: STACK-DEPTH-BUCKETS
    status: deferred
    phase: charts
    title: Stack-depth bucketing for chart lookup
    reason: V1 lookup requires an exact stack_depth_bb match. Nearest-depth or bucketed matching would be a heuristic, so an uncovered depth fails closed.
  - id: ASYMMETRIC-EFFECTIVE-STACKS
    status: deferred
    phase: charts
    title: Per-seat effective stack depth in chart spots
    reason: stack_depth_bb is one table-wide number, so hero at 100bb facing a 35bb opener cannot be expressed or queried; a caller must pick one number and silently answers a different question.
  - id: BLIND-STRUCTURE-VARIANTS
    status: deferred
    phase: charts
    title: Antes and straddles in the artifact format
    reason: The artifact declares no blind structure, so a straddled or anted pot reads as an ordinary one even though both materially change correct preflop ranges. Common in the home-game context this bot targets.
  - id: CONTRACT-CRITERIA-BACKFILL
    status: deferred
    phase: contract-update
    title: Backfill phase-specific acceptance criteria for phases 00, 01, and 02
    reason: check_contracts now requires an active or completed phase to carry at least three acceptance criteria that are not gate boilerplate. Phases 00 through 02 were closed with only the four boilerplate criteria, so their gates asserted little beyond the gate passing. They are explicitly exempted in CRITERIA_BACKFILL_EXEMPT because backfilling is a semantic contract change that needs contract-update mode, which the maintenance task that added the check may not do.
  - id: CHART-COVERAGE-EXPANSION
    status: deferred
    phase: charts
    title: More chart depths and spot classes beyond six-max 100bb first-two-decisions
    reason: Phase 05 commits one six-max 100bb solution covering opens, spots facing a single open, the opener facing a three-bet, and the big blind facing a limp. Other depths and the squeeze and cold four-bet classes are already representable and already indexed by depth, so they are additive data rather than format work; every uncovered spot refuses meanwhile.
  - id: PER-SEAT-CONTRIBUTIONS-IN-QUERY
    status: deferred
    phase: strategy
    title: Carry each seat's committed chips on StrategyQuery
    reason: StrategyQuery gives current stacks, the pot, and the price to call, but not what each seat has put in. Hero's own contribution is recoverable as street_bet minus to_call; nobody else's is. That blocks three things the preflop strategy currently approximates or misses. A short villain is indistinguishable from one who has already invested (ASYMMETRIC-EFFECTIVE-STACKS). A straddle is only detectable while the pot stays smaller than the blinds plus one full bet per voluntary action, so a straddled pot with several callers can slip through. An ante is only detectable by the same bound. Adding per-seat contributions makes all three exact rather than bounded, and is the same shape of fix as adding the preflop action history was.
  - id: RAISE-SIZE-IN-SPOT-KEY
    status: deferred
    phase: charts
    title: Record raise sizes in preflop spot keys
    reason: V1 spot keys record action names without sizes, so a 2.5bb open and a 4bb open share one spot. Sizing-aware spots need a size vocabulary the artifact format does not yet declare.
  - id: FOLD-WHEN-FREE
    status: deferred
    phase: engine
    title: Accept recorded folds when checking is free
    reason: The engine treats fold as illegal when to_call is zero, so real histories containing open folds (timeouts, surrendered rivers) fail replay; the strategy contract inherits the same invariant.
  - id: POSTFLOP-UNBEATABLE-EARLIER-STREETS
    status: deferred
    phase: strategy
    title: Extend the unbeatable call from the turn back to the flop
    reason: >-
      The postflop fallback calls a bet only when no possible villain holding beats hero,
      and only on the turn and the river. On the river a complete board makes that a
      990-holding enumeration. On the turn it means safe after every one of 46 river
      cards, which decomposes into 46 river checks - 45,540 evaluations, a few seconds,
      and affordable inside the exhaustive sweep, which is why the turn is now covered.
      The flop is not: two cards are still to come, so the claim runs over C(47,2) = 1,081
      holdings against C(45,2) = 990 runouts, 1,070,190 evaluations and roughly 83 seconds
      for one decision. A sampled version would turn the fact back into a guess, so the
      fallback folds flop bets meanwhile. Almost nothing qualifies on the flop anyway, so
      the cost is small and the fix is a faster evaluator rather than a new rule. The
      earlier version of this entry gave the flop as 903 runouts against 990 holdings and
      lumped the turn in with it; both figures were the river's own, shifted by a card,
      which is what kept the turn deferred for a phase longer than it needed to be.
  - id: FALLBACK-FAIL-CLOSED-CAN-CALL
    status: deferred
    phase: strategy
    title: The fallback's fail-closed branch can invest, and can refuse postflop
    reason: >-
      PostflopFallbackStrategy._fail_closed runs when the action the rules chose is not on
      offer, and takes the most passive legal action from ("fold", "call"). Where fold is
      absent that is a call, so a hand that can lose invests - which the phase contract
      forbids everywhere - and where neither is legal it returns a postflop refusal, which
      the contract says never happens. Neither branch is reachable from a legal-action set
      the engine's own legal_actions produces, and the phase enumeration confirms zero
      postflop refusals, but both are reachable from a contract-valid StrategyQuery:
      legal_actions ("call", "raise") calls, and ("raise",) refuses. The conservative
      fail-closed is fold-or-refuse and never call, and both codes want a direct unit
      test. Found by the Phase 06 stage 8 mechanical review, which could not fix it
      because tests/ was out of scope for that phase after the freeze.
  - id: V2-POSTFLOP-STRATEGY
    status: deferred
    phase: v2
    title: A postflop strategy that can bet and raise
    reason: V1 ships a fallback that never invests unless the investment cannot lose, so it never bets or raises. A bet needs a size, a size needs a source, and the only sizing source in the repo is the preflop solver export. Until a postflop solution is committed, an invented sizing scheme would produce postflop play that looks deliberate and is not.
  - id: STREET-BET-MEANING-AMBIGUOUS
    status: deferred
    phase: strategy
    title: Two readings of StrategyQuery.street_bet, and one consumer uses the wrong one
    reason: >-
      StrategyQuery.street_bet carries no docstring and two consumers read it
      differently. preflop_chart._table_depth_bb derives hero's starting stack as
      stacks[seat] + (street_bet - to_call), which is only meaningful if street_bet is
      the street's current bet level, and _blind_structure_is_representable compares it
      to the big blind on the same reading. The Phase 05 tests and the Phase 06 tests
      both use that reading. But scripts/generate_strategy_query_report.py passes
      player.street_bet, hero's own contribution, so replayed hands reach the chart with
      a mis-derived depth: the small blind in phase02-heads-up-showdown refuses with
      blind-structure-not-representable where the true miss is the table size. Found by
      the Phase 06 report lane. The fix is to name the meaning on the field and correct
      the one caller, which is Phase 03 scope and needs its own task.
  - id: DECISION-AUDIT-ALL-IN-BOUND-TOO-LOOSE
    status: deferred
    phase: strategy
    title: The decision audit's all-in ceiling is too high by the price to call
    reason: >-
      DecisionAuditRecord computes max_target as street_bet + stack for the acting seat.
      Under the canonical reading of street_bet as the street's current bet level, hero
      has already committed street_bet - to_call, so the true all-in raise target is
      (street_bet - to_call) + stack and the recorded ceiling is too loose by exactly
      to_call. With street_bet 20, to_call 20 and a stack of 100 the record accepts a
      raise to 120 and only rejects 121. No shipped strategy is affected today, because
      the only strategy that returns an amount is the preflop chart and it caps its own
      raise at street_bet + stack, but the legality proof several phase contracts lean on
      is weaker than those contracts say. Found by the Phase 06 report lane. Fixing it
      touches Phase 03's contract module and its frozen tests, so it needs its own task.
  - id: SAMPLE-HAND-THE-CHARTS-COVER
    status: deferred
    phase: samples
    title: No committed sample hand is a preflop spot the charts cover
    reason: >-
      The four hands in data/samples/normalized_hands.json were written to exercise the
      replayer and are two-handed and three-handed, so the six-max artifact refuses every
      preflop point in them. The Phase 06 report can therefore only show a hand as
      refuse-preflop-then-check-through rather than decide-preflop-then-check-through,
      which is the shape Phase 07 will want to measure. A six-handed 100bb normalized
      hand added to data/samples/ would close it, and committing sample data is a
      frozen-into-data decision that needs a human, so it is not a Phase 06 change.
