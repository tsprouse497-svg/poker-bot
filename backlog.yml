  - id: STRADDLE-SIGNAL-MISREADS-A-SHORT-ALL-IN-RAISE
    status: done
    phase: "13"
    title: The straddle detector's minimum-raise prediction reads a short all-in raise as a straddle
    reason: >-
      Closed inside phase 13, at stage 6, after being filed as deferred earlier in the same
      stage. The defect was real: the third straddle signal walked the recorded raises with no
      floor on the increment, and a history records a short all-in as an ordinary raise, so a
      seat shoving for less than a full raise predicted a smaller minimum than the engine offers
      and the strategy announced a straddle in a pot where nothing was forced. Worked case at
      50/100: the lojack opens to 250, a 300-chip stack shoves to 300, the engine correctly holds
      the minimum raise at 150 and offers 450, the unfloored walk predicted 350, and the bot said
      `pot-holds-a-straddle` about a 3bb shove.
      This entry first recorded it as deferred, on the builder's reasoning that flooring the
      increment would also hide a genuine straddle of exactly one big blind and that the right
      floor waited on MIN-RAISE-OVER-AN-INCOMPLETE-ALL-IN-BET. **That reasoning was wrong and the
      stage-6 poker review showed why.** A straddle perturbs only the FIRST increment, and that
      increment is a full raise measured from a level above the declared big blind, so it is never
      below the floor - flooring therefore detects every straddle the unfloored walk detected and
      costs nothing. The walk now mirrors `BettingRoundState.apply` exactly: the minimum starts at
      the big blind and a recorded raise updates it only when its own increment is at least the
      minimum standing.
      Verified rather than argued: the floored walk reproduces every minimum-raise target the
      frozen phase 13 tests pin, including both straddle detections at 1,100 against an offered
      1,000, the unstraddled negative control agreeing at 1,100, the three-bet table at 1,350 and
      the substituted-price probe at 350. The short-shove case now predicts 450 and agrees. It was
      unreachable on committed data - 0 of 515 preflop raises across the 499 corpus hands has an
      increment below the running minimum - which is why no test caught it and why an independent
      reviewer had to.
      Recorded as done rather than deleted, because the wrong reason is the useful part: an
      unreachable defect with a plausible argument for leaving it is exactly what a review is for.
  - id: MUTATION-DRILL-CHECKOUT-DESTROYS-UNCOMMITTED-WORK
    status: deferred
