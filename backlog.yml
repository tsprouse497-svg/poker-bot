      Five entries carry it now that are not contract edits.
      MUTATION-DRILL-CHECKOUT-DESTROYS-UNCOMMITTED-WORK and
      TABLE-STATE-REPORT-RENDERER-HAS-NO-SIZE-CAP are both about repo machinery.
