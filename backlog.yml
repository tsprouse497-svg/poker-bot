  - id: SOLVE-TARGET-LEAVES-A-NONMONOTONE-PAIR
    status: deferred
    phase: "14"
    title: At the ruled 0.01 bb target the pair ladder is still noisy in one cell
    reason: >-
      The committed export's LJ opening range raises 44 at 72.81 percent while raising 33 at
      99.88 and 22 at 99.92. A pocket pair that opens less often than both pairs beneath it is
      not poker, it is a hand that had not converged when the summed best-response gap crossed
      0.01 bb at iteration 300. Every other pair in every other opening spot sits above 99.8,
      so this is one cell rather than a pattern, and the target is decision 3 and may not be
      re-ruled by the phase that measured it. It matters to phase 14, which derives the chart:
      a cutover that copies frequencies cell by cell copies this one too, and 27 percent of a
      set-mining hand folded preflop is a real leak. Either re-solve to a tighter gap before
      deriving, or smooth the pair ladder with the reason recorded.
  - id: DEFENCE-RELATION-NARROWER-THAN-THE-CONTRACT
    status: deferred
    phase: contract-update
    title: The defence relation checks the small blind only as the wider opener
    reason: >-
      The phase 10 contract states the check as "against a position that opens wider, the big
      blind defends more, for every pair of positions". The frozen tests require something
      narrower: test_the_small_blind_is_out_of_the_opening_order_by_name_and_with_a_reason
      passes an export where the small blind opens 5 percent and is defended against most of
      all, so the relation cannot be symmetric over all five positions. As implemented, pairs
      inside LJ/HJ/CO/BTN are checked both ways and the small blind is checked only when it is
      the wider opener, which is the reading that satisfies both that test and
      test_the_defence_relation_covers_the_small_blind_even_though_the_order_does_not. The
      implementation follows the frozen tests, which are the specification. The contract's
      sentence should be narrowed to match at the next contract-update rather than left
      claiming a stronger check than exists.
  - id: LOOP-STAGE-4-RED-HIDES-LINT-AND-ASSERTIONS
    status: deferred
    phase: contract-update
    title: A stage-4 red on a missing module means no assertion and no linter ever read the tests
    reason: >-
      loop_stage.check_tests_authored accepts a ModuleNotFoundError as a legitimate red, which
      MAINT-04 ruled correctly: tests are authored before any implementation, so importing it
      is supposed to fail. The consequence nobody costed is that when the red is an import
      error, not one assertion in the file has executed and ruff has not read it either, so
      every authoring defect survives the freeze and surfaces at stage 7 where the file is
      frozen and the fix needs its own task. Phase 08 paid for it once with a 101-character
      line; phase 10 paid twice, with an exact-equality assertion against a real solver float
      and an unsorted import block. A cheap fix exists: run ruff over the phase's new test
      files at stage 4, and require that at least one test in the file reaches an assertion
      even when the module is missing. It belongs to whoever owns loop_stage.py, not to a phase
      that noticed it.
  - id: REALIZATION-MODEL-UNDERPRICES-POSITION
    status: deferred
    phase: "14"
    title: The button opens tighter than a raked reference and the big blind defends tight
    reason: >-
      GTOpen's preflop engine has no postflop play in it: a flop resolves at a pot_share
      terminal that splits by equity share, scaled by a per-seat realization weight. Two
      numbers in the committed rake-free export show what that costs. The button opens 40.26
      percent against a raked GTO Wizard reference's 40.56 - removing rake should not make the
      widest-opening non-blind position tighter, and the button's edge is almost entirely
      postflop position, which a scalar weight is the only part of the model that can express.
      The big blind defends 27.28 percent against a lowjack opening 19 percent while laying
      1.5 to win 4.5, which is 570 of 1326 combos, and 49.02 percent against a small blind
      opening 54 percent. Both are tight against what a full postflop solve gives at those
      prices, and both are the same mechanism seen from opposite sides. It is not an
      extraction defect: GTOpen's own interface shows the same numbers for the same save. It
      matters to phase 14, which decides whether a chart derived from this export is played,
      and the honest options are to accept the bias and record it in the chart's source card,
      to correct it with a stated adjustment, or to solve elsewhere.
  - id: LOOP-STAGE-10-DEMANDS-A-REVIEW-IT-FORBIDS-WRITING
    status: deferred
    phase: contract-update
    title: The closeout stage owes a review note that idle mode puts outside scope
    reason: >-
      loop_stage stage 10 requires task_mode idle, and MAINT-17 made every stage that produced
      a diff owe a review note under reports/phase_audits/reviews/<CONTRACT_STEM>/. Idle
      carries an empty approved_scope by AGENTS.md's closeout rule, and that directory is not
      in standing_scope, so the note the stage demands is out of scope by construction. Phase
      10 wrote one anyway: idle leaves base_commit null, check_scope then measures the diff
      against HEAD, and an already-committed file is invisible to it. Passing on a loophole is
      not the same as passing, and the next phase to reach closeout hits it again. Either the
      reviews directory joins standing_scope, or stage 10 stops owing a note, or the closeout
      writes its note before resetting to idle. It belongs to whoever owns loop_stage.py.
  - id: STRATEGY-QUERY-STREET-BET-NAME
    status: deferred
    phase: "13"
    title: StrategyQuery.street_bet is named for the reading it does not carry
    reason: >-
      The field holds the street's current bet level, and its name reads as hero's own bet
      this street, which is the wrong reading and is the one a producer already took. Phase
      11 documented the meaning, added a street_bet >= to_call guard, and corrected the one
      wrong producer, but left the name, because a rename touches eight producers, the
      serialized audit payload key and therefore DECISION_AUDIT_SCHEMA_VERSION, the Phase 03
      contract text, and frozen tests in four completed phases. The engine already calls this
      quantity current_bet on BettingRoundState, so the rename would leave one vocabulary
      instead of two. The measured limit on what phase 11 shipped instead: the guard catches a
      producer passing hero's contribution only when hero has put in less than half the
      current level, so it misses the heads-up small blind, who has put in exactly half.
      Recorded as decision 4 of PHASE_11_ENGINE_FIDELITY_DECISIONS.md. Proposed phase 13 is
      the phase that already opens the query and the Phase 03 contract.
  - id: STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS
    status: deferred
    phase: "13"
    title: to_call is capped at hero's stack by two producers and uncapped by three
    reason: >-
      RULED by Taylor on 2026-08-20: to_call is what hero would actually pay, capped at hero's
      remaining stack. The two capped producers are therefore right and the three uncapped ones
      are the ones to change - generate_strategy_query_report.py and the sample-replay site in
      generate_postflop_fallback_report.py already cap; simulator/table.py, comparison.py and the
      enumeration site in that same fallback script pass the level owed and must be brought over.
      What the ruling settles, and it settles more than expected. A capped hero can never raise,
      because the engine only offers raise when stack exceeds the price owed, so the all-in
      ceiling (street_bet - to_call) + stack is only ever applied to a hero who is not capped -
      and for an uncapped hero street_bet minus to_call IS hero's contribution. So the ceiling
      becomes sound under this ruling rather than needing new arithmetic. What makes it sound is
      a guard that does not exist yet: StrategyQuery must reject a query offering raise when
      to_call equals stacks[seat]. Measured on the branch - today such a query validates fine,
      and that is the only route by which the ceiling accepts a raise hero cannot make.
      What the ruling does NOT settle. PreflopChartStrategy._table_depth_bb derives hero's
      starting depth as stacks[seat] + (street_bet - to_call), and a capped hero can still call
      or fold, so the chart is still consulted. Measured: 30 bb derived where the truth is 25 bb,
      for a hero with 150 behind who has posted 100 into a level of 300, with no refusal and no
      signal. Phase 14 publishes chart numbers through that path. Hero's own contribution still
      has to become its own field, which is proposed phase 13's stated scope - per-seat committed
      chips through the query - beside ASYMMETRIC-EFFECTIVE-STACKS and STRATEGY-QUERY-STREET-BET-NAME.
      One consequence to carry into phase 13's stage 1: Phase 06's enumeration describes its
      short hero as 0 < stack < to_call, which the ruling makes inexpressible. The situation
      survives and its encoding changes to to_call == stack, so Phase 06's contract needs that
      restated when the ruling is implemented. The two capped records in
      latest_decision_audit.jsonl are correct under the ruling and need no repair.
      Found by an independent review of phases 10 and 11 on 2026-08-20; the false corollary was
      struck from the Phase 11 contract by MAINT-21, and no behaviour has changed yet.
  - id: CONTRACT-LINE-CAP-BLOCKS-ITS-OWN-AMENDMENT
    status: done
    phase: contract-update
    title: A completed contract at the 300-line cap cannot be corrected without deleting text
    reason: >-
      Resolved by the Contract Amendments section of AGENTS.md, on Taylor's ruling of 2026-08-20.
      The cap is capped at the amendment rather than raised at the file: an amendment is at most
      two lines plus the backlog id carrying the diagnosis, the reasoning lives here and in the
      audit packet where nothing is capped, and a contract that still fills up is due for a
      rewrite that folds its amendments into the criteria they amend, as its own contract-update
      task. Raising the cap to fit an amendment is forbidden by name, because that is widening a
      threshold so a check passes. The rule was applied to itself immediately: recording the
      to_call ruling was written into the existing three-line note on PHASE_11_ENGINE_FIDELITY.md
      without adding a line, so that contract is still at 300 and still amendable.
      What was wrong and is now fixed: amendments only ever add lines, so a long amendment style
      made the contracts that had been corrected most the first ones that could not be corrected
      at all - the check punished exactly the behaviour that keeps completed contracts honest.
  - id: PHASE-11-MOVED-NUMBERS-AWAIT-REMEASUREMENT
    status: done
    phase: "12"
    title: Numbers measured through the instrument phase 11 corrected are not re-measured
    reason: >-
      Closed by phase 12 at `d046ac9`. `reports/active/latest_spot_vocabulary_report.txt`
      restates every number the Phase 07 and Phase 08 packets quote, in a three-column table
      - what the packet published, what the committed report said at this phase's branch
      point, and what it says now - so packet-to-branch isolates Phase 11 and branch-to-now
      isolates this phase. Neither cause is asserted; both are differences between committed
      artifacts.

      The result is that Phase 11 moved none of them. 499 hands, 3,048 decision points, 290
      refusals, 439 of 456 for Pluribus and 2,155 of 2,302 for the humans are identical
      across all three columns. That is reported as a checked non-move rather than as
      silence, which is what this entry asked for.

      One number moved for this phase: inventory decisions naming no spot at all, 19 to 0.
      And one moved for a reason with no poker content, reported before a reader could
      misread it as coverage - the self-play profile comparison went 128 to 126 refused and
      472 to 474 measured, because `PreflopChartStrategy._seed` hashes the spot key, so
      re-keying re-seeds every mixed cell. That re-seeding will recur at every future
      vocabulary change and is filed as `RE-KEYING-RE-SEEDS-EVERY-MIXED-CELL`.

      No committed audit packet was edited. The stale figures are named where they sit,
      which required MAINT-25 first, because the fact-drift check was policing a finished
      phase's packet against numbers this phase moved.

      As filed: Phase 11 fixed the engine and the strategy query that every published measurement in
      this repo was taken through: a fold is now legal when checking is free, betting reopens
      when short all-ins accumulate, and the chart now receives the street's bet level rather
      than hero's contribution. Decision 9 of PHASE_11_ENGINE_FIDELITY_DECISIONS.md rules that
      the phase names the numbers it moves and recomputes none of them, because a fix phase
      that grades its own fixes puts a moved number and a mistaken one in the same commit. The
      consequence is that Phase 08's agreement rates, its refusal inventory, and the counts
      quoted in the Phase 07 and Phase 08 audit packets were all measured through the
      uncorrected instrument. Proposed phase 12 already re-runs the comparison, since the
      roadmap requires the refusal inventory to lose its catch-all row there; this item is the
      record that the re-run also has to restate the numbers phase 11 moved rather than only
      the ones the new vocabulary moves.
  - id: UNDER-SIZED-ALL-IN-BET-DOES-NOT-BAR-PRIOR-CHECKERS
    status: deferred
    phase: contract-update
    title: An all-in bet below the minimum clears the no-raise set it should leave alone
    reason: >-
      TurnState.apply clears no_raise on every BET, including an all-in bet below the
      minimum, so seats that already checked on that street keep their right to raise over
      it. Cardrooms bar them: an all-in wager that is less than a full bet does not reopen
      betting for a player who has already acted on that round, and checking is acting. The
      behaviour predates phase 11 and no phase 11 acceptance criterion names it, which is
      why phase 11 fixed the reference level the same branch computes and left this alone -
      a fix here would be behaviour no criterion asked for. Found by the phase 11 stage 8
      domain review alongside the reference-level blocker it did fix. It needs a contract
      that says what a short all-in bet does to the seats behind it, so it is
      contract-update work before it is implementation work.
  - id: MIN-RAISE-OVER-AN-INCOMPLETE-ALL-IN-BET
    status: deferred
    phase: contract-update
    title: The raise bar over an under-sized all-in bet is measured from the all-in amount
    reason: >-
      BettingRoundState.apply requires target - current_bet >= min_raise, so on a street whose
      minimum bet is 20, after an all-in bet of 5, it demands a raise to 25 and rejects 20.
      Measured on the branch. Most rooms allow 20: an incomplete bet does not set the raise
      increment, so the bar stays the round's minimum bet. It is the same rules question
      decision 3 of PHASE_11_ENGINE_FIDELITY_DECISIONS.md was, and the repo has no oracle for
      it, so whoever fixes it owes the ruling its own human gate rather than taking this
      reading on trust. Phase 11 edited the same branch - that is where the reopening
      reference-level fix landed - and left this alone because no acceptance criterion named
      it; it surfaced only when the full assumption inventory was written afterwards. It bites
      the same population as the two rules phase 11 did fix: real-room hands with short
      all-ins, of which the committed corpus has none.
  - id: DECISION-AUDIT-VERSION-SPANS-TWO-STREET-BET-READINGS
    status: deferred
    phase: contract-update
    title: One decision-audit schema version covers both readings of street_bet
    reason: >-
      Phase 11 corrected scripts/generate_strategy_query_report.py to pass the street's bet
      level rather than hero's own contribution, so that producer now emits a different number
      for the same spot, and DECISION_AUDIT_SCHEMA_VERSION stayed at 1. The field's name and
      type did not change, so not bumping is defensible - but nothing on an audit line says
      which reading wrote it, and a reader comparing a line from before the fix against one
      from after cannot tell a corrected instrument from a changed decision. Phase 11 treated
      "a corrected value is not a schema change" as obvious rather than as a call, which is
      why this is filed rather than ruled. The cheap fix is a line in the Phase 03 contract
      saying version 1 spans both readings and naming the commit that divides them; the
      expensive one is a version bump plus a reader that accepts both, which is more machinery
      than the problem justifies today.
  - id: FLEET-AND-STAGE-DRIVERS-DISAGREE-ABOUT-INTEGRATION
    status: deferred
    phase: contract-update
    title: Advancing stage 11 locks a lane out of its own integration runbook
    reason: >-
      Two disagreements between scripts/loop_stage.py and scripts/loop_fleet.py, both found
      driving phase 11 and both of which bite the next lane rather than that one. First,
      loop_fleet.lanes() counts only pointers at running or halted, deliberately and with a
      documented reason, so once stage 11 --advance writes loop: completed the lane vanishes
      and --integrate answers "no lane is running phase 11". Nothing in stage 11's own
      instruction - continue into the next phase, or halt - says to print the integration
      runbook before advancing, so the honest reading of the driver is the one that locks you
      out. Second, stage 10 instructs "tag phase-NN-complete ... commit, merge the branch"
      while --integrate prints the tag after the merge; phase 10 resolved it by tagging the
      closeout commit and then moving the tag onto the merge commit, where phase-10-complete
      sits today, and nothing records that as the intended resolution. A third, smaller one
      rides along: the runbook prints git -C REPO_ROOT checkout main, and REPO_ROOT is the
      worktree that owns the repository, which on a machine with a main lane already has main
      checked out elsewhere and refuses. It belongs to whoever owns the two drivers.
  - id: BACKLOG-DEFERRED-AGAINST-A-COMPLETED-PHASE
    status: deferred
    phase: contract-update
    title: The gate cannot see an item filed against a completed phase and still marked deferred
    reason: >-
      Phase 11 fixed six defects, went green across 41 commands, was tagged and merged, and left
      all six of its own backlog items at status deferred. Nothing caught it for a day, and the
      only reason it was caught at all is that somebody read the backlog and the audit packet
      side by side. backlog_errors in scripts/quality_checks.py validates ids, required fields,
      the status vocabulary, and that every id cited in docs or reports resolves to an item; it
      never compares an item's phase against that phase's status in phase_status.yml. An item
      filed against a completed phase that still says deferred is a self-contradiction the gate
      has no way to reach.
      It is not specific to phase 11. Every phase from here closes the same way, because
      AGENTS.md's Task Closeout does not tell a phase to settle the backlog items it just fixed
      either - the process rule is missing before the check is. That ordering is why this is
      filed as contract-update rather than as tooling: something has to say what the rule is
      before a check enforces it, and the same closeout probably owes the reverse direction too,
      since an item marked done whose phase is still future is the same contradiction mirrored.
      A deferred item filed against a future or non-phase label stays perfectly legal, which is
      most of this file.
      Found by MAINT-23, which did the bookkeeping and deliberately did not write the check,
      because a gate check added in the same commit as the correction it would have caught is a
      check reviewing its own motivation.
  - id: COMPLETED-LANE-POINTERS-ARE-NEVER-RETIRED
    status: deferred
    phase: contract-update
    title: A finished lane keeps its pointer, so the bare stage driver refuses and a reader is told a dead phase
    reason: >-
      Nothing retires a lane pointer when its phase completes. Stage 10 and 11 close the phase,
      tag it and reset the task to idle, and the pointer stays exactly where the lane left it.
      verification/loop_state.yml, the pre-fleet single-lane pointer, is still tracked and still
      reads phase 10, stage 11, loop completed in all four worktrees, and
      verification/loop_runs/11.yml says the same for phase 11.
      Two consequences. loop_stage.run_paths() counts every pointer on disk without looking at
      loop, so with no --phase it refuses to guess: the phase-11 worktree answers "2 lanes in this
      worktree (11, loop_state)" and the phase-12 worktree holds three. Every phase that finishes
      makes the bare invocation worse. loop_fleet.lanes() filters to running and halted, so the
      board is unaffected, which is most of why this went unnoticed.
      The second consequence has already cost something. loop_state.yml is the obvious file to
      read for the loop's state, it is tracked, and nothing in it says it is a legacy layout or
      that per-phase pointers exist beside it. On 2026-08-20 a session read it and reported the
      repo idle with phase 11 unstarted, while phase 11 was merged and tagged and phase 12 was
      live at stage 7 in its own worktree.
      Refusing to migrate a live lane mid-phase is deliberate and documented, but retiring a
      pointer whose loop is completed is not migration. Either the closeout stage deletes its own
      pointer, or run_paths ignores completed ones, and if finished pointers are wanted as history
      they belong somewhere that does not read as current state. That choice is a ruling about
      what a finished lane's pointer is, which is why this is filed as contract-update rather than
      as tooling. Same owner as FLEET-AND-STAGE-DRIVERS-DISAGREE-ABOUT-INTEGRATION.
      Duplicate of LOOP-LANE-POINTERS-NEVER-RETIRE, which the phase 12 lane filed hours earlier
      for the same defect and which this lane could not see until the merge. Both are kept and
      whichever task takes the ruling should close both; see
      TWO-LANES-CAN-FILE-ONE-DEFECT-TWICE for why two exist.
  - id: EXECPLAN-REQUIRED-FOR-A-TASK-WITH-NO-IMPLEMENTATION
    status: deferred
    phase: contract-update
    title: A task whose whole output is one backlog entry still has to invent an ExecPlan
    reason: >-
      scripts/check_execplan_delegation.py requires at least one file in docs/exec_plans/active/
      for every task_mode that is not idle, and validates a Delegation Plan inside it. That is
      right for a phase or a package, where the plan is how a coordinator states lanes, ownership
      and integration order before implementing anything. It fits badly on a task whose entire
      output is one backlog entry: there is nothing to delegate, so the plan reduces to a
      no-delegation exception, a restatement of the commit message, and slices already done by the
      time the plan is written. MAINT-24 wrote one to file a single item, and MAINT-25 wrote
      another to file this one.
      The evidence that the requirement is being evaded rather than merely felt as awkward is
      9eec03d, the seam filing: task_mode maintenance, docs/exec_plans/active/ holding nothing but
      .gitkeep, and the check unchanged since 4d4d528 when it was built. Either that commit's gate
      was red, or its plan existed untracked and is now gone. AGENTS.md's Task Closeout requires a
      passing gate before the commit, so both readings are process failures and neither was
      noticed at the time. MAINT-23, by contrast, wrote a real plan and passed honestly, so the
      requirement is satisfiable and this is not a claim that it cannot be met.
      Three directions, and choosing among them is a ruling rather than an implementation detail:
      exempt a task with an empty approved_scope from needing a plan, give a filing a smaller
      committed form than an ExecPlan, or keep the requirement and have AGENTS.md say plainly that
      filing a backlog item is a task like any other, plan included. Filed as contract-update
      because AGENTS.md and the check have to agree before either moves, and it belongs with
      COMPLETED-LANE-POINTERS-ARE-NEVER-RETIRED and
      FLEET-AND-STAGE-DRIVERS-DISAGREE-ABOUT-INTEGRATION rather than on its own.
      Phase 12 repeated it, which makes this a pattern rather than one phase's slip. d83405b
      closed CORPUS-INEXPRESSIBLE-SPOTS during the build and left RAISE-SIZE-IN-SPOT-KEY,
      SECOND-ORBIT-PREFLOP-SPOTS and PHASE-11-MOVED-NUMBERS-AWAIT-REMEASUREMENT deferred - the
      phase's three headline deliverables - and it was caught at stage 9 the same way phase 11
      was caught, by somebody reading the backlog beside the audit packet.
      That instance also sharpens what the check has to do. As described above it fires on an
      item filed against a completed phase, and phase 12 was `active` for the whole period the
      three entries were wrong, so the check would have reported the state only after closeout
      had committed it. Catching it earlier means either testing an `active` phase's items
      against the audit packet's own claims, which is not mechanical, or the closeout rule doing
      the work. That ordering is the argument for the contract-update half being load-bearing
      and the check being the smaller part.
  - id: LOOP-LANE-POINTERS-NEVER-RETIRE
    status: deferred
    phase: contract-update
    title: Completed lane pointers still count as live lanes
    reason: >-
      loop_stage.py names its own selection `live`, but run_paths() returns every file under
      verification/loop_runs/ plus the legacy verification/loop_state.yml, and nothing ever
      removes a pointer when a phase completes. So the count grows monotonically: opening the
      phase 12 lane made a bare `loop_stage.py` refuse with "3 lanes in this worktree (11, 12,
      loop_state)" while `loop_fleet.py --status` correctly said no lanes were running.
      Two costs, and the second is the one that bites. A bare invocation stops working
      permanently, which docs/LOOP.md still presents as the ordinary way to ask what stage you
      are on. And the error text asserts three live lanes when there are none, so a fresh
      session reading it concludes two other phases are mid-flight and coordinates around work
      that finished. By phase 16 it will name eight.
      Filed as contract-update rather than tooling because the fix is a ruling first: either a
      completed lane's pointer is retired at closeout, or `live` means "not completed" and is
      read from phase_status.yml, and the legacy loop_state.yml either migrates or is excluded
      by name. docs/LOOP.md then has to say which. Found by the phase 12 stage-1 review, which
      hit it opening the lane.
      Duplicate of COMPLETED-LANE-POINTERS-ARE-NEVER-RETIRED, which the main lane filed hours
      later for the same defect. Both are kept because deleting either destroys a filed finding
      and each carries evidence the other does not: this one has the bare-invocation error text
      and the by-phase-16 projection, the other has the tracked loop_state.yml reading phase 10
      in all four worktrees. Whichever task takes the ruling should close both.
      TWO-LANES-CAN-FILE-ONE-DEFECT-TWICE is why there are two.
  - id: ROADMAP-SPOT-COUNTS-DO-NOT-REPRODUCE
    status: deferred
    phase: contract-update
    title: The expressible-spot counts quoted through the v2 documents are wrong
    reason: >-
      docs/V2_ROADMAP.md states 1,691 expressible six-handed 100bb spots with limps and 848
      without, and says both are recomputable by enumerating solver_artifacts.schema.spot_key
      over action sequences. Doing exactly that on this tree gives 1,949 and 977. The phase 12
      stage-2 measurement enumerated every subsequence of the six-handed action order with each
      position acting at most once and each entry a call or a raise, kept what spot_key accepts,
      and counted distinct keys; a limped spot is one whose sequence contains a call with no
      raise before it.
      The ratio survives, 50.1 percent against 50.2, so this reads as one systematic difference
      rather than two independent errors, but no variation tried reproduces the published pair.
      Of the 1,949, hero has already acted in 1,586 and has not in 363, and 184 of the 977
      no-limp spots have hero not yet acting. None of those is 1,691 or 848.
      It matters because the numbers are load-bearing rather than decorative. The 12 MB artifact
      estimate in docs/V2_RULING_MITIGATIONS.md is 1,691 multiplied by a measured 7.1 KB per
      spot, and proposed phase 14 is scoped against both. A 15 percent error in the count is a
      15 percent error in the size a phase plans its artifact around.
      Filed as contract-update because the fix is four document edits and one of them changes
      what a phase is scoped to: docs/V2_ROADMAP.md in two places, and the artifact-size section
      of docs/V2_RULING_MITIGATIONS.md. Phase 12's report publishes the measured pair, which is
      what makes this a correction owed rather than an open question.
  - id: LOOP-STAGE-4-RED-WINDOW-HIDES-ASSERTIONS
    status: done
    phase: contract-update
    title: The stage-4 red check searched a window that could hold no assertion
    reason: >-
      Closed by MAINT-24, evidenced in docs/exec_plans/completed/MAINT_24_STAGE_4_RED_WINDOW.md.
      As found: run_command in scripts/loop_stage.py returned only the last 4000 characters of a
      gate command's output, and red_for_the_right_reason searched that window for an assertion.
      pytest ends with its FAILED summary list, which names every failing test and quotes none
      of them, so the window a long run leaves behind is exactly the part with no assertions in
      it. Phase 12's stage-4 suite produced 57,328 characters with 38 occurrences of "assert" and
      zero in the final 4,000, so a suite that was nothing but assertion failures read as a
      broken test file and stage 4 refused to advance.
      run_command now takes clip, defaulting to the same 4000 so every caller that prints a
      reason to a human keeps its readable tail, and check_tests_authored passes clip=None
      because it is the one caller that reads the text rather than printing it. Pinned by
      test_the_stage_four_check_reads_the_whole_output_not_its_tail, and guarded by
      test_run_command_clips_for_a_reader_and_not_for_a_reader_of_output so a later refactor
      cannot restore the bug by dropping the argument.
      Second time this check has rejected the state it exists to require; MAINT-04 was the
      first. LOOP-STAGE-4-RED-HIDES-LINT-AND-ASSERTIONS is the neighbouring item and stays open:
      it is about a red that is not an assertion at all, where no linter has read the file and no
      assertion has run, which this fix does not touch.
