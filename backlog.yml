  - id: NORMALISER-MEASURES-DISTANCE-IN-BIG-BLINDS
    status: deferred
    phase: "14"
    title: Nearest price is nearest in big blinds, and hero's range responds to a ratio
    reason: >-
      SolvedPriceIndex.normalise picks the candidate minimising abs(size - asked) in big
      blinds. The quantity that decides whether hero continues is not the absolute size but
      the price relative to what is already in: a three-bet to 12 over a 4bb open is a 3.0x
      and the same 12 over a 2.5bb open is a 4.8x, and those are different spots to a
      defender even though the key's number is identical.
      Latent today and provably so: every location in the committed artifact declares exactly
      one solved price, so normalise never chooses between candidates and the metric is never
      exercised. It goes live the first time a location holds two, which is what deriving a
      chart from the phase 10 export does. Concretely, with three-bets solved at 8 and 11 over
      a 2.5 open, an observed three-bet to 12 that arrived over an observed 4bb open is
      answered from 11 - a 4.4x - when 8 at 3.2x is the nearer price in the only unit the
      decision responds to.
      Filed against phase 14 rather than fixed in phase 12 because changing the metric changes
      which cell a price reaches, and phase 12's committed keys are what phase 14 is measured
      against. Found by the phase 12 stage-8 poker review.

      **This entry is filed the wrong way round, and the phase 13 stage-8 poker review measured
      it.** Reading it, the defect is a choice of metric that is latent because no location holds
      two candidates. Reading the code, the absence of a second candidate is not what makes it
      latent - it is what makes it LIVE. `normalise` applies no bound of any kind, so with one
      candidate per line every asked price collapses to the solved one however far away it is.
      The metric question is genuinely latent. The missing tolerance is not, and it is reachable
      on the flattest, most ordinary table this bot will ever see.

      Measured on a flat unstraddled six-handed 100bb table at 50/100, hero in the big blind.
      Twelve hand classes answered identically, hand for hand and weight for weight, against a
      2.5bb, a 4bb and a 5bb open. Against the 5bb open hero pays 400 into 650 for 38.1% pot
      odds out of position, from a cell solved for a hero paying 27.3%; 76s calls. Against a 20bb
      open it inverts outright: 76s still calls at 46.9% pot odds and AA REFUSES, and the aces
      refuse only because the charted 13.5bb three-bet falls below the minimum re-raise over a
      20bb open. That is a refusal by arithmetic accident. Nothing refuses the price itself, so
      every hand the cell calls or folds is answered whatever was bet.

      The raise size is wrong in the same direction. The three-bet is a fixed 13.5bb whatever the
      open was: 5.40x over a 2.5bb open, 3.38x over 4bb, 2.70x over 5bb, and 1.93x over a 7bb
      open, where the minimum legal re-raise is 13.0bb - so the bot min-three-bets aces. The
      corpus hides all of it, because only 3 substituted raises moved more than 3.00bb and 1,010
      of 1,025 moved toward the tighter range.

      Two consequences for whoever picks this up. First, the fix that matters is a BOUND that
      refuses a price too far from any solved one, and it is worth more than the metric change
      this entry was filed for - fail-closed is the house rule everywhere else in the chart path
      and this is the one place a price silently substitutes without limit. Second, and this is
      why phase 13's stage-8 review raised it at all: phase 13 spent itself refusing a table
      where one live opponent is off by a single chip, in the same tree where the bot calls off
      19bb with 76s because an open price was snapped by a factor of eight. The strictness is
      pointed at the wrong end of the game. A 5bb open is the standard open in exactly the home
      games phase 13's own contract says this bot is pointed at.
  - id: RE-KEYING-RE-SEEDS-EVERY-MIXED-CELL
    status: deferred
    phase: "14"
    title: A vocabulary change re-randomises every mixed decision, so self-play cannot regress
    reason: >-
      PreflopChartStrategy._seed hashes the spot key into the seeded draw that collapses a
      mixed cell, so re-keying the artifact re-seeds every mixed decision and a self-play run
      walks a different path through the same distributions. Phase 12 moved the profile
      comparison from 128 refused and 472 measured to 126 and 474 for exactly this reason and
      said so in its report, which is the honest handling of it.
      The cost is that the numbers cannot be used for what they look like they are for. Phase
      14 re-keys again when it derives a chart, and every self-play figure will move again for
      no poker reason, so a real regression arriving in the same phase is indistinguishable
      from the re-seed. The phases most likely to need a self-play regression signal are the
      ones guaranteed not to have one.
      A fix has to decide what the seed should be stable against - the hand and the spot's
      identity rather than its rendering - and that is a ruling about what a mixed cell's draw
      means, so it is filed rather than patched. Found by the phase 12 stage-8 poker review.
