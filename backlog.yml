    title: Restoring a hand-applied mutation with git checkout throws away the uncommitted build
    reason: >-
      The loop requires a builder to prove a canary bites, which means applying the mutation
      by hand and restoring the file afterwards. The obvious restore is
      `git checkout -- <file>`, and on a file that is modified against HEAD - which is every
      file a builder has just written - that restores the pre-phase version rather than the
      pre-mutation one, silently discarding the work being verified. Phase 13 hit it twice
      across two lanes and both workers noticed in time by taking a checksummed scratch copy
      instead.
      Nothing in the repo says so. docs/LOOP.md describes the drill without naming the
      hazard, and no check can catch it because the destroyed state was never committed. The
      fix is a rule in docs/LOOP.md, or a helper that snapshots and restores, and either is
      loop-driver territory a phase task must not reach. Filed as contract-update on the
      LOOP-STAGE-4-RED-HIDES-LINT-AND-ASSERTIONS precedent.
  - id: TABLE-STATE-REPORT-RENDERER-HAS-NO-SIZE-CAP
    status: deferred
    phase: contract-update
    title: The report renderers under scripts/ are capped by nothing and one is now 1889 lines
    reason: >-
      check_file_sizes caps src/**/*.py at 500 lines, tests at 700, contracts at 300 and
      several document classes besides, and covers scripts/ with nothing at all. Phase 13's
      generate_table_state_report.py is 1,889 lines, larger than any module in the repo by a
      factor of nearly four, and it got there legitimately: the module/render split the cap
      forces put the measurement and its validators under table_state/, and everything the cap
      did not reach went into the script.
      So the cap did not prevent a large file, it chose which file would be large, and the
      one it chose is the one nothing measures. The same pressure will recur at every phase
      that owes a human-readable report - phase 08 already split comparison.py for it. The
      answer is a limit on scripts/**/*.py with a number somebody rules on, which is
      check-script territory a phase task must not reach. Found by the phase 13 stage-6
      report builder, which flagged its own module as one line from the cap.
      Sharpened by the stage-6 review across three fix rounds, because the pattern is worse than a
      single tight file. Round two paid for a new validator by moving a probe set out of
      measures.py into the uncapped script, buying 26 lines and spending 27 - so the module the
      relocation was meant to relieve ended at 500 of 500 while preflop_chart.py fell back to 499.
      Two consecutive fix rounds each ended with one of the two files exactly at the cap. The cap
      is not preventing large files, it is choosing which file grows, and it keeps choosing the
      one nothing measures: the renderer went 1,135 to 1,195 to 1,372 lines over the same rounds.
      Any further work on this report has to start by paying a line for a line in a file with no
      headroom, which is the point at which a reviewer stops being able to tell a trimmed docstring
      from a lost argument - and one round of trimming already dropped half of a stated residual
      out of the code, caught only because a reviewer read every removed line.

      **Re-measured after stage 8, and both halves of the pattern got worse.** The renderer is now
      1,889 lines - 1,135 to 1,195 to 1,372 to 1,889 across four rounds - grown by the stage-8
      round adding the four-structure blind-structure measurement and its validator,
      one_key_two_tables replacing a demonstration that verified a pair of English labels,
      validate_bound_coverage, validate_residual_seat, and a census probe carrying two dead blinds
      of different sizes so the residual-seat rule has something that distinguishes it. Every one
      of those is a check that makes a published claim falsifiable, which is the work this repo
      most wants done, and every one of them landed in the file nothing measures because that is
      the only file with room.
      The capped side is now pinned rather than merely tight. measures.py had to be split at stage
      8 when the fix round pushed it to 613 and contract.py to 515; they sit at 340, 338 and 498.
      But src/poker_training_bot/strategy/preflop_chart.py is at exactly 500 of 500, so the next
      edit to it, however small, reddens check_file_sizes before it is reviewed. That is the same
      trap as ENGINE-FIDELITY-CONTRACT-IS-AT-ITS-LINE-CAP, where PHASE_11_ENGINE_FIDELITY.md sits
      at exactly 300 of 300 and therefore cannot take the two-line amendment it owes - two files in
      one repo now converting any future one-line fix into a refactor, one source and one contract,
      found in the same phase.
      So the ruling this entry asks for is wider than a number for scripts/**/*.py. A cap that only
      fails after the fact punishes the correction rather than the growth, and AGENTS.md forbids
      raising a cap to fit an amendment, which is the right rule and is exactly what leaves a file
      at the cap with nowhere to go. What is worth ruling alongside the scripts/ limit is a warning
      band - a check that reports a file within some margin of its cap while there is still room to
      act - so that a file arrives at its cap as a scheduled split rather than as a surprise in the
      middle of a fix. Still check-script territory a phase task must not reach.
  - id: STRADDLE-INVISIBLE-AFTER-A-SECOND-RAISE
    status: deferred
    phase: strategy
    title: A straddled pot with two or more recorded raises reaches the chart and is answered
    reason: >-
      Phase 13's third straddle signal compares the minimum raise the query offers against the
      one the declared blinds and the recorded raise-to amounts predict. That prediction is the
      final level plus the last increment, and a straddle perturbs only the FIRST increment, so
      past one raise the prediction is a difference of two recorded amounts and is identical
      straddled or not. Signal 1 cannot help, because a raiser's predicted contribution is its
      own raise-to amount and that absorbs any forced money it posted earlier; signal 2 is
      absorbed the moment the straddler acts. So signal 3 fires only on single-raise pots, which
      is what every fixture and probe for it happens to be.
      The consequence is worse than a mis-coded refusal, and it is the one place phase 13's
      headline claim does not hold. Constructed on committed code with no mutation: 50/100
      declared, a straddle to 200, a raise to 500, a three-bet to 2700, and `chart_lookup`
      returns a ChartHit while `weights_for` hands back the UNSTRADDLED range through a price
      substitution. That is answering a straddled spot by reaching for a neighbouring cell,
      which the phase 13 contract names as a forbidden shortcut.
      Not fixable inside phase 13's vocabulary, and this is the reason rather than an excuse: the
      straddle's trace is genuinely destroyed once its poster raises, and the only thing that
      recovers it is a declared blind structure on the query, which decision 8 considered and
      declined as the format change the phase is scoped out of. Any guard written without it
      over-refuses ordinary unstraddled tables. Found independently by both phase 13 stage-6
      reviewers; the mechanical one produced the ChartHit.
  - id: SEAT-STATE-MARKERS-AGREE-WITH-NOTHING
    status: deferred
    phase: strategy
    title: The per-seat folded and all-in markers are validated by nothing and cross-checked against nothing
    reason: >-
      Decision 5 put an explicit folded marker on the query rather than deriving it, and decision
      14 put an all_in marker beside it, both on the reasoning that deriving either is wrong at
      the edges. Both arguments hold. What neither decision provided is a check: `SeatState.all_in`
      is read by no decision path at all, and `folded` is read only by the live-seat filter, so a
      producer that sets either wrongly is caught by nothing.
      Decision 5 saw half of this and said so - the pot reconciliation cannot catch a mis-set
      folded marker, because a folded seat's chips are in the pot either way - and concluded that
      over-refusing is the safer failure. That is true and it is not the same as being checked.
      The markers can also disagree with the rest of the query without objection: an all-in seat
      with chips behind, a folded seat that the recorded action history shows still acting, a seat
      marked neither that has nothing behind and owes nothing. Each is expressible today.
      Closing it means cross-validating the markers against `stacks` and against
      `preflop_actions`, which is query-validation work rather than poker work. Found by the phase
      13 stage-6 mechanical review.

      **The same root, found again at stage 8, on the field beside them.** `preflop_actions` was
      validated as a bag of seats rather than as an action sequence: entries had to be SeatActions
      naming seats at the table, and nothing checked that the sequence was one a betting round can
      produce. Three consumers each then reconstructed their own inconsistent defence against the
      histories that got through, which is how a raise-to below the standing level corrupted both
      level walks in table_state/forced_money.py and made the strategy announce a straddle, and
      then a residual, about a pot with nothing forced in it. Phase 13 closed that one class at the
      boundary - the query now walks the level through preflop_actions and refuses a raise-to that
      does not exceed it - and the general point is the one filed here: a query field validated for
      well-formedness but not for reachability pushes the real check out to every consumer, and the
      folded and all_in markers are the same shape of hole with no boundary rule yet. The answer is
      one validation rule on the query rather than three patches, and it should be ruled once
      across the markers and the history together. Raised by the phase 13 stage-8 mechanical review
      and appended here, which is where that note said it belonged.
  - id: SPOT-KEY-LEGAL-ORDER-OVERCLAIM-IN-PHASE-12-CONTRACT
    status: deferred
    phase: contract-update
    title: A completed Phase 12 acceptance criterion still claims the spot key validates a legal preflop order
    reason: >-
      Phase 13 corrected `spot_key`'s docstring, which claimed the module validates a "legal
      preflop order" when the check behind it verifies the action order and that hero is still to
      act, and never verifies a price: it applies no minimum-raise rule, carries one table-wide
      depth rather than a per-seat one, and cannot tell a short all-in call from a full call.
      Correcting only the docstring leaves `docs/phase_contracts/PHASE_12_SPOT_VOCABULARY.md:105`
      asserting the stronger claim, and a contract outranks a docstring for the next reader.
      The phase 13 contract anticipated exactly this and offered two ways out - amend the Phase 12
      contract, or file the mismatch by id. Amending a completed contract needs contract-update
      mode, which an implementation task may not enter, so this is the filed alternative rather
      than an oversight. Found by the phase 13 stage-6 mechanical review, which noticed the
      contract's own alternative had been taken by neither route.
  - id: BIG-BLIND-ANTE-CLASSIFIES-AS-THE-RESIDUAL
    status: deferred
    phase: strategy
    title: A big-blind ante is refused as unrepresentable rather than as an ante
    reason: >-
      Phase 13 reads forced money as an ante when every seat carries the same unexplained amount,
      and as the kept residual `blind-structure-not-representable` otherwise. A big-blind ante -
      one seat posting the whole ante for the table, which is the standard modern tournament
      structure - therefore lands in the residual. The arithmetic is right: a 50/100 game with a
      100 big-blind ante gives 250 in the middle and hero still owes the full 100, which is what
      a real room gives. Only the classification is wrong, and decision 16's whole argument for
      two codes is that an ante and a straddle change the correct ranges differently. A five-of-six
      ante, one seat sitting out, lands in the residual for the same reason.
      Recorded as not fixable in phase 13 rather than missed. A single-seat ante and a folded
      seat's dead blind are indistinguishable from the query alone - both are one seat holding
      unexplained money - and a frozen phase 13 test pins the dead-blind case to the residual code.
      Telling them apart needs the declared blind structure decision 8 declined, the same field
      STRADDLE-INVISIBLE-AFTER-A-SECOND-RAISE waits on. Found by the phase 13 stage-6 poker review.
  - id: DEPTH-CHECK-ORDER-HIDES-THE-SHORT-OPPONENT
    status: deferred
    phase: strategy
    title: Deeper-before-shallower means the depth a re-ruling needs is recorded in under one spot in eleven
    reason: >-
      Decision 7 checks a live seat DEEPER than hero before a live seat SHALLOWER, and its stated
      reason is compatibility: deeper is the check that already existed and keeping its precedence
      means no spot changes which code it refuses with. In poker the two are not comparable.
      Effective stack is the minimum of hero and villain, so a live opponent deeper than hero
      barely moves hero's correct preflop range in a cash game, while a live opponent shorter than
      hero changes it completely. The order puts the near-harmless condition in front of the
      decisive one.
      Measured over 4,000 plausible live 1/2 tables with whole-dollar stacks from 30 to 600:
      `table-is-not-one-flat-stack-depth` fires 40.3 percent of the time and
      `a-live-seat-is-shorter-than-hero` 8.8 percent. With five opponents somebody is almost
      always deeper, so the code decision 6 exists to create only fires when hero happens to be
      the deepest player at the table. The shortest live opponent's depth is the one number a
      tolerance band would have to be set against, and it therefore reaches the refusal inventory
      in fewer than one spot in eleven - which is a problem for whoever re-rules decision 6, since
      the inventory is the evidence that re-ruling was meant to rest on.
      Re-ordering is a re-ruling of decision 7 and so belongs to a contract-update task with the
      decision record open, not to an implementation edit. Found by the phase 13 stage-6 poker
      review.
  - id: QUERY-CANNOT-EXPRESS-A-DEAD-BLIND
    status: deferred
    phase: strategy
    title: StrategyQuery carries two live blinds and cannot say a blind is dead or partial
    reason: >-
      `StrategyQuery.blinds` is a two-tuple of positive amounts with the small no larger than the
      big, so a dead big blind, a partial live blind, and a game running more than two blinds are
      all inexpressible. Phase 13's stage-6 poker review set out to ask what the straddle and ante
      detection does with a dead big blind and could not put the case in front of the detector at
      all, which is a gap in what the query can SAY rather than a defect in what the detection
      does with it.
      The nearest expressible thing is extra unexplained money on one seat, which reaches the kept
      residual code, so nothing is currently answered wrongly. It matters because a dead blind is
      ordinary in the home games this bot is pointed at, and because the phase 13 detection is
      built on reconstructing each seat's holding from the DECLARED blinds - a declaration that
      cannot describe the game is a reconstruction that starts from the wrong number. Same
      declared-blind-structure work as BLIND-STRUCTURE-VARIANTS.
  - id: ALL-IN-SEATS-COUNT-AS-SEATS-THAT-CAN-ACT
    status: deferred
    phase: strategy
    title: The flat-table check compares all-in seats, while every prose justification for it says it should not
    reason: >-
      `_table_depth_bb` excludes only seats marked `folded`, so a seat that is all-in is compared
      against hero's depth as though it could still act. Its own docstring justifies the rule as
      "effective stack is pairwise and against seats that can still act", decision 6 of the phase
      13 record justifies the folded exemption in the same words, and the engine defines a seat
      that can act as not folded, not all-in, and holding chips. Three statements, one behaviour,
      and they disagree.
      Measured: 50/100 six-handed, a 20bb seat shoves, two 100bb seats call, hero is the big
      blind at 100bb. The refusal is `a-live-seat-is-shorter-than-hero (seat 2, starting_chips
      2000, stack_depth_bb 20)`. It calls an all-in seat a live seat, and the stated reason for
      choosing the shortest seat - that it caps hero's effective stack and is the number a future
      tolerance would be set against - is false here: hero's effective stack against the two
      seats that can still act is 100bb, and the 20bb reported caps nothing hero can still choose
      to risk. A covered short all-in pins the reported depth to a dead stack permanently.
      It reaches committed evidence. On `phase02-three-way-side-pot` from seat 0's chair the
      reported deeper seat is seat 2, which is all-in; excluding all-in seats would name live
      seat 1 at 10bb instead. That row is the phase's single behavioural change in a committed
      report.
      **Not a request to exempt all-in seats.** A short all-in genuinely un-flattens the table
      and refusing is right poker. What is wrong is that the reported number is not an effective
      stack, and whoever re-rules decision 6 will set a tolerance against it. Fixing it means
      ruling what "which seats count" means and saying it once, which is decision-record work
      rather than an implementation edit. Found by the phase 13 stage-8 poker review.
  - id: STRADDLE-REFUSAL-DOES-NOT-SAY-WHICH-GAME-IT-IS
    status: deferred
    phase: strategy
    title: A straddle refusal reports the detector's arithmetic instead of the game being played
    reason: >-
      One straddle produces two disjoint detail vocabularies depending on which signal caught it:
      `bet_level` and `big_blind` in an unraised pot, `min_raise_target` and `predicted_min_raise`
      after a raise. The second describes the DETECTOR rather than the table. Neither reports what
      decides the poker, which for a 200 straddle at 50/100 is that the table is a 100/200 game
      with 50bb stacks. A work-list reader cannot group the two rows and cannot tell which depth a
      chart phase would have to solve.
      The phase also nowhere records the distinction a strong player uses constantly, and it is
      the thing that turns this from a labelling complaint into a work list. A BIG BLIND straddle
      is a pure blind-level change: the order is unchanged, the straddler still acts last preflop
      and first postflop, so 50/100 with a 200 big-blind straddle IS a 100/200 game at 50bb with
      an undersized small blind, and it would be answerable from a `d50` artifact nobody has
      solved yet. A UTG or button straddle is a blind-level change PLUS a position permutation -
      at six-max a lojack straddle makes the preflop order HJ, CO, BTN, SB, BB, LJ, so the
      straddler holds the big blind's preflop slot and the lojack's postflop slot, and no
      relabelling of an existing chart covers it. One is a depth problem and the other is a new
      solve. Phase 13 merges both under one code, one detail shape and one sentence, which is true
      and teaches nothing. Found by the phase 13 stage-8 poker review.
  - id: REFUSAL-INVENTORY-FRAGMENTS-ON-PER-SEAT-DETAIL
    status: deferred
    phase: simulator
    title: The refusal inventory keys on the whole detail tuple, so exact per-seat chips shatter it into singletons
    reason: >-
      `SimulationResult.refusal_inventory` groups rows on the refusal code plus the ENTIRE detail
      tuple, with `hand_class` lifted out. That worked while the detail was a low-cardinality
      spot key. Phase 13's stage-6 fix gave all three depth codes `seat`, `starting_chips` and
      `stack_depth_bb`, rendered exactly, for the good reason that whoever re-rules decision 6
      needs the numbers - and at a real table every hero stack is distinct, so
      `stack-depth-not-a-whole-big-blind` yields one singleton row per distinct chip count, each
      rendering as `(no expressible spot)` with a count of 1. The row that used to say "go solve
      `t6/d100/BB/CO:raise@2.5`" is gone.
      This is the repo's most useful artifact degrading: the inventory is described as the work
      list for whatever chart phase comes next, ordered by how many hands reached each spot, and
      a list of singletons ordered by a count that is always 1 is not a work list. Both committed
      inventories are byte-identical today, which is exactly why nothing caught it - the flat
      corpus and the flat-stack simulator cannot produce a depth refusal at all.
      The fix that made refusals informative for the re-ruling is the same one that made them
      useless for grouping, so the answer is not to undo either: the inventory needs a per-code
      grouping key rather than the whole detail tuple. It lives in `simulator/measure.py`, which
      phase 13 has no business in. Found by the phase 13 stage-8 poker review.

      **The same detail tuple is also INCOMPLETE, and the two faults have one fix.** A second
      stage-8 poker reader found that `_depth_refusal` names only the villain: `seat`,
      `starting_chips` and `stack_depth_bb` for the offending seat, with hero's own depth
      nowhere in the detail for either `a-live-seat-is-shorter-than-hero` or
      `table-is-not-one-flat-stack-depth`. Measured:
      `a-live-seat-is-shorter-than-hero (seat 2, starting_chips 2000, stack_depth_bb 20)`.
      Effective stack is `min(hero, villain)` and a tolerance is a ratio or a difference, so both
      need both numbers. The stated purpose of this detail is that whoever re-rules decision 6
      needs a figure that cannot be backfilled - and half of it cannot be backfilled either: a
      20bb opponent against a 100bb hero and a 20bb opponent against a 25bb hero are one row
      today and are different tables.
      Recorded here rather than fixed in phase 13 because the two findings pull opposite ways on
      the same tuple. Adding `hero_starting_chips` and `hero_stack_depth_bb` is additive and
      changes no refusal code, but at a real table it also makes every row a singleton harder,
      so fixing the completeness half alone deepens the fragmentation half. The single design
      that answers both is a per-code grouping key plus a complete pairwise detail, ruled once.
  - id: ANTE-WITH-A-SHORT-ALL-IN-CALLER-TAKES-THE-RESIDUAL
    status: deferred
    phase: strategy
    title: A uniformly anted table is named after one seat's ante as soon as somebody calls all-in for less
    reason: >-
      The ante branch classifies forced money as an ante only when every seat holds the same
      unexplained amount. A seat that calls all-in for less than the level is below its predicted
      contribution, so it drops out of the unexplained set entirely, the seat count no longer
      matches, and a table where all six seats posted the same ante is refused as
      `blind-structure-not-representable` named after one seat's ten chips.
      Measured: 50/100 six-handed with a 10 ante from every seat, the cutoff opens to 250, and a
      200-chip stack calls all-in for 190. An all-in RAISER survives and still reports
      `pot-holds-an-ante (ante 10)`; it is specifically the sub-level call that breaks it. Antes
      plus a short all-in caller is the commonest shape in tournament poker, so this trigger is
      far more common than the big-blind-ante case filed as
      BIG-BLIND-ANTE-CLASSIFIES-AS-THE-RESIDUAL, and it has the same root: uniformity across
      every seat is too strong a test for "this is an ante". Found by the phase 13 stage-8 poker
      review.
  - id: BLIND-RATIO-NEVER-CHECKED-AGAINST-THE-SOLVED-STRUCTURE
    status: deferred
    phase: "14"
    title: The committed artifact does not declare its blind structure, and nothing compares the table's ratio against it
    reason: >-
      `data/artifacts/preflop/six_max_nl25_100bb.json` declares `table_size` and
      `stack_depth_bb` and says nothing about the blinds it was solved at. `StrategyQuery.blinds`
      carries the real ratio and no consumer reads it for that purpose: `contract.py` validates
      only `0 < sb <= bb`, `SimulationConfig` the same, `data_pipeline/corpus.py` accepts any two
      positive blinds, and no comparison of `small_blind` against `big_blind / 2` exists anywhere
      in `src/` or `scripts/`.
      Measured, hero in the small blind facing a 2.5bb button open, all 169 canonical hand
      classes through `weights_for`. At 50/100 hero pays 2.000bb into 4.000bb for 33.3% pot odds.
      At $1/$3 hero pays 2.167bb into 3.833bb for 36.1%; at $2/$5, 2.100bb into 3.900bb for
      35.0%; at $5/$5, 1.500bb into 4.500bb for 25.0%. Zero of 169 hand classes moved a single
      weight in any of the three, and zero refused. An 11-point swing in the price hero is
      offered, and not one weight responds to it.
      These are the target games. The contract names home games twice and the report says "common
      in the home games this bot is pointed at" about the straddle. $1/$3 and $2/$5 are the
      dominant live and home structures and $1/$1, $2/$2 and $5/$5 are ordinary home
      configurations; $1/$2, the only common structure with sb = 0.5bb, is the exception rather
      than the rule. `corpus.py` would parse a $1/$3 history today without complaint and every
      agreement rate computed from it would be graded against a half-blind solve with nothing
      anywhere saying so.
      It is also this phase's own standard applied inconsistently: phase 13 refuses a table where
      one live opponent's starting stack differs by a single chip, an effect of exactly zero, and
      answers a $5/$5 game where the small blind's dead money is doubled and hero's continuing
      price moves by a third. The small blind's extra half a big blind is forced money the format
      does not declare, which is the same sentence the ante refusal rests on.
      **Filed against phase 14 rather than fixed in phase 13, and the reason is the phase's own
      thesis.** The check is cheap and needs no format change - the blinds are already on the
      query. What is missing is the other operand: the ratio the artifact was solved at is not
      recorded anywhere, so any check written today would hardcode a reconstruction of an
      undeclared property of a committed artifact, which is precisely the defect phase 13 exists
      to end appearing inside the phase that ends it. The fix is to make the artifact declare its
      blind structure and then compare, which is artifact work. Phase 13's honest half was done:
      the report's headline claim is narrowed and the measurement above is on the page. Found by
      the phase 13 stage-8 poker review.
      One layer below this, and recorded here so the fix is not scoped to the artifact alone:
      `hand_history.schema.BlindStructure` is exactly small_blind and big_blind and rejects a small
      blind above the big one, so the recording format cannot hold a straddle or an ante either -
      but $5/$5 does construct, which is why the game this entry measures is recordable and then
      silently answered. Filed in full under BLIND-STRUCTURE-VARIANTS.
  - id: COVERING-STACK-REFUSES-WITH-NO-POKER-CONTENT
    status: deferred
    phase: strategy
    title: The deeper branch of the flat-table test refuses tables a strong player would play from the 100bb chart
    reason: >-
      Effective stack is pairwise and is the minimum, so when hero holds exactly 100bb and every
      live opponent covers hero, hero's effective stack against each of them is exactly 100bb and
      `d100` - the only chart this repo holds - is the correct chart. The bot refuses.
      Measured at 50/100 with hero pinned at exactly 100bb, the only answerable depth, over 4,000
      six-handed tables with the other five stacks drawn uniformly from 40bb to 300bb, all live:
      3,997 tables (99.9%) refuse `table-is-not-one-flat-stack-depth` and 3 (0.1%) refuse
      `a-live-seat-is-shorter-than-hero`. Of the total, 1,046 (26.1%) are tables where EVERY live
      opponent covers hero - the chart is right and the bot refuses. Villains at 100.01bb against
      a 100bb hero is enough: `table-is-not-one-flat-stack-depth (seat 2, starting_chips 10001,
      stack_depth_bb 100.01)`. Villains at 300bb returns the same code.
      So better than one table in four, among those where hero is on-chart, is refused for a fact
      about the game that changes nothing hero can do. The other branch has real poker content -
      a 20bb seat behind genuinely changes hero's ranges - and the phase has the two backwards in
      weight: the branch with no content fires first and swallows almost everything, and the
      branch decision 6 was created for is measured at 0.1% here. This is a different claim from
      the stage-6 note's decision-7 finding, which argued about ordering and about which depth
      reaches the inventory; the claim here is that the deeper branch should not be a refusal at
      all, because a covering stack is not a table shape but the ordinary condition of every real
      cash game.
      Deferred rather than fixed because Taylor ruled decision 6 at exact equality on 2026-08-21
      and frozen tests pin it, so reversing it is a task with `tests/**` reopened. What the record
      should carry is what he was actually asked: one question covering two cases with opposite
      poker content, whose stated alternative was framed entirely around an opponent "short enough
      to change the price hero is being offered". The covering case was never put to him, and the
      deeper check inherited exact equality by default from a pre-existing rule rather than by
      ruling. Whoever re-rules decision 6 should rule the covering case separately, and the
      natural answer is that it does not refuse. Found by the phase 13 stage-8 poker review.
  - id: LIVE-BLIND-LEVELS-MAKE-ORDINARY-OPENS-UNRENDERABLE
    status: deferred
    phase: "14"
    title: The only price guard in the chart path fires on a divisibility accident rather than on poker
    reason: >-
      `PreflopChartStrategy._size_bb` refuses a raise-to that is not an exact hundredth of a big
      blind, which is a property of the blind level rather than of the poker. At 50/100 it never
      fires. Measured with hero in the big blind and the cutoff opening, in a $1/$3 game where
      100bb is $300: $6 (2.000bb), $9 (3.000bb), $12 (4.000bb) and $15 (5.000bb) all render
      exactly and are answered, each substituted down to the solved 2.5bb cell, while $10
      (3.333bb) and $20 (6.667bb) are refused
      `raise-price-not-a-whole-hundredth-of-a-big-blind`. $10 is the standard open in a live $1/$3
      game. It is refused, while $15 - a strictly worse fit to the 2.5bb cell - is answered by
      snapping the price down by a factor of two. In a $2/$5 game, where 500 divides more of the
      plausible opens, every open from 3bb to 6bb renders exactly and nothing refuses at all.
      So the one guard in the chart path that does fail closed on price is gated on whether
      `open_chips / (100 * bb)` terminates in two decimal places, and at exactly the stakes where
      opens are largest and most varied it fires effectively at random, uncorrelated with how far
      the asked price is from any solved one. It should be replaced by, or subordinated to, a
      bound on the substitution distance - which is the fix the addendum to
      NORMALISER-MEASURES-DISTANCE-IN-BIG-BLINDS already argues is worth more than the metric
      change that entry was filed for. The two are the same fix seen from two sides and should be
      taken together. Found by the phase 13 stage-8 poker review.
  - id: LOOP-ADDS-NO-CANARY-FOR-A-FIX-FOUND-AFTER-STAGE-4
    status: deferred
    phase: contract-update
    title: Mutation canaries are frozen before the fixes they would have to cover exist
    reason: >-
      verification/mutations.yml is authored at stage 4, before any implementation, and that is
      right: a canary written after the code it mutates is a canary written to pass. The
      consequence nobody planned for is that every fix found at stage 6 or stage 8 arrives with
      whatever coverage happened to already exist, and check_gate_bite therefore proves nothing
      about behaviour added after the freeze. A green gate plus a biting canary set reads as
      "every committed behaviour is proved to matter", and for post-stage-4 fixes it is not that
      claim at all.
      Phase 13 produced three instances in one phase. The stage-6 extremal-seat hole reverted green
      across all 954 tests. Both of the earlier stage-8 pass's fixes did too - one of them, the
      residual-seat rule, was guarded only by a report validator that no canary named, so reverting
      the fix and dropping the validator together left the entire gate green while the report
      published a false seat. Each was closed only because a reviewer asked for a canary by hand,
      and the fourth reviewer's whole brief that round was this failure mode because the phase had
      already produced it twice. Three saves by attention is not a check.
      Where the fix lives is loop-driver territory a phase task must not reach: either the loop
      gains a stage that re-opens mutations.yml for behaviour added after the freeze, with the same
      "prove it bites in both directions" requirement, or every stage-6 and stage-8 behavioural fix
      owes a named canary before its review can close.
      Whoever takes this also owes a documentation edit, recorded here because phase 13 is not
      widening scope to docs/** for it. docs/LOOP.md has a "Known gaps" section opening "Four
      things this machinery cannot catch, kept here rather than in a commit message." It should
      become five, and this entry is the fifth: the four listed gaps are all about a check that
      cannot see something, and this one is about a check whose coverage is frozen before the thing
      it should cover is written. Raised by the phase 13 stage-8 mechanical review.
  - id: REPORT-VALIDATORS-CAN-HOLD-GUARDS-THAT-CANNOT-FAIL
    status: deferred
    phase: contract-update
    title: A validator guarding a published claim can be unfalsifiable, and nothing mechanical says so
    reason: >-
      This repo's report generators refuse to publish unless their own validators pass, which is
      the mechanism that makes a published number a checked claim rather than a printed one. A
      validator whose predicate is provable from the types or the construction of its inputs looks
      identical to a real one and asserts nothing, so the claim beside it is decoration while
      reading as evidence - and it is worse than no validator, because the next reader stops
      looking.
      Measured in phase 13, in one file, across two stages. Stage 6 found one. Stage 8 found three
      more in scripts/generate_table_state_report.py: `under_raises > facing_a_raise` and
      `short_all_in_calls > with_a_recorded_call` both hold pointwise by construction, because the
      predicate that increments each numerator requires the entry its denominator counts, and the
      census `accounted == len(probes)` compared a .get with a default over four names against a
      total it could not miss. All three were strengthened rather than deleted - the comparisons
      became the zeros the prose already claimed, and the census check became one that enumerates
      every refusal code the strategy declares and fails on any code in neither the verdict map nor
      an explicit exemption - but each was caught by a human reading the predicate.
      Four instances in one file in one phase is a class, not a run of bad luck, and the check is
      cheap in principle: flag a validator whose comparison is decidable from its inputs' types or
      from a static table in the same module. It is repo-tooling work rather than any phase's, and
      it belongs beside check_gate_bite, whose job is the same one from the other end - proving a
      check can fail. Raised by the phase 13 stage-8 mechanical review.
  - id: CONTRACT-UPDATE-IS-THE-LABEL-OF-LAST-RESORT
    status: deferred
    phase: contract-update
    title: contract-update is the catch-all label for loop and tooling work, so it no longer predicts what a task involves
    reason: >-
      A backlog item must name either a phase in phase_status.yml or one of the labels in
      NON_PHASE_LABELS in scripts/quality_checks.py. That set is charts, contract-update, engine,
      sample-comparison, samples, simulator, strategy and v2. There is no tooling value and no
      process value in it, so work on the loop driver, the check scripts and the report machinery
