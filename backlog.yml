      repo-tooling work and belongs beside check_gate_bite.
      What that costs is downstream and easy to miss, because nothing about it is wrong today.
      Whoever schedules a contract-update task reads the label as "edits to documents under
      docs/phase_contracts/, which need contract-update mode and no implementation" and will find
      a queue that is half check-script work needing a different mode, a different reviewer and a
      different definition of done. A label that does not predict what the task involves is worse
      than no label, because the scheduling decision is made from it.
      The fix is a ruling rather than a patch: either NON_PHASE_LABELS gains tooling and process
