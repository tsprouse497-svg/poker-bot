      As filed: The field holds the street's current bet level, and its name reads as hero's own bet
      this street, which is the wrong reading and is the one a producer already took. Phase
      11 documented the meaning, added a street_bet >= to_call guard, and corrected the one
      wrong producer, but left the name, because a rename touches eight producers, the
      serialized audit payload key and therefore DECISION_AUDIT_SCHEMA_VERSION, the Phase 03
      contract text, and frozen tests in four completed phases. The engine already calls this
      quantity current_bet on BettingRoundState, so the rename would leave one vocabulary
