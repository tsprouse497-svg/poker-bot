  - id: A-STALE-TREE-CARRIES-ITS-OWN-COPY-OF-THE-RULES
    status: done
    phase: contract-update
    title: No committed fix can reach a session that starts in a tree parked on an old commit
    reason: >-
      The primary checkout at ~/projects/poker-bot has sat on the merged phase/10-solver-extraction
      branch since 2026-08-20 and main now holds 118 commits it does not. It is also the directory a
      session starting from the project's own name lands in, and it carries its own AGENTS.md,
      CLAUDE.md, phase_status.yml and check scripts at that commit. So the MAINT-27 fix to Start
      Of Work is invisible there, scripts/loop_fleet.py does not exist there at all, and
      scripts/loop_stage.py there reads the phase-10 pointer and prints "loop is 'completed';
      start it with --start PHASE_ID", which is a confident wrong answer rather than a refusal.
      Nothing committed to main can close this, because the tree that misleads is by definition
      not reading main. Three candidate fixes, and the choice is the operator's rather than a
      task's: hold main in the primary checkout and retire the separate main worktree, park the
      primary checkout at a detached HEAD on main's tip, or leave it and accept that the guard
      lives outside the repo in the operator's own session configuration. Filed rather than
      fixed because every one of them changes where the operator lands when he opens the project.
      Ruled and closed by MAINT-28 on 2026-08-27: the first candidate. The separate main worktree
      was removed and main is checked out in the primary checkout, so the directory a session lands
      in by default is the tree that describes the repo, and no tree on the machine now holds a
      stale copy of the rules. scripts/loop_fleet.py needed no change - primary_worktree() derives
      the repository from --git-common-dir and lane_root() from its parent, so lanes still live in
      ~/projects/poker-bot-worktrees and the integration runbook's git -C REPO_ROOT checkout main
      now names the tree that actually holds main. AGENTS.md deliberately still says "the tree
      holding main" rather than a path, for the reason docs/LOOP.md gives for not committing the
      board: which worktrees exist is a property of the machine, not of the repo.
  - id: STAGE-REVIEW-CHECK-READS-ONE-FILENAME-PER-STAGE
    status: deferred
    phase: contract-update
    title: The advance check reads one review note per stage, so a second note's open blockers cannot hold the stage
    reason: >-
      scripts/loop_stage.py check_stage_review builds exactly one path,
      review_path(ctx, stage) = stage-NN-<stage name>.md, and validates that file alone. Any other
      review note written for the same stage - a second round, a re-cut, a specialised review - is
      never opened, so its unresolved blockers cannot hold the stage. scripts/review_queue.py
      globs stage-*.md and does see them, which is why the two drivers give opposite answers.
      Live and reproduced on 2026-08-27 in the phase-14 lane. loop_stage.py --phase 14 prints
      "this stage's checks pass; run --advance to move on", because stage-04-tests.md carries
      nine blockers all marked [resolved]. review_queue.py --list prints "4 item(s) waiting on
      you": three blockers marked [open, for Taylor] in stage-04-predicate-change-review.md, and
      the ExecPlan's own pause declaration. A fourth note, stage-04-test-recut.md, carries three
      more blockers under a "## Blockers" heading with "### N." bullets, a shape unresolved_blockers
      cannot parse even if the file were read. So an agent that trusts --advance freezes the tests
      with open questions still on the board, which is the exact thing the per-stage review was
      added to prevent.
      Not the same defect as FLEET-AND-STAGE-DRIVERS-DISAGREE-ABOUT-INTEGRATION, which is about who
      owns a lane after stage 11; this is about which files the advance check reads. Two candidate
      fixes and the choice is a ruling: check_stage_review globs the stage's notes rather than
      naming one, or the loop forbids more than one note per stage and the driver says so when a
      second appears. The second is cheaper and loses the ability to add a review that the stage
      did not plan for, which is what all four of phase 14's extra notes are.
