schema_version: 1
items:
  - id: V2-POKERNOW-AUTOMATION
    status: deferred
    phase: v2
    title: PokerNow automation and browser observation
    reason: Explicit v1 non-goal.
  - id: V2-TRAINING-UI
    status: deferred
    phase: v2
    title: Training UI package
    reason: V1 is CLI and report driven.
  - id: V2-LARGE-DATASET-COMPARISON
    status: deferred
    phase: v2
    title: Large hand-history corpus comparison
    reason: V1 allows only tiny normalized sample comparison.
  - id: CONTRACT-REPORT-PATHS
    status: done
    phase: contract-update
    title: Point Phase 01/07/08 contract report paths at distinct report files
    reason: Resolved by MAINT-01-AGENT-STRUCTURE; every contract now names a distinct report file and the shared latest_replay_report.txt path is gone.
  - id: UNDER-RAISE-ACCUMULATION
    status: deferred
    phase: engine
    title: Reopen betting when consecutive short all-ins reach a full raise
    reason: V1 keeps seats barred once an under-raise all-in occurs even if later short all-ins cumulatively amount to a full raise; real NLHE reopens raising there. Fail-closed but stricter than the live rule.
  - id: SECOND-ORBIT-PREFLOP-SPOTS
    status: deferred
    phase: charts
    title: Chart spots needing a position to act twice
    reason: V1 spot keys allow one entry per position, so any spot where a position acts twice (hero facing a 4bet or later) has no representable key; lookup misses those fail closed instead of guessing.
  - id: STACK-DEPTH-BUCKETS
    status: deferred
    phase: charts
    title: Stack-depth bucketing for chart lookup
    reason: V1 lookup requires an exact stack_depth_bb match. Nearest-depth or bucketed matching would be a heuristic, so an uncovered depth fails closed.
  - id: ASYMMETRIC-EFFECTIVE-STACKS
    status: deferred
    phase: charts
    title: Per-seat effective stack depth in chart spots
    reason: stack_depth_bb is one table-wide number, so hero at 100bb facing a 35bb opener cannot be expressed or queried; a caller must pick one number and silently answers a different question.
  - id: BLIND-STRUCTURE-VARIANTS
    status: deferred
    phase: charts
    title: Antes and straddles in the artifact format
    reason: The artifact declares no blind structure, so a straddled or anted pot reads as an ordinary one even though both materially change correct preflop ranges. Common in the home-game context this bot targets.
  - id: RAISE-SIZE-IN-SPOT-KEY
    status: deferred
    phase: charts
    title: Record raise sizes in preflop spot keys
    reason: V1 spot keys record action names without sizes, so a 2.5bb open and a 4bb open share one spot. Sizing-aware spots need a size vocabulary the artifact format does not yet declare.
  - id: FOLD-WHEN-FREE
    status: deferred
    phase: engine
    title: Accept recorded folds when checking is free
    reason: The engine treats fold as illegal when to_call is zero, so real histories containing open folds (timeouts, surrendered rivers) fail replay; the strategy contract inherits the same invariant.
