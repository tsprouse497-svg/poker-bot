schema_version: 1
items:
  - id: V2-POKERNOW-AUTOMATION
    status: deferred
    phase: v2
    title: PokerNow automation and browser observation
    reason: >-
      Explicit v1 non-goal, and ruling 7 of docs/V2_ROADMAP.md keeps it out of v2 as well.
      No declared phase will close this, and the v2 label means after v2 rather than
      during it.
  - id: V2-TRAINING-UI
    status: deferred
    phase: v2
    title: Training UI package
    reason: >-
      V1 is CLI and report driven, and ruling 6 keeps it deferred through v2. The thing
      that would change the answer is proposed phase 15, the drill: a UI is worth arguing
      about once a CLI trainer exists and has been used, and not before.
  - id: V2-LARGE-DATASET-COMPARISON
    status: deferred
    phase: v2
    title: Large hand-history corpus comparison
    reason: >-
      V1 allows only tiny normalized sample comparison. Ruling 5 lifts that boundary for
      one player's own hands with a stated bound, but the bound is not written yet and no
      declared v2 phase owns the ingestion, so this stays deferred rather than claiming a
      phase that will not do it.
  - id: CONTRACT-REPORT-PATHS
    status: done
    phase: contract-update
    title: Point Phase 01/07/08 contract report paths at distinct report files
    reason: Resolved by MAINT-01-AGENT-STRUCTURE; every contract now names a distinct report file and the shared latest_replay_report.txt path is gone.
  - id: UNDER-RAISE-ACCUMULATION
    status: done
    phase: "11"
    title: Reopen betting when consecutive short all-ins reach a full raise
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: v1 kept seats barred once an under-raise all-in occurred even if later short
      all-ins cumulatively amounted to a full raise, where real NLHE reopens raising. Fail-closed
      but stricter than the live rule.
      The cause was that each all-in was measured against the bet level immediately before it, so
      two short all-ins that together made a full raise still left betting closed. The
      measurement is now against the last full bet or raise, and a full bet or raise resets the
      level it is measured from. Reopening restores the right to raise and not a cheaper price:
      with the level at 21 and the minimum raise still 10, the smallest legal raise is to 31. A
      single short all-in still does not reopen, and a barred seat can still call and fold.
      Pinned by test_two_short_all_ins_past_the_bar_reopen_betting,
      test_exactly_at_the_bar_reopens and test_three_short_all_ins_accumulate, guarded by
      test_one_chip_below_the_bar_does_not_reopen and
      test_a_single_short_all_in_still_does_not_reopen, and made to bite by the
      reopening-measured-against-the-preceding-bet-again canary.
      Two neighbouring rules on the same branch were deliberately left alone, because no phase 11
      acceptance criterion named them and a fix there would have been behaviour nobody asked
      for. They are open as UNDER-SIZED-ALL-IN-BET-DOES-NOT-BAR-PRIOR-CHECKERS and
      MIN-RAISE-OVER-AN-INCOMPLETE-ALL-IN-BET, and both need a ruling before an implementation.
  - id: SECOND-ORBIT-PREFLOP-SPOTS
    status: done
    phase: "12"
    title: Chart spots needing a position to act twice
    reason: >-
      Closed by phase 12 at `d046ac9`. `spot_key` accepts a position appearing more than
      once, and the order rule generalises from one pass over the preflop action order to
      repeated passes over the positions still live. A four-bet has a key from both sides
      and is pinned by test:
      `t6/d100/BTN/LJ:raise@2.5,BTN:raise@8,LJ:raise@21.5`. There is no orbit cap; what
      bounds the vocabulary is whether the sequence is a legal preflop order and whether
      its raises can be paid at the stated depth, which is decision 4.

      Two limits are recorded rather than hidden. A folded seat still cannot reappear, and
      the test that pins it had to be rewritten at stage 7 because it was passing off a
      neighbouring rule. And the depth check is table-wide rather than per-seat, so a
      five-bet to 100 is admitted at 100bb because the deepest seat could pay it, which
      waits on `ASYMMETRIC-EFFECTIVE-STACKS` at proposed phase 13.

      Expressible six-handed 100bb spots go from 1,949 to 18,773 with limps, enumerated
      rather than quoted. Vocabulary only: nothing here commits a second-orbit chart cell,
      which is `CHART-COVERAGE-EXPANSION` at proposed phase 14.

      As filed: V1 spot keys allow one entry per position, so any spot where a position
      acts twice (hero facing a 4bet or later) has no representable key; lookup misses
      those fail closed instead of guessing.
  - id: STACK-DEPTH-BUCKETS
    status: deferred
    phase: charts
    title: Stack-depth bucketing for chart lookup
    reason: >-
      V1 lookup requires an exact stack_depth_bb match. Nearest-depth or bucketed matching
      would be a heuristic, so an uncovered depth fails closed. Narrowed rather than closed
      by v2: each depth proposed phase 10 solves is one more exact match, which shrinks the
      problem without introducing the heuristic. Bucketing itself stays deferred.
  - id: ASYMMETRIC-EFFECTIVE-STACKS
    status: deferred
    phase: "13"
    title: Per-seat effective stack depth in chart spots
    reason: stack_depth_bb is one table-wide number, so hero at 100bb facing a 35bb opener cannot be expressed or queried; a caller must pick one number and silently answers a different question.
  - id: BLIND-STRUCTURE-VARIANTS
    status: deferred
    phase: "13"
    title: Antes and straddles in the artifact format
    reason: The artifact declares no blind structure, so a straddled or anted pot reads as an ordinary one even though both materially change correct preflop ranges. Common in the home-game context this bot targets.
  - id: CONTRACT-CRITERIA-BACKFILL
    status: deferred
    phase: contract-update
    title: Backfill phase-specific acceptance criteria for phases 00, 01, and 02
    reason: check_contracts now requires an active or completed phase to carry at least three acceptance criteria that are not gate boilerplate. Phases 00 through 02 were closed with only the four boilerplate criteria, so their gates asserted little beyond the gate passing. They are explicitly exempted in CRITERIA_BACKFILL_EXEMPT because backfilling is a semantic contract change that needs contract-update mode, which the maintenance task that added the check may not do.
  - id: CHART-COVERAGE-EXPANSION
    status: deferred
    phase: "14"
    title: More chart depths and spot classes beyond six-max 100bb first-two-decisions
    reason: Phase 05 commits one six-max 100bb solution covering opens, spots facing a single open, the opener facing a three-bet, and the big blind facing a limp. Other depths and the squeeze and cold four-bet classes are already representable and already indexed by depth, so they are additive data rather than format work; every uncovered spot refuses meanwhile.
  - id: PER-SEAT-CONTRIBUTIONS-IN-QUERY
    status: deferred
    phase: "13"
    title: Carry each seat's committed chips on StrategyQuery
    reason: StrategyQuery gives current stacks, the pot, and the price to call, but not what each seat has put in. Nobody's own contribution is recoverable, hero's included - street_bet minus to_call was thought to give hero's, and under the 2026-08-20 ruling that to_call is the capped price it does not (STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS). That blocks three things the preflop strategy currently approximates or misses. A short villain is indistinguishable from one who has already invested (ASYMMETRIC-EFFECTIVE-STACKS). A straddle is only detectable while the pot stays smaller than the blinds plus one full bet per voluntary action, so a straddled pot with several callers can slip through. An ante is only detectable by the same bound. Adding per-seat contributions makes all three exact rather than bounded, and is the same shape of fix as adding the preflop action history was.
  - id: RAISE-SIZE-IN-SPOT-KEY
    status: done
    phase: "12"
    title: Record raise sizes in preflop spot keys
    reason: >-
      Closed by phase 12 at `d046ac9`. A raise entry renders the amount it raised *to* in
      big blinds after an `@`, quantized to hundredths with trailing zeros stripped, and a
      call carries no size because it pays a level the key already states:
      `t6/d100/LJ/LJ:raise@2.5,BTN:raise@8`. Decisions 1, 2 and 3, all `frozen-into-data`
      and all ruled by Taylor on 2026-08-20. A size the renderer cannot represent exactly
      is rejected rather than rounded into a neighbouring cell, and a v1 key carrying no
      size fails import rather than matching any size.

      The committed artifact was re-derived under the new keys and the ranges provably did
      not move: stripping every `@size` back out reproduces the pre-phase weights checksum
      `eaf2c6cd` exactly, so the file's changed checksum `d2d5c3fa` is accounted for
      entirely by the spot ids inside it. 36 spots before, 36 after, because each
      size-stripped prefix admits exactly one solved size.

      What the entry as filed did not anticipate is that closing it does not by itself move
      any agreement rate. Under ruling 8 and Taylor's 2026-08-20 extension of it, a price
      the tree does not hold is normalised back to the cell the coarse key already hit, so
      every corpus rate is unchanged. What the key bought is that the answer now says it
      was substituted, on 969 of 2,758 answered decisions - a measurement that was
      impossible while one cell answered every price. Making the chart *answer* those
      prices differently is a second solve, at proposed phase 14.

      As filed: V1 spot keys record action names without sizes, so a 2.5bb open and a 4bb
      open share one spot. Sizing-aware spots need a size vocabulary the artifact format
      does not yet declare.
  - id: FOLD-WHEN-FREE
    status: done
    phase: "11"
    title: Accept recorded folds when checking is free
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: the engine treated fold as illegal when to_call was zero, so real histories
      containing open folds - timeouts, surrendered rivers - failed replay, and the strategy
      contract inherited the same invariant. It was the single largest blocker on ingesting
      anybody's actual hands.
      A fold is now legal wherever a seat may act. It costs nothing and leaves the bet level and
      the minimum raise untouched. Legal is not the same as chosen, and that half is proved
      rather than asserted: no strategy in this repo folds when checking is free, measured over
      the postflop enumeration, the reference strategy, and the one committed chart spot where
      checking is free, which folds 0.00 percent. Pinned by test_a_free_spot_offers_fold and
      TestReplayAcceptsARecordedFreeFold, guarded against over-application by
      test_check_stays_legal_exactly_when_the_price_to_call_is_zero and
      test_facing_a_bet_offers_the_same_set_it_always_did, and made to bite by the
      free-fold-taken-off-the-table-again mutation canary.
  - id: POSTFLOP-UNBEATABLE-EARLIER-STREETS
    status: deferred
    phase: "16"
    title: Extend the unbeatable call from the turn back to the flop
    reason: >-
      The postflop fallback calls a bet only when no possible villain holding beats hero,
      and only on the turn and the river. On the river a complete board makes that a
      990-holding enumeration. On the turn it means safe after every one of 46 river
      cards, which decomposes into 46 river checks - 45,540 evaluations, a few seconds,
      and affordable inside the exhaustive sweep, which is why the turn is now covered.
      The flop is not: two cards are still to come, so the claim runs over C(47,2) = 1,081
      holdings against C(45,2) = 990 runouts, 1,070,190 evaluations and roughly 83 seconds
      for one decision. A sampled version would turn the fact back into a guess, so the
      fallback folds flop bets meanwhile. Almost nothing qualifies on the flop anyway, so
      the cost is small and the fix is a faster evaluator rather than a new rule. The
      earlier version of this entry gave the flop as 903 runouts against 990 holdings and
      lumped the turn in with it; both figures were the river's own, shifted by a card,
      which is what kept the turn deferred for a phase longer than it needed to be.
  - id: FALLBACK-FAIL-CLOSED-CAN-CALL
    status: done
    phase: "11"
    title: The fallback's fail-closed branch can invest, and can refuse postflop
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: PostflopFallbackStrategy._fail_closed runs when the action the rules chose is not
      on offer, and took the most passive legal action from ("fold", "call"). Where fold is
      absent that is a call, so a branch reached because something unexpected happened answered
      by investing in a hand it had not established could not lose - which the phase contract
      forbids everywhere - and where neither was legal it returned a postflop refusal, which the
      contract says never happens. Neither branch was reachable from a legal-action set the
      engine's own legal_actions produces, and the phase enumeration confirms zero postflop
      refusals, but both were reachable from a contract-valid StrategyQuery: legal_actions
      ("call", "raise") called, and ("raise",) refused. Found by the Phase 06 stage 8 mechanical
      review, which could not fix it because tests/ was out of scope for that phase after the
      freeze.
      The passive order is now ("fold",) alone, so the branch folds when folding is legal and
      refuses otherwise, and it never invests. Pinned by
      test_a_set_offering_call_but_not_fold_refuses_rather_than_investing, guarded by
      test_the_unbeatable_call_is_untouched and test_a_preflop_query_still_refuses, and made to
      bite by the fail-closed-can-invest-again canary.
  - id: POSTFLOP-BOARD-ABSTRACTION
    status: deferred
    phase: charts
    title: Group similar flops so the bot plays them identically
    reason: >-
      Ruled by Taylor on 2026-08-19: eventually needed, deliberately later. Suit isomorphism is
      exact and every solver exploits it; grouping by rank texture so an unsolved K72r reads off a
      solved Q83r is a heuristic, and AGENTS.md forbids heuristic guessing for missing chart
      spots, so adopting it is a boundary amendment rather than an optimisation. It is not needed
      for breadth: a flop-only solution covers every canonical flop, so it never meets a texture it
      has no cell for. It is needed for depth, because per preflop line the turn is 85995 spots and
      the river 4127760. So this item is what unblocks the turn, and until it is
      taken the committed solution stops at the flop and later streets refuse. Building it before
      anything requires it would produce an abstraction nobody can measure against a solved
      baseline.
  - id: V2-POSTFLOP-STRATEGY
    status: deferred
    phase: "16"
    title: A postflop strategy that can bet and raise
    reason: >-
      V1 ships a fallback that never invests unless the investment cannot lose, so it never
      bets or raises. An earlier version of this entry said a size needs a source and the only
      source in the repo is the preflop export; that was wrong. GTOpen solves postflop as its
      primary function and the Preflop Lab phase 10 uses is the bolt-on. What is missing is a
      ruling on how deep the committed solution goes and what the bot does on a board it holds
      no cell for, since mapping an unsolved rank texture onto a solved one is the heuristic
      guessing AGENTS.md forbids. Recorded with defaults in
      reports/phase_audits/decisions/PHASE_16_POSTFLOP_BETTING_DECISIONS.md.
  - id: STREET-BET-MEANING-AMBIGUOUS
    status: done
    phase: "11"
    title: Two readings of StrategyQuery.street_bet, and one consumer uses the wrong one
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: StrategyQuery.street_bet carried no docstring and two consumers read it
      differently. preflop_chart._table_depth_bb derives hero's starting stack as stacks[seat] +
      (street_bet - to_call), which is only meaningful if street_bet is the street's current bet
      level, and _blind_structure_is_representable compares it to the big blind on the same
      reading. But scripts/generate_strategy_query_report.py passed player.street_bet, hero's own
      contribution, so replayed hands reached the chart with a mis-derived depth: the small blind
      in phase02-heads-up-showdown refused with blind-structure-not-representable where the true
      miss is the table size. Found by the Phase 06 report lane.
      The meaning is now stated on the field as the street's current bet level, a query whose
      street_bet is below its to_call is rejected, and the one wrong producer is corrected.
      Pinned by test_the_query_documents_which_reading_it_carries,
      test_a_street_bet_below_the_price_to_call_is_rejected and
      test_the_query_report_generator_writes_the_street_level, guarded by
      test_a_street_bet_equal_to_the_price_to_call_is_accepted.
      Two things this closing does NOT close, stated here because done beside them reads wrong at
      a glance. The guard catches a producer passing hero's contribution only when hero has put
      in less than half the current level, so it misses the heads-up small blind, who has put in
      exactly half, and the field is still named for the reading it does not carry - both are
      STRATEGY-QUERY-STREET-BET-NAME, phase 13. And the field beside it turned out to carry the
      same undocumented pair of readings, which is STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS, ruled
      on 2026-08-20 and open for phase 13.
  - id: DECISION-AUDIT-ALL-IN-BOUND-TOO-LOOSE
    status: done
    phase: "11"
    title: The decision audit's all-in ceiling is too high by the price to call
    reason: >-
      Closed by phase 11, evidenced in reports/phase_audits/PHASE_11_ENGINE_FIDELITY.md.
      As filed: DecisionAuditRecord computed max_target as street_bet + stack for the acting
      seat. Under the canonical reading of street_bet as the street's current bet level, hero has
      already committed street_bet - to_call, so the true all-in raise target is (street_bet -
      to_call) + stack and the recorded ceiling was too loose by exactly to_call. With street_bet
      20, to_call 20 and a stack of 100 the record accepted a raise to 120 and only rejected 121.
      No shipped strategy was affected, because the only strategy that returns an amount is the
      preflop chart and it caps its own raise at street_bet + stack, but the legality proof
      several phase contracts lean on was weaker than those contracts say. Found by the Phase 06
      report lane.
      The ceiling is now (street_bet - to_call) + stack, so nothing changes in play and the
      legality claim is true. Pinned by test_a_raise_above_the_corrected_ceiling_is_rejected and
      test_the_old_ceiling_is_no_longer_the_boundary, guarded by
      test_a_raise_exactly_at_the_corrected_target_is_accepted and
      test_every_committed_decision_audit_record_still_validates, and made to bite by the
      all-in-ceiling-loose-by-the-price-to-call-again canary.
      What keeps this sound is Taylor's ruling of 2026-08-20 that to_call is the capped price
      hero can actually pay. A capped hero is never offered raise, because the engine only offers
      it when stack exceeds the price owed, so the subtraction is only ever applied to an
      uncapped hero, for whom street_bet minus to_call really is hero's contribution. The guard
      that makes that airtight - StrategyQuery rejecting a query that offers raise when to_call
      equals the seat's stack - does not exist yet and is phase 13's, under
      STRATEGY-QUERY-TO-CALL-HAS-TWO-READINGS.
  - id: SAMPLE-HAND-THE-CHARTS-COVER
    status: deferred
    phase: "15"
    title: No committed sample hand is a preflop spot the charts cover
    reason: >-
      The four hands in data/samples/normalized_hands.json were written to exercise the
      replayer and are two-handed and three-handed, so the six-max artifact refuses every
      preflop point in them. The Phase 06 report can therefore only show a hand as
      refuse-preflop-then-check-through rather than decide-preflop-then-check-through,
      which is the shape Phase 07 will want to measure. A six-handed 100bb normalized
      hand added to data/samples/ would close it, and committing sample data is a
      frozen-into-data decision that needs a human, so it is not a Phase 06 change.
  - id: POSTFLOP-POT-ODDS-AGAINST-UNSEEN-DECK
    status: deferred
    phase: "16"
    title: River pot-odds calling against the full unseen-deck range
    reason: >-
      The postflop fallback folds every bet it cannot prove it wins, so it is
      exploitable by any bet at all. A middle option exists that needs no invented
      constant and no solver: hero's equity against the full unseen deck is
      (wins + ties/2) / 990, which the same enumeration hand_cannot_lose already runs
      produces, and the price is to_call / (pot + to_call) straight off the query. Call
      when equity beats the price. The honest cost, which any contract adopting this
      must state, is that a uniform range is still a model: anyone who bets the river
      is stronger than a random two cards, so uniform-range equity flatters hero and
      the bot would over-call - the mirror of its current over-folding. Unlike the
      unbeatable test, this is an assumption rather than a fact about the hand, which
      is why it is a separate rule and not an extension of that one. It is also worth
      building only once something bets at the bot: in bot-versus-bot self-play neither
      side ever bets, so the branch is unreachable, and whether a betting opponent
      exists is a Phase 07 and Phase 08 question. Superseded rather than extended by
      V2-POSTFLOP-STRATEGY, which computes equity against a modelled range.
  - id: SIMULATOR-VOIDED-HAND-RECORD
    status: done
    phase: simulator
    title: A voided hand's record discards the actions that identify the refused spot
    reason: >-
      simulator.run._voided builds its normalized record from played.streets or
      blinds_only, and played.streets is only appended once a street's betting loop
      completes. A refusal returns from inside that loop, so on a preflop refusal the
      fallback always wins and the record keeps only the two blind posts. Measured over
      the committed self-play run: 128 refused hands took between 2 and 7 decisions each,
      565 actions in total, and every record kept none of them. Because Phase 05's refusal
      codes name the kind of miss rather than the spot, that action sequence was the only
      place the spot survived, which makes the report's headline coverage figure a count
      rather than the list of uncovered spots it claims to be. The pre-refusal
      DecisionAuditRecords do keep everything, so the data is recoverable. Connected: such
      a record cannot be replayed at all - correctly, since the hand stops mid betting
      round - so a voided hand is not a completed hand history and the fix has to decide
      what a refused hand's evidence is instead. That collides with the frozen test
      asserting every hand carries a NormalizedHandHistory, which is why it is a
      contract question rather than a patch. Found by the Phase 07 stage 8 review.
  - id: SIMULATOR-NOISE-THRESHOLD-UNPINNED
    status: deferred
    phase: simulator
    title: The two-standard-error rule is never exercised between zero and overwhelming
    reason: >-
      SimulationResult.separated_profiles implements Phase 07's judgment call 3: no winner
      is named unless a figure clears two standard errors. It is only ever asked two
      degenerate questions. In self-play all six seats are one profile, so the summed
      figure is identically zero with a standard error of exactly zero and the rule returns
      nothing because zero is not greater than zero, not because a threshold did any work.
      In the floor run the figure sits 14.9 standard errors from zero. So nothing anywhere
      tests a difference that is real but too small to call, which is the only case the
      rule exists for, and the test asserting it passes on an arithmetic identity. The same
      vacuity that hid judgment call 4 until a mutation canary caught it.
  - id: SIMULATOR-REPORT-UNITS-AND-IDS
    status: deferred
    phase: "15"
    title: Report the win rate in bb/100, and disambiguate hand ids across runs
    reason: >-
      Two small things from the Phase 07 review. The floor figure is printed as 38.67 chips
      per hand at 50/100, which is 38.7 bb/100 - the unit a poker player can calibrate
      against, and the one that makes the size of the result legible as roughly four to
      eight times a strong human's win rate. And hand_id is derived from the hand's own
      seed (seed + index) with a constant table_id, so runs seeded 100 and 101 both contain
      a hand called sim-101. That is the price of making a hand reproducible from its own
      seed, which is worth keeping, so the fix is a run-scoped prefix rather than a
      different seeding scheme.
  - id: SIMULATOR-DECISION-AUDIT-NOT-COMMITTED
    status: deferred
    phase: "15"
    title: The simulator records a decision audit and never writes it out
    reason: >-
      Every decision the simulator applies becomes a Phase 03 DecisionAuditRecord and the
      whole set is regenerable from the seed, which is what the contract asks. But unlike
      Phase 06, no audit file is committed, so a reviewer cannot inspect a single decision
      without running the generator and reaching into the result object. Phase 06 commits
      latest_postflop_decision_audit.jsonl for exactly this reason. Not a criterion
      violation, an inconsistency between two adjacent phases' evidence - and the file the
      refusal inventory would naturally live beside.
  - id: MUTATION-SENTINEL-IS-COMMITTABLE
    status: done
    phase: contract-update
    title: The gate-bite sentinel and a mutated source file can be committed
    reason: >-
      check_gate_bite writes verification/.mutation_in_progress before it edits a source
      file and removes it in a finally block, so an interrupted run leaves a marker that
      refuses the next run. That protects the next run and nothing else: while a run is in
      flight the tree genuinely holds a deliberate defect, and a `git add -A` during that
      window commits both the defect and the sentinel announcing it. That happened on the
      Phase 09 branch: a commit captured the cutoff and hijack labels swapped, and the
      sentinel that said so, and the gate went red on the next scope check rather than on
      the swap. Two cheap fixes and they are not exclusive: gitignore the sentinel so it
      can never be committed, and have the sentinel's presence fail check_scope or a
      pre-commit path so a commit during a mutation run is refused rather than recorded.
      Filed rather than fixed inside Phase 09 because .gitignore and check_scope.py are
      outside this phase's approved scope, and because the phase must not edit the checks
      it is measuring itself against.
      Closed by MAINT-20 on 2026-08-18, with both fixes rather than either: the sentinel is
      gitignored so it can never be staged, and check_scope refuses while it exists, quoting
      it so the operator is told which file to restore. It had bitten a second time by then,
      when a backgrounded gate-bite run and a full gate run raced and the loser left a mutated
      replay.py in the tree.
  - id: CORPUS-CALL-AGREEMENT-IS-THE-WEAK-SPOT
    status: deferred
    phase: "14"
    title: The chart defends the big blind nothing like real players do
    reason: >-
      Measured over 499 real hands. Folds agree almost always and raises agree in the
      nineties, but calls agree 59.5% for Pluribus on 37 decisions and 60.8% for the human
      professionals on 227. The 96.3% headline is dominated by the 72% of decisions that
      are folds, which is the easiest agreement in poker and says almost nothing. Split by
      position, the deficit is one seat: human calls agree 53.2% in the big blind against
      62-77% everywhere else, and the big blind holds 58 of the 89 human call
      disagreements. The same seat is the one the chart refuses most often, on 26.6% of its
      decision points against 1.3% in the hijack, and refusals sit outside every agreement
      rate, so the big blind's rate is computed over the subset of its decisions the chart
      could answer, which is not a random sample of them.

      Most of the gap is the artifact rather than a defect, and this entry said otherwise
      until MAINT-09. The committed ranges were solved with NL25 rake and this corpus is
      rake-free; a raked solution defends the blinds more tightly, and Phase 05's own
      strategy report already says so. They were also solved against a 2.5bb open, while
      these players opened to a median 2.25, and agreement tracks that price closely: human
      calls agree 52.5% facing 2.25 or less, 69.0% between 2.26 and 2.50, and 77.8% above
      2.50. 47 of the 58 big-blind call disagreements faced an open below the solved size.
      The earlier reading - that this is the same over-folding bias Phase 05's collapse rule
      and Phase 06's fallback showed - is not supported: those are properties of how a
      decision is collapsed or declined, and this is a property of which solution was
      committed and at what price it was read.

      What is left to establish is narrower. Phase 08 may not change the chart it measures,
      so the work is recorded rather than done: get a rake-free solve, or a 2.25bb-open
      solve, and see how much of the gap survives. Start with the refused big-blind spots,
      because a cell that answers nothing and a cell that answers wrongly need different
      work and this seat has an unusual amount of both. RAISE-SIZE-IN-SPOT-KEY is the entry
      that would let a spot key carry the price at all, and until it lands every rate here
      is computed across sizes the chart cannot distinguish.
  - id: CORPUS-INEXPRESSIBLE-SPOTS
    status: done
