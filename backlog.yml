      No committed audit packet was edited. The stale figures are named where they sit,
      which required MAINT-25 first, because the fact-drift check was policing a finished
      phase's packet against numbers this phase moved.

      As filed: Phase 11 fixed the engine and the strategy query that every published measurement in
      this repo was taken through: a fold is now legal when checking is free, betting reopens
      when short all-ins accumulate, and the chart now receives the street's bet level rather
      than hero's contribution. Decision 9 of PHASE_11_ENGINE_FIDELITY_DECISIONS.md rules that
      the phase names the numbers it moves and recomputes none of them, because a fix phase
      that grades its own fixes puts a moved number and a mistaken one in the same commit. The
      consequence is that Phase 08's agreement rates, its refusal inventory, and the counts
