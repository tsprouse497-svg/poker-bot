      Indifference artifacts. The three-bet range holds 22 at 0.9994 next to 44 at 0.0007 and 33
      at 0.162. The preflop solve was indifferent among small pairs and picked one arbitrarily,
      which is correct behaviour for a solver and wrong as a range somebody studies. A chart
      built on it shows 22 playing differently from 44 in a three-bet pot for no strategic
      reason.
      Unfloored residue. The single-raised out-of-position range spans almost the whole grid at
      weights far below the resolution of any target anybody solves to. Flooring both ranges at
      0.01 leaves the action-node count identical and cuts the arena from 21,663 MB to 10,881 MB,
      hands from 1131v679 to 360v559. So the residue costs a factor of two in memory and buys
      nothing.
      The conditioning step has a constraint that rules out the obvious fix: per-combo weights
      break the solver's suit symmetry, and one unequal combo inside a class collapses the
      isomorphism group to the identity and forfeits the whole saving on every non-rainbow
      board. So the floor and any smoothing have to be applied at class level, uniformly across
      the combos of a class. Filed against phase 14 because that phase re-keys the chart and is
      where a conditioning step belongs; phase 16 consumes the result.
