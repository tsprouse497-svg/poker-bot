schema_version: 1

# Each entry is a small, deliberate defect and the gate command that must notice
# it. A mutation that survives means the gate is decorative for that behavior:
# either no test covers it, or a test covers it too weakly to fail. Surviving
# mutations are a gate failure, not a suggestion.
#
# `find` must occur exactly once in `file`. The runner asserts that, so a mutation
# cannot silently stop applying when the code around it is refactored.

mutations:
  - id: positions-late-labels-swapped
    description: >-
      The cutoff and hijack labels swap places, so every chart spot and report
      names the wrong seat while staying internally consistent.
    file: src/poker_training_bot/poker_core/positions.py
    find: '_LATE_LABELS_BUTTON_FIRST: tuple[str, ...] = ("BTN", "CO", "HJ", "LJ")'
    replace: '_LATE_LABELS_BUTTON_FIRST: tuple[str, ...] = ("BTN", "HJ", "CO", "LJ")'
    must_fail:
      - pytest_preflop_artifacts

  - id: lookup-tie-picks-an-action
    description: >-
      A mixed or tied hand class quietly returns its first positive action instead
      of refusing to choose, which is the exact heuristic guessing v1 forbids.
    file: src/poker_training_bot/solver_artifacts/lookup.py
    find: "if len(positive) == 1:"
    replace: "if len(positive) >= 1:"
    must_fail:
      - pytest_preflop_artifacts

  - id: importer-checksum-not-enforced
    description: >-
      The artifact weights checksum is computed and then ignored, so an edited
      chart imports cleanly with a stale audit trail.
    file: src/poker_training_bot/solver_artifacts/importer.py
    find: "if checksum != derived_checksum:"
    replace: "if False and checksum != derived_checksum:"
    must_fail:
      - pytest_preflop_artifacts

  - id: decision-audit-skips-legality
    description: >-
      The decision audit record stops rejecting an action outside legal_actions,
      which is the check the strategy layers rely on to prove legality.
    file: src/poker_training_bot/strategy/contract.py
    find: "if self.outcome.action not in self.query.legal_actions:"
    replace: "if False and self.outcome.action not in self.query.legal_actions:"
    must_fail:
      - pytest_strategy_contract

  - id: engine-min-raise-not-updated-after-bet
    description: >-
      Reintroduces the min-raise bug an independent review caught in Phase 03: a
      postflop bet no longer raises the minimum for the next raiser.
    file: src/poker_training_bot/poker_core/engine.py
    find: "new_min_raise = self.min_raise if amount < self.min_raise else amount"
    replace: "new_min_raise = self.min_raise"
    must_fail:
      - pytest_poker_core

  - id: fallback-answers-preflop
    description: >-
      The postflop fallback accepts a preflop query, so a spot the committed charts
      do not cover quietly gets a passive action instead of the refusal that is the
      whole coverage signal.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: 'POSTFLOP_STREETS: tuple[str, ...] = ("flop", "turn", "river")'
    replace: 'POSTFLOP_STREETS: tuple[str, ...] = ("flop", "turn", "river", "preflop")'
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-folds-guaranteed-chops
    description: >-
      The unbeatable test counts a chop against calling again, so the bot folds hands
      no holding can beat and gives up half of the money already in the middle. This
      is the stage 8 blocker itself, reinstalled as a canary: it shipped through a
      green gate once, because the tests of the day pinned it.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: "return villain_rank.beats(hero_rank)"
    replace: "return villain_rank.beats(hero_rank) or villain_rank.ties(hero_rank)"
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-abandons-the-turn
    description: >-
      The unbeatable call reverts to the river only, so a turn hand that no river card
      can break folds to a bet and the extension ruled at stage 8 disappears without
      any test of the river rule noticing.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: 'DECIDABLE_STREETS: tuple[str, ...] = ("turn", "river")'
    replace: 'DECIDABLE_STREETS: tuple[str, ...] = ("river",)'
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-turn-needs-only-one-safe-river
    description: >-
      The turn claim becomes existential instead of universal: hero calls if any river
      card leaves the hand safe rather than if every one does. That is the difference
      between a fact and a hope, and it is invisible to any hand that is safe on the
      whole runout.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: "    return all("
    replace: "    return any("
    must_fail:
      - pytest_postflop_fallback

  - id: composite-routes-preflop-to-the-fallback
    description: >-
      The composite sends every street to the fallback, so the committed preflop
      charts stop being consulted at all and every preflop decision becomes a check
      or a fold that looks deliberate.
    file: src/poker_training_bot/strategy/composite.py
    find: "return PREFLOP_COMPONENT if street == \"preflop\" else POSTFLOP_COMPONENT"
    replace: "return POSTFLOP_COMPONENT"
    must_fail:
      - pytest_postflop_fallback

  - id: simulator-seeds-from-global-random
    description: >-
      The simulator's per-hand shuffle picks up the random module's global state, so a
      report's numbers stop being regenerable and the seed printed beside them stops
      meaning anything. A non-deterministic simulation still produces a perfectly
      plausible report, which is why this needs a canary at all. The first version of
      this entry shifted the seed by len(str(hand_seed)) % 2 and survived, because a
      deterministic shift is still deterministic - a canary aimed at reproducibility
      that was itself reproducible.
    file: src/poker_training_bot/simulator/run.py
    find: "    return Random(hand_seed)"
    replace: "    return Random(hand_seed + __import__('random').randrange(3))"
    must_fail:
      - pytest_simulator

  - id: simulator-forgets-what-players-put-in
    description: >-
      A hand's books count what each seat was paid and forget what it put in, so chips
      appear out of nowhere and every per-hand figure in the report is inflated by the
      pot. The first version of this entry disabled the conservation raise instead, and
      survived: switching off an assertion that never fires while the books balance
      changes nothing observable. A canary has to break a behaviour, not a guard.
    file: src/poker_training_bot/simulator/run.py
    find: "    deltas = {seat: settlement.payouts[seat] - played.committed[seat] for seat in config.seats}"
    replace: "    deltas = {seat: settlement.payouts[seat] for seat in config.seats}"
    must_fail:
      - pytest_simulator

  - id: simulator-carries-stacks-between-hands
    description: >-
      Stacks stop resetting to the committed chart's depth between hands, so from the
      second hand onward the chart refuses a table that is no longer one flat stack
      depth and the run measures the refusal path instead of the strategy.
    file: src/poker_training_bot/simulator/run.py
    find: "STACKS_RESET_EVERY_HAND = True"
    replace: "STACKS_RESET_EVERY_HAND = False"
    must_fail:
      - pytest_simulator

  - id: simulator-converts-a-refusal-into-a-fold
    description: >-
      A StrategyRefusal becomes a fold rather than ending the hand as a counted
      outcome, which erases the coverage signal Phases 04 through 06 exist to produce
      and quietly moves chips on a hand nobody decided.
    file: src/poker_training_bot/simulator/run.py
    find: "REFUSAL_VOIDS_THE_HAND = True"
    replace: "REFUSAL_VOIDS_THE_HAND = False"
    must_fail:
      - pytest_simulator

  - id: chart-refusal-forgets-what-it-looked-for
    description: >-
      A chart miss stops naming the spot it could not find, so the refusal is a count of
      the kind of miss and nothing more. That is the state Phase 07 shipped in, where the
      report announced that 21.3% of hands were refused and could not say where, and the
      only trace of the spot was an action sequence the simulator then discarded.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "        return tuple(detail)"
    replace: "        return ()"
    must_fail:
      - pytest_strategy_contract
      - pytest_simulator

  - id: simulator-drops-the-refused-street
    description: >-
      A refused hand goes back to filing only the streets that finished, which on a preflop
      refusal is none of them, so every action taken before the refusal is thrown away and
      the refused spot becomes unidentifiable from the hand. This is the Phase 07 stage 8
      blocker itself, reinstalled as a canary.
    file: src/poker_training_bot/simulator/run.py
    find: "    return (*filed, HistoryStreet(name=street, board=board, actions=tuple(actions)))"
    replace: "    return tuple(filed)"
    must_fail:
      - pytest_simulator

  - id: corpus-call-copies-the-target-total
    description: >-
      A call converted from the corpus records the street's bet level rather than the
      chips the caller actually added, so a small blind calling a raise to 210 is
      recorded as putting in 210 instead of 160. The hand still replays cleanly and
      settles to the wrong stacks, which is the exact class of defect an outside
      settlement oracle exists to catch and no internal check ever would.
    file: src/poker_training_bot/data_pipeline/convert.py
    find: "                actions.append(HistoryAction(seat, HistoryActionKind.CALL, owed))"
    replace: "                actions.append(HistoryAction(seat, HistoryActionKind.CALL, street_bet))"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-button-off-by-one
    description: >-
      The button moves one seat from where the corpus's blind placement puts it. Nothing
      raises: every hand still converts and still replays, but every decision is compared
      against the chart cell for the wrong position, and no aggregate number in the report
      would look wrong.
    file: src/poker_training_bot/data_pipeline/convert.py
    find: "    return next_seat(seats, seats[-2])"
    replace: "    return next_seat(seats, seats[-3])"
    must_fail:
      - pytest_sample_comparison

  - id: agreement-demands-the-drawn-action
    description: >-
      Agreement narrows to the single action the chart's seeded draw produced, so a
      correctly mixed cell reads as a disagreement in proportion to how mixed it is.
      This is the rule ruled out before implementation, reinstalled as a canary.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "            return AGREE if weight > 0.0 else DISAGREE"
    replace: "            return AGREE if weight >= 0.5 else DISAGREE"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-refusal-counted-as-disagreement
    description: >-
      A spot the chart cannot answer is scored against the chart instead of being
      reported as missing coverage, which makes an absent chart cell indistinguishable
      from a wrong one and sends the reader to fix the wrong thing.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "                        verdict=REFUSED,"
    replace: "                        verdict=DISAGREE,"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-rate-pools-the-populations
    description: >-
      Every rate stops honouring the population it was asked for, so a near-equilibrium
      machine and a table of human professionals are averaged into figures that describe
      neither. The report still prints two labelled blocks; both now hold the same
      pooled number, which is the failure that is hardest to see by reading the output.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "        row.population == population"
    replace: "        row.population == row.population"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-rate-ignores-the-position
    description: >-
      The position narrowing goes vacuous, so every seat's cell reports the whole
      population instead of that seat's decisions. The table still renders, every row
      still carries a denominator, and the blind-defence gap that is the phase's actual
      finding disappears into six identical rows.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "        and (position is None or row.position == position)"
    replace: "        and (position is None or True)"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-price-band-ignores-how-many-raises
    description: >-
      A decision facing a three-bet, or facing no raise at all, is banded as though it
      faced a single open. The price table then reads as a statement about opening sizes
      while holding a mixture of opens, three-bet prices, and unraised pots, which is the
      one arrangement that makes the price effect look smaller than it is.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "    if raises_faced != 1:"
    replace: "    if False:"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-sampled-match-collapses-into-the-agreement-rate
    description: >-
      The sampled-action match rate stops asking whether the chart's drawn action
      equalled the player's and starts reporting the agreement rate a second time under
      a different heading. Judgment call 5 ruled these are two different measurements
      and that a reader who prefers the stricter one should find it here; a duplicate of
      the looser number is worse than its absence, because it looks like corroboration.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "            sum(1 for row in drawn if row.sampled_action == row.observed_action),"
    replace: "            sum(1 for row in drawn if row.verdict == AGREE),"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-self-play-crossref-empties-silently
    description: >-
      An inventory the reader can no longer parse yields nothing instead of raising, so
      every real-hand spot is marked NEW. The phase's most actionable claim - that real
      hands reach coverage gaps self-play never does - then reads at its strongest
      exactly when the evidence for it has stopped being read at all.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "    if not spots:"
    replace: "    if False:"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-settlement-check-disabled
    description: >-
      The replayer stops checking the settlement it computed against the hand's own
      published result, so a real hand that settles to the wrong stacks is accepted in
      silence. This is the guard the entire outside-oracle argument rests on: it is
      what makes a published finishing stack something this engine can be wrong
      against, rather than a number the converter carries through untested.
    file: src/poker_training_bot/hand_history/replay.py
    find: "    if not replay.passed_expected_result:"
    replace: "    if not True:"
    must_fail:
      - pytest_sample_comparison
      - pytest_hand_history

  - id: corpus-settlement-checked-against-itself
    description: >-
      The replayer compares its settlement's payouts against its own settlement rather
      than against the published record, leaving the pot total and the winning seats as
      the only checks. An oracle computed from the thing it checks is a mirror, and this
      is that shortcut installed one clause at a time: chips misallocated between two
      winners of the same pot then pass unnoticed.
    file: src/poker_training_bot/hand_history/replay.py
    find: "            and self.settlement.payouts == self.hand.result.payouts"
    replace: "            and self.settlement.payouts == self.settlement.payouts"
    must_fail:
      - pytest_sample_comparison
