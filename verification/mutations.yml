schema_version: 1

# Each entry is a small, deliberate defect and the gate command that must notice
# it. A mutation that survives means the gate is decorative for that behavior:
# either no test covers it, or a test covers it too weakly to fail. Surviving
# mutations are a gate failure, not a suggestion.
#
# `find` must occur exactly once in `file`. The runner asserts that, so a mutation
# cannot silently stop applying when the code around it is refactored.

mutations:
  - id: positions-late-labels-swapped
    description: >-
      The cutoff and hijack labels swap places, so every chart spot and report
      names the wrong seat while staying internally consistent.
    file: src/poker_training_bot/poker_core/positions.py
    find: '_LATE_LABELS_BUTTON_FIRST: tuple[str, ...] = ("BTN", "CO", "HJ", "LJ")'
    replace: '_LATE_LABELS_BUTTON_FIRST: tuple[str, ...] = ("BTN", "HJ", "CO", "LJ")'
    must_fail:
      - pytest_preflop_artifacts

  - id: lookup-tie-picks-an-action
    description: >-
      A mixed or tied hand class quietly returns its first positive action instead
      of refusing to choose, which is the exact heuristic guessing v1 forbids.
    file: src/poker_training_bot/solver_artifacts/lookup.py
    find: "if len(positive) == 1:"
    replace: "if len(positive) >= 1:"
    must_fail:
      - pytest_preflop_artifacts

  - id: importer-checksum-not-enforced
    description: >-
      The artifact weights checksum is computed and then ignored, so an edited
      chart imports cleanly with a stale audit trail.
    file: src/poker_training_bot/solver_artifacts/importer.py
    find: "if checksum != derived_checksum:"
    replace: "if False and checksum != derived_checksum:"
    must_fail:
      - pytest_preflop_artifacts

  - id: decision-audit-skips-legality
    description: >-
      The decision audit record stops rejecting an action outside legal_actions,
      which is the check the strategy layers rely on to prove legality.
    file: src/poker_training_bot/strategy/contract.py
    find: "if self.outcome.action not in self.query.legal_actions:"
    replace: "if False and self.outcome.action not in self.query.legal_actions:"
    must_fail:
      - pytest_strategy_contract

  - id: engine-min-raise-not-updated-after-bet
    description: >-
      Reintroduces the min-raise bug an independent review caught in Phase 03: a
      postflop bet no longer raises the minimum for the next raiser.
    file: src/poker_training_bot/poker_core/engine.py
    find: "new_min_raise = self.min_raise if amount < self.min_raise else amount"
    replace: "new_min_raise = self.min_raise"
    must_fail:
      - pytest_poker_core

  - id: fallback-answers-preflop
    description: >-
      The postflop fallback accepts a preflop query, so a spot the committed charts
      do not cover quietly gets a passive action instead of the refusal that is the
      whole coverage signal.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: 'POSTFLOP_STREETS: tuple[str, ...] = ("flop", "turn", "river")'
    replace: 'POSTFLOP_STREETS: tuple[str, ...] = ("flop", "turn", "river", "preflop")'
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-folds-guaranteed-chops
    description: >-
      The unbeatable test counts a chop against calling again, so the bot folds hands
      no holding can beat and gives up half of the money already in the middle. This
      is the stage 8 blocker itself, reinstalled as a canary: it shipped through a
      green gate once, because the tests of the day pinned it.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: "return villain_rank.beats(hero_rank)"
    replace: "return villain_rank.beats(hero_rank) or villain_rank.ties(hero_rank)"
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-abandons-the-turn
    description: >-
      The unbeatable call reverts to the river only, so a turn hand that no river card
      can break folds to a bet and the extension ruled at stage 8 disappears without
      any test of the river rule noticing.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: 'DECIDABLE_STREETS: tuple[str, ...] = ("turn", "river")'
    replace: 'DECIDABLE_STREETS: tuple[str, ...] = ("river",)'
    must_fail:
      - pytest_postflop_fallback

  - id: fallback-turn-needs-only-one-safe-river
    description: >-
      The turn claim becomes existential instead of universal: hero calls if any river
      card leaves the hand safe rather than if every one does. That is the difference
      between a fact and a hope, and it is invisible to any hand that is safe on the
      whole runout.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: "    return all("
    replace: "    return any("
    must_fail:
      - pytest_postflop_fallback

  - id: composite-routes-preflop-to-the-fallback
    description: >-
      The composite sends every street to the fallback, so the committed preflop
      charts stop being consulted at all and every preflop decision becomes a check
      or a fold that looks deliberate.
    file: src/poker_training_bot/strategy/composite.py
    find: "return PREFLOP_COMPONENT if street == \"preflop\" else POSTFLOP_COMPONENT"
    replace: "return POSTFLOP_COMPONENT"
    must_fail:
      - pytest_postflop_fallback

  - id: simulator-seeds-from-global-random
    description: >-
      The simulator's per-hand shuffle picks up the random module's global state, so a
      report's numbers stop being regenerable and the seed printed beside them stops
      meaning anything. A non-deterministic simulation still produces a perfectly
      plausible report, which is why this needs a canary at all. The first version of
      this entry shifted the seed by len(str(hand_seed)) % 2 and survived, because a
      deterministic shift is still deterministic - a canary aimed at reproducibility
      that was itself reproducible.
    file: src/poker_training_bot/simulator/run.py
    find: "    return Random(hand_seed)"
    replace: "    return Random(hand_seed + __import__('random').randrange(3))"
    must_fail:
      - pytest_simulator

  - id: simulator-forgets-what-players-put-in
    description: >-
      A hand's books count what each seat was paid and forget what it put in, so chips
      appear out of nowhere and every per-hand figure in the report is inflated by the
      pot. The first version of this entry disabled the conservation raise instead, and
      survived: switching off an assertion that never fires while the books balance
      changes nothing observable. A canary has to break a behaviour, not a guard.
    file: src/poker_training_bot/simulator/run.py
    find: "    deltas = {seat: settlement.payouts[seat] - played.committed[seat] for seat in config.seats}"
    replace: "    deltas = {seat: settlement.payouts[seat] for seat in config.seats}"
    must_fail:
      - pytest_simulator

  - id: simulator-carries-stacks-between-hands
    description: >-
      Stacks stop resetting to the committed chart's depth between hands, so from the
      second hand onward the chart refuses a table that is no longer one flat stack
      depth and the run measures the refusal path instead of the strategy.
    file: src/poker_training_bot/simulator/run.py
    find: "STACKS_RESET_EVERY_HAND = True"
    replace: "STACKS_RESET_EVERY_HAND = False"
    must_fail:
      - pytest_simulator

  - id: simulator-converts-a-refusal-into-a-fold
    description: >-
      A StrategyRefusal becomes a fold rather than ending the hand as a counted
      outcome, which erases the coverage signal Phases 04 through 06 exist to produce
      and quietly moves chips on a hand nobody decided.
    file: src/poker_training_bot/simulator/run.py
    find: "REFUSAL_VOIDS_THE_HAND = True"
    replace: "REFUSAL_VOIDS_THE_HAND = False"
    must_fail:
      - pytest_simulator

  - id: chart-refusal-forgets-what-it-looked-for
    description: >-
      A chart miss stops naming the spot it could not find, so the refusal is a count of
      the kind of miss and nothing more. That is the state Phase 07 shipped in, where the
      report announced that 21.3% of hands were refused and could not say where, and the
      only trace of the spot was an action sequence the simulator then discarded.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "        return tuple(detail)"
    replace: "        return ()"
    must_fail:
      - pytest_strategy_contract
      - pytest_simulator

  - id: simulator-drops-the-refused-street
    description: >-
      A refused hand goes back to filing only the streets that finished, which on a preflop
      refusal is none of them, so every action taken before the refusal is thrown away and
      the refused spot becomes unidentifiable from the hand. This is the Phase 07 stage 8
      blocker itself, reinstalled as a canary.
    file: src/poker_training_bot/simulator/run.py
    find: "    return (*filed, HistoryStreet(name=street, board=board, actions=tuple(actions)))"
    replace: "    return tuple(filed)"
    must_fail:
      - pytest_simulator

  - id: corpus-call-copies-the-target-total
    description: >-
      A call converted from the corpus records the street's bet level rather than the
      chips the caller actually added, so a small blind calling a raise to 210 is
      recorded as putting in 210 instead of 160. The hand still replays cleanly and
      settles to the wrong stacks, which is the exact class of defect an outside
      settlement oracle exists to catch and no internal check ever would.
    file: src/poker_training_bot/data_pipeline/convert.py
    find: "                actions.append(HistoryAction(seat, HistoryActionKind.CALL, owed))"
    replace: "                actions.append(HistoryAction(seat, HistoryActionKind.CALL, street_bet))"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-button-off-by-one
    description: >-
      The button moves one seat from where the corpus's blind placement puts it. Nothing
      raises: every hand still converts and still replays, but every decision is compared
      against the chart cell for the wrong position, and no aggregate number in the report
      would look wrong.
    file: src/poker_training_bot/data_pipeline/convert.py
    find: "    return next_seat(seats, seats[-2])"
    replace: "    return next_seat(seats, seats[-3])"
    must_fail:
      - pytest_sample_comparison

  - id: agreement-demands-the-drawn-action
    description: >-
      Agreement narrows to the single action the chart's seeded draw produced, so a
      correctly mixed cell reads as a disagreement in proportion to how mixed it is.
      This is the rule ruled out before implementation, reinstalled as a canary.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "            return AGREE if weight > 0.0 else DISAGREE"
    replace: "            return AGREE if weight >= 0.5 else DISAGREE"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-refusal-counted-as-disagreement
    description: >-
      A spot the chart cannot answer is scored against the chart instead of being
      reported as missing coverage, which makes an absent chart cell indistinguishable
      from a wrong one and sends the reader to fix the wrong thing.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "                        verdict=REFUSED,"
    replace: "                        verdict=DISAGREE,"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-rate-pools-the-populations
    description: >-
      Every rate stops honouring the population it was asked for, so a near-equilibrium
      machine and a table of human professionals are averaged into figures that describe
      neither. The report still prints two labelled blocks; both now hold the same
      pooled number, which is the failure that is hardest to see by reading the output.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "        row.population == population"
    replace: "        row.population == row.population"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-rate-ignores-the-position
    description: >-
      The position narrowing goes vacuous, so every seat's cell reports the whole
      population instead of that seat's decisions. The table still renders, every row
      still carries a denominator, and the blind-defence gap that is the phase's actual
      finding disappears into six identical rows.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "        and (position is None or row.position == position)"
    replace: "        and (position is None or True)"
    must_fail:
      - pytest_sample_comparison

  - id: preflop-collapse-stops-sampling-and-takes-the-first-action
    description: >-
      The seeded weighted draw is replaced by a roll of zero, so every mixed cell
      collapses to whichever action the artifact lists first rather than to one drawn in
      proportion to its weight. Nothing raises and every spot still resolves. This is the
      plurality rule Phase 05 shipped and then re-ruled against once the independent
      review measured what it costs: a first-order exploit, because a hand the chart
      plays three ways in ten becomes a hand it plays one way always.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "        roll = _roll(seed) * sum(weight for _, weight in positive)"
    replace: "        roll = 0.0"
    must_fail:
      - pytest_full_table_preflop

  - id: corpus-price-band-ignores-how-many-raises
    description: >-
      A decision facing a three-bet, or facing no raise at all, is banded as though it
      faced a single open. The price table then reads as a statement about opening sizes
      while holding a mixture of opens, three-bet prices, and unraised pots, which is the
      one arrangement that makes the price effect look smaller than it is.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "    if raises_faced != 1:"
    replace: "    if False:"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-sampled-match-collapses-into-the-agreement-rate
    description: >-
      The sampled-action match rate stops asking whether the chart's drawn action
      equalled the player's and starts reporting the agreement rate a second time under
      a different heading. Judgment call 5 ruled these are two different measurements
      and that a reader who prefers the stricter one should find it here; a duplicate of
      the looser number is worse than its absence, because it looks like corroboration.
    file: src/poker_training_bot/data_pipeline/comparison.py
    find: "            sum(1 for row in drawn if row.sampled_action == row.observed_action),"
    replace: "            sum(1 for row in drawn if row.verdict == AGREE),"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-self-play-crossref-empties-silently
    description: >-
      An inventory the reader can no longer parse yields nothing instead of raising, so
      every real-hand spot is marked NEW. The phase's most actionable claim - that real
      hands reach coverage gaps self-play never does - then reads at its strongest
      exactly when the evidence for it has stopped being read at all.
      Re-pointed 2026-09-04. The reader moved out of `comparison.py` into
      `data_pipeline/self_play_reference.py` when phase 14 made the column compare
      price-stripped shapes, and the `file:` field stayed behind, so this canary was
      matching nothing and `check_gate_bite` would have refused it. Nothing about the
      claim changed; the guard it attacks is the same guard, in a new file.
    file: src/poker_training_bot/data_pipeline/self_play_reference.py
    find: "    if not spots:"
    replace: "    if False:"
    must_fail:
      - pytest_sample_comparison

  - id: corpus-settlement-check-disabled
    description: >-
      The replayer stops checking the settlement it computed against the hand's own
      published result, so a real hand that settles to the wrong stacks is accepted in
      silence. This is the guard the entire outside-oracle argument rests on: it is
      what makes a published finishing stack something this engine can be wrong
      against, rather than a number the converter carries through untested.
    file: src/poker_training_bot/hand_history/replay.py
    find: "    if not replay.passed_expected_result:"
    replace: "    if not True:"
    must_fail:
      - pytest_sample_comparison
      - pytest_hand_history

  - id: corpus-settlement-checked-against-itself
    description: >-
      The replayer compares its settlement's payouts against its own settlement rather
      than against the published record, leaving the pot total and the winning seats as
      the only checks. An oracle computed from the thing it checks is a mirror, and this
      is that shortcut installed one clause at a time: chips misallocated between two
      winners of the same pot then pass unnoticed.
    file: src/poker_training_bot/hand_history/replay.py
    find: "            and self.settlement.payouts == self.hand.result.payouts"
    replace: "            and self.settlement.payouts == self.settlement.payouts"
    must_fail:
      - pytest_sample_comparison

  - id: quality-fact-drift-accepts-a-rewritten-sentence
    description: >-
      A fact whose pattern no longer matches the document that quotes it passes silently
      instead of failing. The number has stopped being checked at that point, and the
      check reports everything as fine, which rebuilds the exact hole this phase exists
      to close - inside the fix for it. Nothing else about the check changes: registered
      facts with matching sentences still compare correctly, so a run against a healthy
      repo looks identical.
    file: scripts/quality_checks.py
    find: "            if not found:"
    replace: "            if False:"
    must_fail:
      - pytest_quality_hardening

  - id: loop-review-trigger-never-fires
    description: >-
      The diff trigger stops seeing hand-written work, so every stage reports that it
      owes no review and the loop advances exactly as it did before the rule existed.
      This is the decorative failure the rule is most likely to have: nothing errors,
      no stage stops, and the only symptom is reviews that never get asked for.
    file: scripts/loop_stage.py
    find: "    return [path for path in paths if not path.startswith(UNREVIEWED_PATHS)]"
    replace: "    return []"
    must_fail:
      - pytest_loop_machinery

  - id: loop-blocker-stops-blocking
    description: >-
      A blocker finding no longer holds its stage, so a reviewer can record that the
      work is wrong and the loop advances anyway. The note still exists and still
      reads as a blocker, which is worse than having no review at all.
    file: scripts/loop_stage.py
    find: '        if in_section and stripped.startswith("- ") and RESOLVED_MARKER not in stripped:'
    replace: "        if False:"
    must_fail:
      - pytest_loop_machinery

  - id: contract-id-mismatch-goes-unreported
    description: >-
      The two sides of the phase sequence stop being compared, so a contract nobody
      declares or a declared phase with no contract passes the gate. This is the check
      that replaced a hardcoded count of ten, and without it the replacement is a
      function that reports nothing at all.
    file: scripts/check_contracts.py
    find: "    undeclared = sorted(seen_ids - declared_ids)"
    replace: "    undeclared = []"
    must_fail:
      - pytest_loop_machinery

  - id: live-mutation-passes-the-gate
    description: >-
      The scope check stops noticing that a mutation is live in the working tree, which
      returns the repo to the state where a commit taken during a gate-bite run captures
      the planted defect. The sentinel is gitignored, so nothing else would report it.
    file: scripts/check_scope.py
    find: "    if not sentinel.exists():"
    replace: "    if True:"
    must_fail:
      - pytest_loop_machinery

  - id: unmerged-dependency-counts-as-done
    description: >-
      A phase becomes eligible the moment its dependency goes active rather than when it
      merges, so a lane starts against work that exists nowhere but a sibling's checkout.
      The fleet's whole safety property is that eligibility is measured on the integration
      branch, and this is the one line that says so.
    file: scripts/loop_fleet.py
    find: 'FINISHED = "completed"'
    replace: 'FINISHED = "active"'
    must_fail:
      - pytest_loop_fleet

  - id: finished-lane-occupies-a-lane-forever
    description: >-
      A pointer left at completed keeps counting as a running lane, so the phase that wrote
      it can never be started again and the board reports occupancy that ended weeks ago.
    file: scripts/loop_fleet.py
    find: 'LIVE_LOOPS = {"running", "halted"}'
    replace: 'LIVE_LOOPS = {"running", "halted", "completed"}'
    must_fail:
      - pytest_loop_fleet

  - id: dependency-cycle-goes-unreported
    description: >-
      A cycle in depends_on stops being detected, so a whole group of phases becomes
      permanently unstartable and the driver explains it as ordinary waiting on a
      dependency, which is the one failure mode that looks exactly like working correctly.
    file: scripts/check_repo_consistency.py
    find: "    for node in graph:\n        if colour.get(node) is None:\n            walk(node)\n    return found"
    replace: "    return set()"
    must_fail:
      - pytest_loop_fleet

  - id: a-mutation-witness-outside-the-gate-goes-unreported
    description: >-
      The check that every command a mutation names is one the derived gate runs reads
      no mutations, so it reports nothing while still printing that it passed. That check
      is what makes the narrowing of 2026-09-08 safe: each `must_fail` list here dropped
      the catch-all suite and now rests on one or two named commands, and a named command
      leaves the derived gate silently whenever its phase's status changes in
      `phase_status.yml`. Vacuous, the mutation registry keeps asserting a defect would be
      caught by a command nothing but `check_gate_bite` runs.
      Made vacuous rather than made to crash on purpose: a crash is loud and a check that
      reports zero errors is the failure this repo makes most, so the canary attacks the
      quiet one.
    file: scripts/check_repo_consistency.py
    find: "    for mutation in all_mutations:"
    replace: "    for mutation in []:"
    must_fail:
      - pytest_loop_machinery

  - id: worktree-lock-collapses-to-the-repo-root
    description: >-
      The lane lock stops following the worktree's own git directory and falls back to
      REPO_ROOT/.git, which in a linked worktree is a file rather than a directory. Every
      lane then claims the same lock, which is the collision the lock exists to stop.
    file: scripts/loop_stage.py
    find: '    resolved = git("rev-parse", "--absolute-git-dir")'
    replace: '    resolved = ""'
    must_fail:
      - pytest_loop_fleet

  - id: lanes-nest-inside-the-repository
    description: >-
      Lanes stop being siblings of the repository and land inside it, so an untracked
      directory of worktrees sits in the primary checkout's own tree. That makes the working
      tree dirty, which fails the loop's stage 0 precheck for every lane at once.
    file: scripts/loop_fleet.py
    find: '    return repo.parent / f"{repo.name}-worktrees"'
    replace: '    return repo / "worktrees"'
    must_fail:
      - pytest_loop_fleet
  - id: solver-export-hand-index-uses-the-grid-ordering
    description: >-
      GTOpen numbers ranks low to high, and this reads them high to low, which is
      the ordering this package's own chart grid uses. The two orderings live in one
      package and disagree on all but a handful of classes, so confusing them is the
      single most likely extraction defect - and it is silent. The mapping stays a
      bijection, every strategy row still sums to the scale, every node still
      re-resolves from its own path, and the committed range is entirely
      self-consistent and entirely wrong.
    file: src/poker_training_bot/solver_artifacts/gtopen_export.py
    find: '_GTOPEN_RANKS = "23456789TJQKA"'
    replace: '_GTOPEN_RANKS = "AKQJT98765432"'
    must_fail:
      - pytest_solver_export

  - id: solver-export-aggregates-ignore-the-arriving-range
    description: >-
      Every aggregate goes back to a flat combo-weighted average over all 169
      classes, dropping the reach that conditions the payload. The node payload is
      unconditional, so a hand the actor folded upstream still carries a full
      strategy row - and at the LJ-versus-3bet node the flat number is more than ten
      points from the one GTOpen reports for itself.

      check_solver_export_expectations is deliberately not named here, and that is a
      finding rather than an omission: all eleven aggregates are read at nodes where
      the actor has not yet acted, so their reach is uniformly 1 and this mutation
      moves none of them. The reach weighting only bites behind a raise, and the only
      thing in the gate that reaches there is the frozen test against the captured
      payload.
    file: src/poker_training_bot/solver_artifacts/gtopen_export.py
    find: "                weight *= self.reach_bp[index]"
    replace: "                weight *= QUANTISATION_SCALE"
    must_fail:
      - pytest_solver_export

  # Phase 11's four canaries, authored at stage 4 against the text the implementation must
  # produce rather than against the text that exists now. They therefore cannot apply until
  # stage 6 lands, which is deliberate: a canary written after the code is a canary shaped to
  # the code. Phases 08, 09 and 10 each wrote their own phase's canaries at stage 7 and each
  # recorded that as the same miss, so this phase writes them before the builder starts and
  # lets the find-string be part of the specification the builder has to satisfy.

  - id: free-fold-taken-off-the-table-again
    description: >-
      A seat with nothing to call is offered check and aggression only, which is the
      behaviour that stops any real history containing a surrendered river from replaying
      at all. The engine stays internally consistent, so nothing but the fidelity tests
      notices.
    file: src/poker_training_bot/poker_core/engine.py
    find: "            actions = [ActionKind.FOLD, ActionKind.CHECK]"
    replace: "            actions = [ActionKind.CHECK]"
    must_fail:
      - pytest_engine_fidelity

  - id: reopening-measured-against-the-preceding-bet-again
    description: >-
      Each short all-in is measured against the bet level immediately before it rather than
      against the last full bet or raise, so consecutive short all-ins never accumulate and
      betting stays closed for a seat a real room would let raise.
    file: src/poker_training_bot/poker_core/order.py
    find: "            full_raise = new_round.current_bet - self.reopen_level >= previous_min_raise"
    replace: "            full_raise = new_round.current_bet - previous_bet >= previous_min_raise"
    must_fail:
      - pytest_engine_fidelity

  - id: all-in-ceiling-loose-by-the-price-to-call-again
    description: >-
      The decision audit's all-in maximum goes back to the street's bet level plus hero's
      stack, which is too high by exactly the price to call. No shipped strategy produces a
      raise in the gap, so a green gate proves nothing about the legality claim several
      contracts lean on.
      Re-pointed at phase 13 stage 6, claim unchanged. Decision 11 rewrote the line this
      canary targets: the ceiling now reads hero's own recorded contribution off `seat_states`
      rather than subtracting `to_call` from the bet level, and the query's bet level is
      called `current_bet`. A find string that no longer occurs is a canary that cannot bite,
      which would have retired a phase 11 legality claim by accident behind a green gate.
    file: src/poker_training_bot/strategy/contract.py
    find: "                max_target = hero.street_bet + stacks[self.query.seat]"
    replace: "                max_target = self.query.current_bet + stacks[self.query.seat]"
    must_fail:
      - pytest_engine_fidelity

  - id: fail-closed-can-invest-again
    description: >-
      The fallback's fail-closed branch takes calling as a passive substitute again, so a
      branch reached because the chosen action was unavailable answers by investing in a
      hand that can lose - the one thing the module exists not to do.
    file: src/poker_training_bot/strategy/postflop_fallback.py
    find: '_PASSIVE_ORDER: tuple[str, ...] = ("fold",)'
    replace: '_PASSIVE_ORDER: tuple[str, ...] = ("fold", "call")'
    must_fail:
      - pytest_engine_fidelity

  - id: under-sized-all-in-bet-becomes-the-reference-level
    description: >-
      An all-in bet below the minimum becomes the level later advances are measured from,
      so a street opened by a short all-in measures everything after it from that short
      amount. A seat that called a 5-chip all-in where the minimum bet is 20 stays barred
      over a 22-chip all-in, though the street has advanced past a full bet and no full bet
      was ever made on it. Found by the phase 11 stage 8 domain review rather than by any
      frozen test, which is why it gets a canary of its own.
    file: src/poker_training_bot/poker_core/order.py
    find: "            reopen_level = new_round.current_bet if full_bet else self.reopen_level"
    replace: "            reopen_level = new_round.current_bet"
    must_fail:
      - pytest_engine_fidelity

  # Phase 12's own four canaries, authored at stage 4 against text the implementation
  # does not yet contain. Phases 08, 09 and 10 each wrote canaries for every command
  # except the one the phase was adding, and each was caught at stage 7 by a gate that
  # would otherwise have been decorative for exactly the behaviour the phase existed to
  # add. Phase 11 authored its five here instead and all five matched on the first try.
  # The `find` strings below are therefore a specification: stage 6 has to produce them
  # verbatim, and a mismatch is the builder having drifted rather than the canary being
  # wrong.

  - id: spot-key-drops-the-raise-size
    description: >-
      The rendered key stops carrying a raise size, so every price collapses back into one
      cell while the lookup still appears to hit. This is the shortcut the phase 12
      contract names as the one it is most exposed to: it passes every test about a lookup
      finding the right cell, and it makes the committed artifact permanently
      single-price, which is the one outcome ruling 8 asked the phase to avoid.
    file: src/poker_training_bot/solver_artifacts/spot_key.py
    find: 'return f"{entry.position}:{entry.action}@{render_size_bb(entry.size_bb)}"'
    replace: 'return f"{entry.position}:{entry.action}"'
    must_fail:
      - pytest_spot_vocabulary
      - pytest_preflop_artifacts

  - id: price-substitution-not-recorded
    description: >-
      A price answered from a cell it was not asked at stops saying so, so an exact answer
      and a substituted one become indistinguishable downstream and every later
      measurement silently mixes them. It also makes the report's substitution census
      read zero, which is the number that measures what ruling 8 costs in play.
    file: src/poker_training_bot/solver_artifacts/lookup.py
    find: "price_substitutions=tuple(substitutions),"
    replace: "price_substitutions=(),"
    must_fail:
      - pytest_spot_vocabulary
      - generate_spot_vocabulary_report

  - id: a-flat-re-raise-is-accepted
    description: >-
      The key stops requiring raises to strictly increase along the sequence, so a
      three-bet to the same amount as the open it faces gets a key. A spot that cannot
      happen is a spot a chart can be filled for, and a key space that admits it is no
      longer canonical.
    file: src/poker_training_bot/solver_artifacts/spot_key.py
    find: "if size <= previous_size:"
    replace: "if size < previous_size:"
    must_fail:
      - pytest_spot_vocabulary

  - id: a-folded-seat-may-act-again
    description: >-
      The second-orbit order rule stops rejecting a position the action already passed
      without recording, so a seat that folded to a three-bet can four-bet. This is the
      permissive direction of the same rule that makes four-bets expressible, and a
      vocabulary that accepts sequences no hand can produce buys the phase's own defect
      back in the opposite sign.
    file: src/poker_training_bot/solver_artifacts/spot_key.py
    find: "if entry.position in folded:"
    replace: "if False and entry.position in folded:"
    must_fail:
      - pytest_spot_vocabulary

  # Phase 13 canaries, authored at stage 4 before any implementation exists. Every `find`
  # below is therefore a specification the stage 6 builder must produce verbatim, the same
  # way phase 12's were: a canary written after the code can only describe what was already
  # written, which is how phases 08, 09 and 10 each ended up with no canary for the one
  # behaviour their phase existed to add.

  - id: the-pot-stops-having-to-reconcile
    description: >-
      A query whose stated pot disagrees with what the seats actually put in is accepted
      again. This is the phase's exhaustive check, chips in equal chips out, and it is the
      one rule that catches a producer whose arithmetic silently does not work. Without it
      every downstream depth and blind-structure figure rests on a pot nobody verified.
    file: src/poker_training_bot/strategy/contract.py
    find: "if self.pot != contributed_total:"
    replace: "if False and self.pot != contributed_total:"
    must_fail:
      - pytest_table_state

  - id: a-capped-hero-may-raise-again
    description: >-
      The guard rejecting a query that offers raise or bet while to_call equals hero's whole
      stack is removed. The engine never produces such a query, so nothing downstream notices
      until the all-in ceiling accepts a raise hero cannot make, which is the exact hole the
      2026-08-20 capped-to_call ruling was found to have left open.
    file: src/poker_training_bot/strategy/contract.py
    find: "if self.to_call == hero_stack and aggressive:"
    replace: "if False and self.to_call == hero_stack and aggressive:"
    must_fail:
      - pytest_table_state

  - id: hero-depth-is-derived-by-subtraction-again
    description: >-
      Hero's starting depth goes back to being recovered as the bet level minus the price to
      call rather than read from hero's own recorded contribution. Under the capped ruling
      that identity collapses to the bet level itself for any capped hero, deriving 30bb
      where the truth is 25bb, silently and with no refusal. Phase 14 publishes chart numbers
      through this path. `generate_table_state_report` is named below because the report
      validates its own worked depth against hero's recorded contribution and exits non-zero
      when the two disagree, the way phase 12's `_validate_census` fails the gate on a census
      that does not add up. A report that renders whatever number it is handed exits 0 however
      wrong the number is, and would leave this mutation alive.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "hero_start = stacks[query.seat] + hero.street_bet"
    replace: "hero_start = stacks[query.seat] + (query.current_bet - query.to_call)"
    must_fail:
      - pytest_table_state
      - generate_table_state_report

  - id: a-folded-seat-makes-the-table-ragged
    description: >-
      The flat-table test stops excluding seats that have already folded, so a folded short
      seat refuses a spot it cannot affect a single chip of. Effective stack is pairwise and
      against seats that can still act, so this is the regression the fix introduces if
      nobody is looking, and it is the case a stricter check gets wrong first.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "if state.folded:"
    replace: "if False:"
    must_fail:
      - pytest_table_state

  - id: an-absorbed-straddle-goes-unseen
    description: >-
      The minimum-raise-target signal is dropped, leaving only reconstruction and the
      unraised-level test. Those two catch an ante and an unacted straddle; neither can see a
      straddler who has already called to the level, because that seat holds exactly what an
      ordinary caller holds. That is the case the deleted pot bound also missed, so without
      this signal the phase's headline detection is no better than what it replaced.
      `generate_table_state_report` is named below because the report reconciles its straddle
      census against the minimum-raise prediction the detector used and exits non-zero when the
      two disagree, the way phase 12's `_validate_census` fails the gate on a census that does
      not add up. A report that renders whatever it is handed exits 0 with the straddled pot
      silently missing from its count, and would leave this mutation alive.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "if query.min_raise_target != predicted_min_raise:"
    replace: "if False and query.min_raise_target != predicted_min_raise:"
    must_fail:
      - pytest_table_state
      - generate_table_state_report

  - id: the-depth-refusal-names-the-first-offender-in-seat-order
    description: >-
      The deeper branch goes back to naming whichever live seat deeper than hero comes first in
      seat order rather than the deepest one. Decision 6 refuses any difference at all and keeps
      the seat and the depth it holds as the evidence whoever re-rules it will work from, and
      evidence that moves with the seating is not evidence: the same two stacks in swapped chairs
      report 90bb and 20bb. The whole suite was named below until 2026-09-08 and was never what
      notices this, and saying so was the point rather than a hedge: all 66 frozen phase 13 tests
      pass under this mutation, because no frozen test puts two live seats on the same side of
      hero, so first-in-seat-order and deepest agree in every one of them. `pytest` went red only
      through `test_every_mutation_applies_exactly_once_to_its_file`, which is a fact about this
      registry rather than about the behaviour, and which fires for every mutation in this file
      alike. A witness that cannot fail to fire is not a witness, so no entry names the suite now.
      `generate_table_state_report` is what actually has to fail, and it does so through two
      different checks in `_validate_depth_probes` depending on how the rule is broken. Change the
      strategy alone, as this mutation does, and the rule that kills it is the one comparing the
      strategy against the report's second copy: they stop agreeing on the committed hand
      `phase02-three-way-side-pot`, where from the 50-chip chair the first deeper live seat holds
      100 and the deepest holds 200, so the mutation would publish 10bb for a table that is 20bb.
      Change BOTH copies the same way and that rule is silent, and what kills it instead is the
      rule recomputing the extreme offending seat from the seat states and asking neither copy.
      Verified by hand: reverting both copies in both directions leaves every test green and the
      report exits non-zero anyway.
      That second rule is why this canary exists at all. Two agreeing copies of a rule cannot show
      the rule is right, and a validator that only compares them is the repo's most-repeated
      defect - a check that cannot fail - sitting inside the fix for a blocker.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "deep = max(live, default=None, key=lambda pair: (pair[0], -pair[1]))"
    replace: "deep = next((pair for pair in live if pair[0] > hero_start), None)"
    must_fail:
      - generate_table_state_report

  - id: the-short-seat-refusal-names-the-first-offender-in-seat-order
    description: >-
      The same defect in the other direction: the shorter branch goes back to naming whichever
      live seat shorter than hero comes first in seat order rather than the shortest one.
      A separate entry rather than a second `find` on the same one, because the two directions
      are not equally load-bearing and one canary would have left that invisible. This is the
      direction the phase ADDED - `a-live-seat-is-shorter-than-hero` did not exist before it -
      and it is the direction that matters most in poker, since effective stack is the minimum of
      hero and villain, so a live seat shorter than hero is what makes a hundred-big-blind chart
      the wrong chart while a deeper one barely moves the correct range. The number whoever
      re-rules decision 6 will set a tolerance against is the SHORTEST live opponent's depth, and
      under the mutation that number is whatever the seating happens to put first.
      Committed data cannot kill this one, which is why the phase constructed a probe that can:
      the deeper direction has `phase02-three-way-side-pot`, and the shorter direction has the
      report's own two-live-seats-shorter-than-hero table at 90bb and 20bb, where first-in-order
      holds 9,000 and the shortest holds 2,000. `_validate_depth_probes` refuses to publish unless
      a distinguishing row exists in EACH direction, so neither branch can be quietly reverted
      behind a probe set that covers only the other one. As with its sibling, all 66 frozen phase
      13 tests pass under this mutation, and the whole suite went red only through the registry
      check, which fires for every mutation here. That is why it is no longer named below.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "short = min(live, default=None)"
    replace: "short = next((pair for pair in live if pair[0] < hero_start), None)"
    must_fail:
      - generate_table_state_report

  - id: the-residual-refusal-names-the-lowest-chair
    description: >-
      The third extremal-seat rule, and the one the two entries above do not reach: the
      blind-structure refusal goes back to naming whichever seat holding unexplained money sits
      in the lowest chair, rather than the seat holding the most of it. Same defect, same shape,
      different reader - the depth refusal's evidence is a depth and this one's is a seat and a
      number of chips, and both are what whoever re-rules decision 6 will work from. Evidence
      that moves with the seating is not evidence. Reverted, the report publishes
      `(seat 0, forced_chips 50)` for a pot whose truth is `(seat 1, forced_chips 100)`, in the
      same census row whose prose says the seat reported is the one holding the most, so the
      table would contradict the sentence printed beside it.
      `pytest_table_state` is deliberately not named below, and that is a finding rather than an
      omission: measured, all 66 frozen phase 13 tests pass under this mutation, because no
      frozen test builds a pot where two seats hold DIFFERENT amounts of unexplained money, and
      on a pot with one such seat the lowest chair and the most forced chips are the same answer.
      The whole suite went red only through
      `test_every_mutation_applies_exactly_once_to_its_file`, which is a fact about this registry
      rather than about the behaviour, and which fires for every mutation here. It was dropped
      from every entry on 2026-09-08 for that reason.
      `generate_table_state_report` is what actually has to fail, and it does so through
      `validate_residual_seat`, which recomputes the seat from the contributions rather than
      asking the rule. The pot that kills it is the report's own `two dead blinds of different
      sizes`, where the lojack owes 50 and the hijack owes 100: the only pot in the census where
      more than one seat holds unexplained money in unequal amounts, which is also why that check
      refuses to publish a census holding no such pot at all.
      Recomputing rather than comparing is the whole point, and it is verified by hand: the
      report carries a second copy of the selection rule, and reverting BOTH copies the same way
      still exits non-zero. Not through the seat comparison, which then agrees with itself, but
      through the rule demanding a pot where the two answers differ, which under the revert is 0
      of the 2 pots refused as holding forced money of no named kind. Two agreeing copies of a
      rule cannot show the rule is right.
    file: src/poker_training_bot/strategy/preflop_chart.py
    find: "seat, chips = max(forced.items(), key=lambda pair: (pair[1], -pair[0]))"
    replace: "seat, chips = min(forced.items())"
    must_fail:
      - generate_table_state_report

  - id: an-impossible-raise-sequence-still-constructs
    description: >-
      `preflop_actions` goes back to accepting a betting sequence no street can produce: a
      raise-to at or below the standing level. Nothing raises, and the damage is downstream,
      because both walks in `table_state/forced_money.py` start their level at the declared big
      blind and move it to each recorded raise-to, so a sub-level entry DROPS the level and every
      increment measured after it is measured from the wrong number.
      Measured, at 50/100 six-handed with the button at seat 3 and the history `LJ fold, HJ raise
      250, CO raise 200, BTN call, SB fold, BB call` against the 400 the table offers as a minimum
      raise: `predicted_min_raise_target` walks 100 -> 250 -> 200 and predicts 350, so the pot is
      refused as `pot-holds-a-straddle` with the disagreement as its evidence.
      `predicted_contributions` predicts {1: 250, 2: 200, 3: 200, 5: 200} where the three seats
      that paid the real level of 250 each hold 250, so 50 chips at each of seats 2, 3 and 5 read
      as money nobody chose to put in, and with the straddle signal quieted the same pot is
      refused as `blind-structure-not-representable` naming one of them for 50 chips. Both are
      statements about forced money in a pot that holds none.
      `BettingRoundState.apply` in `poker_core/engine.py`
      rejects a sub-level raise and records a shove for less than the level as a call, so no live
      producer in this repo can emit one: it arrives only from a report producer computing a
      history by hand, which is exactly what the constructed tables in
      `scripts/generate_table_state_report.py` are.
      The alternative considered and rejected was clamping the level inside the walks. A clamp in
      `predicted_min_raise_target` alone converts the false straddle into a false blind-structure
      refusal, and a clamp in both fails OPEN: it launders the impossible history into a pot the
      walks find nothing wrong with, and one that the key space can write is then answered.
      Measured with both walks clamped, on the shortest history that goes backwards - a lone `LJ
      raise to 80` under a declared big blind of 100, which is a sub-level raise-to whose ACTION
      ORDER is perfectly ordinary. The clamped minimum-raise walk holds the level at 100 and
      predicts the 200 the table offers, the clamped contributions walk leaves nothing
      unexplained, so both forced-money signals fall silent, the spot key builder renders the
      0.8bb raise as the nearest priced open it holds - `t6/d100/BB/LJ:raise@2.5`, price
      substitution 0.8 -> 2.5 - and the chart answers `raise`. An impossible history is answered
      with the range for a 2.5bb open.
      The six-action history above is NOT what demonstrates that, and saying so is the point
      rather than a hedge: measured under the same clamps it reaches the chart and is refused
      there, by the key space rather than by the money -
      `preflop-chart:lookup:unrepresentable-spot`, `BB facing ['HJ:raise@2.5', 'CO:raise@2',
      'BTN:call', 'BB:call'] has no spot key; no legal preflop order produces it`. Its two callers
      behind a raiser with the button still to act is a shape no legal street produces whatever
      the level does, so the key space refuses it on the order alone and the clamp's damage is
      invisible behind that. What that history shows is the UNCLAMPED cost, which is the case
      above: the false straddle, and the false blind structure once the straddle signal is
      quieted. The record is refused where it is built instead.
      `pytest_table_state` is deliberately not named below, and that is a finding rather than an
      omission: all 66 frozen phase 13 tests pass with this rule present or absent, because the
      tests were frozen at stage 5 and the defect was found at stage 8, so not one of them
      constructs a sequence that goes backwards. The whole suite went red only through
      `test_every_mutation_applies_exactly_once_to_its_file`, which is a fact about this registry
      rather than about the behaviour, and which fires for every mutation here. It was dropped
      from every entry on 2026-09-08 for that reason.
      `generate_table_state_report` is what actually has to fail, and it does so through
      `_validate_impossible_history_is_refused` in `table_state/checks.py`, which rebuilds one
      of the report's own straddle probes with a sub-level raise via `dataclasses.replace` - that
      re-runs `__post_init__` on the frozen dataclass - and refuses to publish if the query
      constructs. A report that renders whatever it is handed exits 0 with the rule gone, and
      would leave this mutation alive.
    file: src/poker_training_bot/strategy/contract.py
    find: "if entry.amount <= level:"
    replace: "if False and entry.amount <= level:"
    must_fail:
      - generate_table_state_report

  # Phase 14's canaries, authored at stage 4 before any implementation exists. Every `find`
  # below is therefore a specification the stage 6 builder must produce verbatim, the same way
  # phases 11, 12 and 13's were: a canary written after the code can only describe what was
  # already written, which is how phases 08, 09 and 10 each ended up with no canary for the one
  # behaviour their phase existed to add. A find string that does not occur is the builder
  # having drifted from the specification, not the canary being wrong.
  #
  # Four of the ten below satisfy the contract's requirement that at least one canary prove a
  # wrong ARTIFACT fails the gate rather than merely a wrong report:
  # `the-big-blind-squeeze-clause-is-dropped`, `committed-cells-claim-the-whole-range-arrived`,
  # `a-class-that-never-arrives-is-committed-anyway` and `every-spot-claims-its-line-is-always-played`.
  # The first has now been renamed twice by a rule change it outlived - it was
  # `derivation-reach-floor-drops-to-a-tenth` until 2026-08-27 and
  # `derivation-predicate-drops-its-subtree-clause` until 2026-09-04 - and on the first of those
  # occasions this sentence was left pointing at the retired name, which is this comment failing
  # the same way the canary did. On 2026-09-04 the entry was not renamed but REPLACED: the
  # predicate it attacked no longer exists in any form, so there was nothing to re-point, and the
  # canary now in that slot attacks the big-blind squeeze clause instead. See its own description.
  # The mechanism is worth stating exactly, because the first version of this comment described
  # one that does not run and an independent review caught it. No mutation here touches anything
  # under `data/`, and `check_gate_bite` never regenerates the artifact, so the committed file
  # stays correct throughout. What bites is the DISAGREEMENT between mutated derivation code and
  # the unchanged committed artifact, caught by `convert_preflop_export.py --check` and by the
  # report validating the artifact's own spot count against the walk's. That comparison is
  # symmetric - it cannot tell which side moved - so a mutated deriver and a corrupted artifact
  # are one failure to it, which is what makes these two canaries evidence about the artifact and
  # not only about the code that writes it.

  - id: the-big-blind-squeeze-clause-is-dropped
    description: >-
      The third selection clause stops being asked, so the ten spots decision 48 refuses ship in
      the chart. At the table that is the big blind being taught to defend against a raise
      somebody has already flat-called. Those ten are the only committed shape whose own chart
      still offers hero a call that buys him a three-way flop - everywhere else the call the bot
      may take is either dropped from the exposure measurement as a cold call or the pot is
      heads-up by then - and a three-way flop is exactly the pot GTOpen prices with the product
      approximation decisions 35 and 46 exist to keep out of the chart.
      Neither other clause can reach them, which is why the clause is a clause. The raises in
      front of hero are at one, so the depth clause is satisfied; and the big blind folds better
      than nine times in ten here, so the branch that goes multiway carries under nine points and
      the exposure clause reads them as safe. A rule about a seat is what refuses them and
      nothing else in the gate is a statement about that seat.
      This entry REPLACES `derivation-predicate-drops-its-subtree-clause` rather than re-pointing
      it. That canary attacked `invested_opponents(...) <= 1 and live_players(...) <= 2`, the
      two-clause predicate Taylor ruled on 2026-08-24 and superseded on 2026-08-25, and its
      description argued 86 nodes against 110. The predicate is gone from the tree in every form,
      so its find string matched nothing and `check_gate_bite` would have refused it; the
      exposure clause that inherited its argument already has
      `a-spot-above-the-exposure-threshold-is-committed`, and the squeeze clause had no canary at
      all, so the slot goes where the hole is.
      Aimed at the call site in `exclusion_code` rather than inside the predicate, deliberately.
      A frozen test asserts `is_big_blind_squeeze_spot` directly on named nodes, so a mutation
      inside the predicate dies to a test reading the predicate back and proves only that the
      predicate is pinned. Dropped at the call site the predicate still answers True and the only
      thing that can notice is a spot moving. Measured 2026-09-04 against the committed export:
      the committed set goes from 249 to 259, and the `derivation:big-blind-squeeze-spot` census
      bucket from 10 to nothing at all.
      `generate_derived_chart_report` is named and is the load-bearing entry, for the same reason
      it is on the exposure canary: the report cannot read the clause, it compares the artifact's
      spot set against the walk's key by key, so it fails only because ten spots moved. If it
      exits 0 under this mutation, that is the finding and not a reason to drop the command.
    file: src/poker_training_bot/solver_artifacts/chart_selection.py
    find: "    if is_big_blind_squeeze_spot(by_path, node):"
    replace: "    if False and is_big_blind_squeeze_spot(by_path, node):"
    must_fail:
      - pytest_derived_chart
      - generate_derived_chart_report

  - id: the-four-bet-family-is-committed-after-all
    description: >-
      The committed raise depth goes from two to three, so the four-bet family a later phase takes
      up ships now. At the table hero is handed an answer to a four-bet a hundred blinds deep off
      a solve whose four-bet is priced a quarter oversized
      (`PREFLOP-FOUR-BET-SIZE-IS-A-QUARTER-OVERSIZED`), and the answer at that depth is a call-off
      or a fold for a stack - the most expensive single decision in the game to take from a chart
      that was not solved at the price in front of him. Measured 2026-09-04 against the committed
      export: the committed set goes from 249 to 2,456 and the depth bucket from 33,362 to 29,105.
      Loud rather than at the margin, and that is the clause's own shape rather than a lazy aim: a
      raise depth names a family, so it cannot be moved a little the way a threshold can. It is
      written as the constant rather than as the call site because dropping the clause outright
      commits 18,789 nodes, which is a mutation no reviewer learns anything from.
      The kill in the pytest commands is a frozen test reading `COMMITTED_RAISE_DEPTH` back and
      comparing it to two, and a kill of that kind proves the constant is pinned rather than that
      the rule uses it. `generate_derived_chart_report` is therefore the load-bearing entry: the
      report cannot read the constant, and fails only because 2,207 spots moved. Same argument as
      `a-spot-above-the-exposure-threshold-is-committed`, and the same finding if the report
      exits 0.
    file: src/poker_training_bot/solver_artifacts/chart_selection.py
    find: "COMMITTED_RAISE_DEPTH = 2"
    replace: "COMMITTED_RAISE_DEPTH = 3"
    must_fail:
      - pytest_derived_chart
      - generate_derived_chart_report

  - id: the-cold-call-survives-into-the-published-chart
    description: >-
      Decision 45's merge changes seats, so both halves of the ruling break at once. The twenty
      non-big-blind spots facing an open stop folding hero's call into the raise and publish a
      cold call instead; the five big-blind spots lose their defence flat into the raise. At the
      table the first is the bot putting money in behind an opener with nothing already invested,
      buying a multiway pot out of position, which is the play decision 45 exists to remove. The
      second is the big blind three-betting the hands it should be calling with, throwing away the
      price its own posted blind bought.
      One line is worth attacking because the rule is entirely about which seat has already paid
      to be there - a cold call is money in from a seat with nothing invested, a big blind's call
      is a defence - and inverting that seat test is the way this rule is most likely to be got
      wrong by someone who reads "the bot never cold-calls" and applies it to every call.
      Measured 2026-09-04 against the committed export: the spots that merge go from 20 to 5, and
      the cells the merge moves from 165 to 276.
      `generate_derived_chart_report` is deliberately NOT named, and saying so is a finding rather
      than an omission: the merge moves cells inside spots and never the spot set, so the report's
      key-by-key comparison is blind to it, and no canary on this file should be read as evidence
      that the report checks the cells. What kills it is the regeneration check - a mutated
      deriver no longer reproduces the committed artifact - and the frozen count of the cells the
      merge moves.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: '    return raises_faced(by_path, node) == 1 and node.actor_pos != "BB"'
    replace: '    return raises_faced(by_path, node) == 1 and node.actor_pos == "BB"'
    must_fail:
      - pytest_derived_chart

  - id: committed-cells-claim-the-whole-range-arrived
    description: >-
      Every committed cell records full arriving reach instead of the reach the export gives it,
      so a cell the solver trained and a cell it barely visited become indistinguishable. That is
      exactly the information `CHART-CELLS-SHOULD-CARRY-ARRIVING-REACH` asks for and decision 5
      ruled in, and it is the same information a refusal carries. The artifact still validates,
      still imports, still answers every spot it did before, and every frequency in every report
      is unchanged, so nothing but a test comparing the committed reach against the export's own
      `reach_bp` can see it.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: "reach_by_class[hand_class_text] = node.reach_bp[gtopen_class_index(hand_class_text)]"
    replace: "reach_by_class[hand_class_text] = 10_000"
    must_fail:
      - pytest_derived_chart

  - id: a-class-that-never-arrives-is-committed-anyway
    description: >-
      The converter stops asking whether a hand class arrives at a node and commits all 169
      strategy rows at every spot, so the artifact goes from 7,112 cells to 14,534. A GTOpen
      payload is unconditional - a hand hero folded upstream still carries a full strategy row -
      and 3,781 of the rows the mutation admits are the solver's untouched initialisation, every
      action within a basis point of 1/n. `UNIFORM-INITIALISATION-ROWS-ARE-NOT-STRATEGY` is the
      entry, and the sharpest single cell is the small blind facing a hundred-blind four-bet jam
      with 72o: reach zero, row 5,000/5,000, so the mutated chart calls off a hundred blinds with
      72o half the time and says it with the same confidence it says fold to a four-bet. A uniform
      row is worse than a gap rather than merely as bad, because it does not read as missing.
      This is the third canary that is evidence about the ARTIFACT rather than about the report,
      and by the same mechanism as the other two: no mutation touches anything under `data/` and
      `check_gate_bite` never regenerates the artifact, so what bites is the disagreement between
      the mutated derivation and the unchanged committed file, caught by
      `convert_preflop_export.py --check`. `committed-cells-claim-the-whole-range-arrived` is its
      sibling and a different defect - that one keeps the cell set and lies about the reach, this
      one reads the reach correctly and ignores it.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: "        if node.reach_bp[gtopen_class_index(hand_class_text)] <= 0:"
    replace: "        if False and node.reach_bp[gtopen_class_index(hand_class_text)] <= 0:"
    must_fail:
      - pytest_derived_chart

  - id: every-spot-claims-its-line-is-always-played
    description: >-
      Every committed spot records full arrival instead of the chance its line is actually played,
      so a spot the solve worked out and a spot it never visited become indistinguishable. It is
      the exact counterpart of `committed-cells-claim-the-whole-range-arrived` one level up: that
      one lies about which hands reach a node, this one lies about whether the node is reached.
      The field exists because Taylor ruled on 2026-08-27 that the untrained cells ship committed
      rather than blanked, on the ground that a later heuristic layer wants them - and a layer
      keying on this field reads eight never-reached spots holding 1,031 cells as ordinary play
      once the mutation lands. Arriving reach cannot catch it: at four of those spots every one of
      the 169 classes already reads fully arrived, and at the other four it reads like an ordinary
      range facing a four-bet, 86 to 95 classes at a mean of 4,753 to 7,654 basis points. The
      artifact still validates, still imports, still answers every spot, and no frequency in any
      report moves.
      What bites is the fourth entry in this block's artifact mechanism, spelled out in the comment
      above: no mutation touches `data/`, so `test_every_committed_spot_records_how_often_its_line_is_played`
      reads the unchanged committed file and passes under this mutation. The failure is
      `convert_preflop_export.py --check` in
      `tests/test_derived_chart.py::test_the_committed_chart_reproduces_from_the_committed_export`,
      where the mutated deriver disagrees with the artifact it is supposed to reproduce. Saying
      otherwise is the error this block's own comment records itself making once already, and an
      independent review caught it here too.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: "        arrival_ppb[key] = node_arrival_ppb(by_path, node)"
    replace: "        arrival_ppb[key] = 1_000_000_000"
    must_fail:
      - pytest_derived_chart

  - id: the-walk-takes-each-action-from-the-node-that-follows-it
    description: >-
      The actor of a recorded action is read from the node the action leads to rather than from
      the node it was taken at, so every entry in every spot key names the wrong seat. This is
      the conversion's counterpart of `solver-export-hand-index-uses-the-grid-ordering`: an
      off-by-one in whose action is whose, silent wherever the two seats happen to coincide, and
      it is the single most likely defect in a tree walk that has to look backwards to say who
      acted. A chart keyed this way is internally consistent and describes a different game.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: 'entries.append(PreflopAction(parent.actor_pos, "call"))'
    replace: 'entries.append(PreflopAction(node.actor_pos, "call"))'
    must_fail:
      - pytest_derived_chart

  - id: the-artifact-declares-blinds-it-was-not-solved-at
    description: >-
      The artifact declares a 1/3 blind structure while carrying ranges solved at 0.5/1. Decision
      4 added the field so a lookup can refuse a game whose blinds are not in the solved ratio
      instead of answering it silently, and this is that field lying rather than being absent,
      which is strictly worse: the same hand at the same stack depth is a different decision at
      1/3, and a declared-but-wrong structure passes every check an absent one would fail.
      `BLIND-RATIO-NEVER-CHECKED-AGAINST-THE-SOLVED-STRUCTURE` was phase 13's largest single
      finding, and a field nobody checks against the export's own `config_posted.posts` closes it
      in name only.
      Re-aimed at stage 4 after an independent review. The first version replaced the payload
      line in `schema.py` with a hardcoded 1/3 structure, and would have bitten only if stage 6
      routed the derived payload through `PreflopArtifact.to_payload()`, which nothing specifies -
      and the one committed test that does exercise `to_payload` round-trips it, so both dumps
      would carry the same wrong structure and agree. Aimed instead at the derivation, where the
      structure is read out of the export's own `config_posted.posts`, so the canary bites
      wherever the payload is assembled. Tripling the big blind rather than inverting the two
      keeps the mutation SILENT: an inverted structure is refused by the schema's own validation
      and would fail loudly, where 0.5/3.0 is a structure the schema accepts and only a test
      comparing it against the export's posts can catch.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: "        big_blind_bb=float(posts[-1]),"
    replace: "        big_blind_bb=float(posts[-1]) * 3.0,"
    must_fail:
      - pytest_derived_chart

  - id: a-jam-only-spot-goes-back-to-having-no-size
    description: >-
      The sizing table stops pricing an all-in, so the committed spots that offer a jam and no
      named raise carry a `raise` weight the sizing table cannot price: the chart says raise and
      cannot say how much. Over the 86 the ruled predicate commits that is 15 spots, against the
      4,257 export nodes and the 3,865 committed ones decision 6 was originally written on - the
      count moved twice with the predicate and the case did not. That is the "commit sizeless and refuse on price" option decision 6
      rejected, arriving by omission instead of by ruling. The GTO Wizard source this repo
      converted before had zero spots of that kind, which is why the rule it inherited was safe
      there and is not here, and it is why the note that a spot absent from the sizing table has
      no size stops being true of a chart nobody edited.
      Re-aimed at stage 4 after an independent review: the file was `scripts/convert_preflop_export.py`,
      but the frozen tests require the sizing table to come out of
      `chart_derivation.derive_chart(export).sizing_payload`, and a `src/` module cannot import the
      rule back out of `scripts/`. `check_gate_bite` requires the find string to occur exactly once
      in the named file, so the canary would have halted stage 7 with zero occurrences unless the
      builder wrote the collapse rule twice.
      Re-aimed again 2026-09-04, for the same reason one line up. Stage 6 pulled the two
      aggressive kinds out into `_AGGRESSIVE_KINDS` and routed every kind through the selection's
      own classifier, so the literal tuple this named is gone from the sizing rule. The line
      below is that rule, unchanged in what it does: it is the loop that decides which of a
      node's offered actions the sizing table gets a price for.
    file: src/poker_training_bot/solver_artifacts/chart_derivation.py
    find: "        if require_known_kind(node, action) in _AGGRESSIVE_KINDS:"
    replace: '        if require_known_kind(node, action) == "raise":'
    must_fail:
      - pytest_derived_chart

  - id: hero-may-limp-again
    description: >-
      The schema rule forbidding a call weight at a folded-to-hero spot goes vacuous, so an
      artifact in which hero limps imports cleanly. `CHART-HERO-MUST-NEVER-LIMP` asks for exactly
      this rule and says why: the committed export enforces it by construction, "but that is a
      property of the data rather than a rule", and phase 14 owns the schema. The retired chart
      limped 13.73 percent from the small blind across 103 hand classes carrying a nonzero call
      weight, so this is not hypothetical - it is the state the repo shipped in until this phase.
      `generate_derived_chart_report` is deliberately not named, and that is a finding rather
      than an omission: the committed artifact does not limp, so no report figure moves and no
      command that reads only good data can notice. What kills it is the test that constructs a
      limping artifact and requires the schema to refuse it, which is the whole difference
      between a rule and a measurement over one file.
    file: src/poker_training_bot/solver_artifacts/schema.py
    find: "if not spot.action_sequence and call_weight > 0.0:"
    replace: "if False and call_weight > 0.0:"
    must_fail:
      - pytest_derived_chart

  - id: the-derived-chart-report-renders-whatever-it-is-handed
    description: >-
      The report's own validation goes vacuous, so it publishes a census that does not add up, a
      spot count that disagrees with the walk, a dominance relation that does not hold, and an
      old-versus-new disagreement count nobody recomputed. This repo has twice shipped a
      validator that could not fail, and phase 13's adversarial verifier found the second one by
      reverting a fix and watching all 45 commands stay green.
      `generate_derived_chart_report` is deliberately NOT named below, and saying so is the point
      rather than a hedge: on the committed data every figure is right, so a validator that has
      stopped checking still exits 0. What kills this is the tests that feed the generator a
      deliberately wrong input and require a non-zero exit, which is the only way a check that
      cannot fail is distinguishable from a check that passes.
      Re-pointed 2026-09-04: the rewritten generator splits measuring from publishing and the
      collected failures are called `errors`, so `validation_errors` matched nothing. The line
      below is the same gate in the same place - the one branch in `main` that decides whether a
      refused figure is published anyway - and both parameters of
      `test_a_wrong_artifact_fails_the_command_rather_than_being_rendered` still reach it.
    file: scripts/generate_derived_chart_report.py
    find: "    if errors:"
    replace: "    if False:"
    must_fail:
      - pytest_derived_chart

  - id: the-old-versus-new-comparison-reads-the-new-chart-twice
    description: >-
      The retired chart is no longer read out of git history at the pinned commit decision 7
      names; the comparison is handed the derived chart a second time. Every corpus decision then
      agrees with itself, the disagreement count is zero, and the report's most concrete claim
      about what the cutover changed in play reads at its strongest exactly when it has stopped
      measuring anything. The same shape as `corpus-self-play-crossref-empties-silently`: an
      input that quietly becomes trivial rather than raising.
      What kills it on `generate_derived_chart_report` is one specific validator case, added at
      stage 4 after an independent review found this canary did not bite: a zero disagreement
      count over a nonzero shared overlap must be refused. Without it the mutated report renders
      and exits 0, because zero disagreements passes every arithmetic check on the count - and the
      cheap repair at stage 7 would then have been to drop this command from `must_fail`, which
      loosens the gate instead of the code. Do not delete that case. It is also the right claim on
      its own terms: the retired chart three-bets to 8, 11 and 13.5 and opens the small blind to
      3.5, the derived one holds only 2.5, 7.5, 22.5 and 100, and two charts that disagree about
      hero's own opening price cannot agree on a thousand shared corpus decisions.
      Re-pointed 2026-09-04: the pin became a command-line argument so the frozen tests can feed
      a bad one, so the call reads `arguments.retired_commit` rather than the constant. Same
      call, same line, same substitution.
    file: scripts/generate_derived_chart_report.py
    find: "    retired = load_retired_chart_from_git(arguments.retired_commit)"
    replace: "    retired = derived"
    must_fail:
      - generate_derived_chart_report
      - pytest_derived_chart

  # Phase 14 stage-4 re-cut canaries, authored 2026-09-01.
  #
  # A stage-4 canary cannot be proven to bite the way `check_gate_bite` means it.
  # That check wants the gate green without the mutation and red with it, and the
  # gate is red at stage 4 by design - 30 tests describe work stage 6 has not done.
  # What each canary below is checked against instead is narrower and still worth
  # having: applying it must break at least one test that is CURRENTLY PASSING. Two
  # of the three do. The one that does not is kept and labelled rather than dropped,
  # because a canary that changes nothing is evidence about the tests, not a reason
  # to write no canary.

  - id: discrimination-tolerates-a-tie
    description: >-
      The group measure accepts a tie between the solved and transposed hand
      index instead of refusing it. A measure that cannot tell the two mappings
      apart cannot catch a transposition, and a chart that folds nothing scores
      zero against zero - which is exactly how the retired suited-row ladder
      passed while preferring a transposed index. Decision 10, ruled 2026-08-26.
      Verified 2026-09-01, and re-verified independently by the stage-4 mechanical
      review: turns
      test_the_group_measure_is_refused_when_it_prefers_the_transposed_hand_index
      from passing to failing, taking the report, validator and evidence files
      from 37 passing to 36.
      Re-pointed 2026-09-04. Stage 6 moved the comparison itself into
      `chart_relations.arm_refuses`, shared by both arms, and the report's two validators now
      call it rather than each writing the comparison out. So this attacks one line instead of
      one arm, and it attacks BOTH arms at once, which is a widening rather than a weakening:
      the rank arm was previously uncovered by any canary. It is still killed by
      `test_the_group_measure_is_refused_when_it_prefers_the_transposed_hand_index`, whose last
      case hands the validator a tie and requires a refusal.
    file: src/poker_training_bot/solver_artifacts/chart_relations.py
    find: "    return solved >= counterfactual"
    replace: "    return solved > counterfactual"
    must_fail:
      - pytest_derived_chart

  - id: dominance-tolerance-widened-past-the-ruling
    description: >-
      The per-cell tolerance goes from the one percentage point Taylor ruled on
      2026-08-24 to twenty-five, so every inversion short of a catastrophe reads
      as within tolerance. The tolerance is the whole content of the relation -
      without it the check says only that suited hands are not played
      dramatically less than their offsuit twins.
      Verified 2026-09-01: applied, the report, validator and evidence files go
      from 37 passing to 36. An earlier form of this line said "the two evidence
      files from 22 passing to 21", which reproduces under no pairing of files;
      the delta of one was right and the absolute figure was invented. Corrected
      2026-09-01 by the independent stage-4 mechanical review, and worth the
      correction rather than the deletion because a "Verified" line nobody can
      reproduce is worse than no line.
      Re-pointed 2026-09-04: the relations moved into `chart_relations.py` and the tolerance
      with them, under the name `TOLERANCE_PCT`. The report keeps
      `MONOTONICITY_TOLERANCE_PCT` as an alias of it, so the old name still exists and no
      longer carries the literal - exactly the shape that makes a canary stop applying
      without looking broken. Attacking the definition rather than the alias is also the
      stronger aim: the relation walk in `chart_relations` reads the real constant, and a
      canary on the alias would have moved a name nothing measures with.
    file: src/poker_training_bot/solver_artifacts/chart_relations.py
    find: "TOLERANCE_PCT = 1.0"
    replace: "TOLERANCE_PCT = 25.0"
    must_fail:
      - pytest_derived_chart

  - id: the-transposed-reading-is-not-transposed
    description: >-
      `transpose_hand_index` returns the grid unswapped, so the comparison the
      gate rests on compares a mapping against itself and every partition ties.
      This is an attack on the gate's own instrument rather than on the chart.
      NOT PROVEN AT STAGE 4, and kept deliberately. Applied on 2026-09-01 it
      changed nothing in the 22 passing tests of the two evidence files: the
      tests that would catch it read the real artifact, and those are red today
      for an unrelated reason - the derivation still emits 51 spots because
      decision 20's third exclusion reason is unimplemented. STAGE 7 MUST VERIFY
      THIS ONE SPECIFICALLY rather than accepting a green `check_gate_bite` run,
      because a surviving mutation here means nothing checks the instrument.
      Re-pointed 2026-09-04, the function having moved into `chart_relations.py`.
      A kill now exists that did not at stage 4 and it is worth naming so stage 7
      knows what it is watching: `tests/test_chart_counterfactual_arms.py` holds
      its own copy of the swap, taken from `test_chart_cutover_evidence.py`, and
      asserts the shipped one agrees with it cell for cell on a real committed
      spot. That is a comparison against a second implementation rather than
      against the instrument's own output, which is the only kind of check an
      instrument-attacking canary can be killed by. Stage 7 still verifies it
      specifically; this is a reason to expect a kill, not a record of one.
    file: src/poker_training_bot/solver_artifacts/chart_relations.py
    find: "swapped[suited], swapped[offsuit] = cells[offsuit], cells[suited]"
    replace: "swapped[suited], swapped[offsuit] = cells[suited], cells[offsuit]"
    must_fail:
      - pytest_derived_chart

  # Phase 14 stage-4 re-cut against the 249, authored 2026-09-02.
  #
  # The one below attacks a line that DOES NOT EXIST YET, and that is the point
  # rather than an oversight. The three canaries above were written against the
  # report because the report was already written, which is the same order of work
  # the block comment above them warns about: a canary written after the code can
  # only ever describe it. The selection rule the phase turns on has not been built,
  # so the only way to attack it before it is built is to name the line the frozen
  # tests force stage 6 to write - `MULTIWAY_EXPOSURE_THRESHOLD_PCT` is asserted by
  # name in `test_the_exposure_clause_alone_is_a_walk_to_the_leaves_not_a_live_player_count`,
  # so stage 6 has no choice about the name and this canary is a specification of the
  # literal beside it.
  #
  # Two things go red until stage 6 writes the line, and both were checked rather than
  # assumed, because a canary that quietly reddens a command outside its own phase is a
  # regression dressed as rigour:
  #   - `check_gate_bite` reports zero occurrences for it. That command is already red at
  #     stage 4 for every phase-14 canary anyway: after restoring a mutation it re-runs
  #     `pytest_derived_chart` and requires it to pass, and that command is red by design.
  #   - `tests/test_loop_machinery.py::test_every_mutation_applies_exactly_once_to_its_file`
  #     fails on its own assertion, since it counts each `find` in its file and wants one.
  #     That test is frozen, it was green against HEAD - all 71 entries there resolve - and
  #     it runs under no command but the catch-all `pytest`, which is itself red at stage 4
  #     because it runs this phase's own files. So no green command is turned red, and both
  #     reds clear the moment stage 6 writes the constant, which is the whole shape of a
  #     specification: it fails until the thing it specifies exists.
  # Stage 6 must write the constant as a bare `NAME = 10.0`, matching every other module
  # constant in `chart_derivation.py`; an annotated form would leave the find string
  # unmatched and the loop-machinery test red for a reason that is not the ruled one.
  #
  # Stage 6 did write it that way, and put it in `chart_selection.py` rather than
  # `chart_derivation.py`, the selection rule having been split out under the 500-line cap.
  # `COMMITTED_RAISE_DEPTH = 2` is beside it in the same bare form, which is why
  # `the-four-bet-family-is-committed-after-all` could be written at stage 6 against a
  # constant rather than against a call site.

  - id: a-spot-above-the-exposure-threshold-is-committed
    description: >-
      The multiway exposure threshold moves off the ten percent Taylor ruled on
      2026-09-02 by five hundredths of a point, so the chart commits a spot the rule
      refuses. That is one node and it is the named one: the button facing a big-blind
      three-bet into a four-handed pot,
      `t6/d100/BTN/HJ:raise@2.5,CO:call,BTN:call,SB:call,BB:raise@7.5`, measured at
      **10.0234** percent against a widest admitted **9.8642**. Ten-point-oh-five is
      not an arbitrary widening: the next refused node above it sits at 10.1189, so
      every value in that gap admits exactly this one spot and no other, and the
      canary therefore attacks the threshold at its own margin instead of at a
      catastrophe. The committed set goes from 249 to 250 and the census bucket from
      348 to 347.
      Decision 46 is the whole reason this filter exists, and it is the clause with
      the least margin behind it: a sixteen-hundredths gap between the widest spot the
      bot may be taught and the narrowest it may not. Nothing else in the gate is a
      statement about that gap. The raise-depth clause has a whole family behind it and
      the big-blind squeeze clause names a seat, so both fail loudly if they move; a
      threshold is a number, and a number that has quietly drifted still selects a set,
      still balances a census, still converts, still imports, and still answers every
      query. What it does at the table is teach a student to play a pot GTOpen priced
      with a product approximation the flop-pricing fit never covered - which is the
      one thing decisions 35 and 46 exist to keep out of the chart.
      `generate_derived_chart_report` is named deliberately and is the load-bearing
      entry in the list. The pytest commands can kill this mutation by reading the
      constant back - the frozen test asserts `MULTIWAY_EXPOSURE_THRESHOLD_PCT` equals
      ten - and a kill of that kind proves only that the constant is pinned, not that
      the rule uses it. The report cannot read the constant: it compares the artifact's
      spot set against the walk's key by key, so it fails only if the moved threshold
      actually moved a spot. If stage 6 declares the constant and then hardcodes ten in
      the predicate beside it, the pytest commands still go red, the report exits 0, and
      `check_gate_bite` reports this mutation as having survived a command it named -
      which is the finding, not a reason to drop the command.
      Re-pointed 2026-09-04, and the `file:` field is the only thing that moved. Stage 6 split
      the selection rule out of `chart_derivation.py` into `chart_selection.py` under the 500-line
      cap, and wrote the constant as the bare `NAME = 10.0` this block asked for. It occurs
      exactly once there. The mutation, the margin it attacks, the node it admits and the reason
      `generate_derived_chart_report` is load-bearing are all unchanged.
    file: src/poker_training_bot/solver_artifacts/chart_selection.py
    find: "MULTIWAY_EXPOSURE_THRESHOLD_PCT = 10.0"
    replace: "MULTIWAY_EXPOSURE_THRESHOLD_PCT = 10.05"
    must_fail:
      - pytest_derived_chart
      - generate_derived_chart_report

  # The lane table's other stage-4 canary - "a wrong artifact fails the command
  # rather than being rendered" - is NOT written here, because it already exists as
  # `the-derived-chart-report-renders-whatever-it-is-handed` and a second entry
  # attacking the same line would be one canary counted twice. Its find string is
  # `    if errors:` as of 2026-09-04 - the rewritten generator collects its failures
  # under that name and `validation_errors` is gone - and it occurs exactly once in
  # `scripts/generate_derived_chart_report.py`, measured against the built tree.
  # What kills it is `test_a_wrong_artifact_fails_the_command_rather_than_being_rendered`
  # in `tests/test_derived_chart_report_validators.py`, and both of its parameters do:
  # `drop-a-spot` removes the artifact's first committed spot and restamps the audit
  # fields, so only a comparison against the walk sees it, and
  # `commit-a-spot-above-the-exposure-threshold` appends the narrowest spot the filter
  # refuses at 10.0234 percent - the same node
  # `a-spot-above-the-exposure-threshold-is-committed` names above - with its cells
  # copied off a committed spot, so the file stays internally consistent and loads.
