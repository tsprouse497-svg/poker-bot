halt_reason: 'Stage 4 halted a second time, on a finding that breaks the premise of
  the 2026-08-24 ruling rather than on the ruling itself. Taylor ruled the cutover
  commits the 110 heads-up spots, on the understanding that the heads-up predicate
  selects the nodes GTOpen prices exactly. An independent poker review measured that
  and it is false. The product approximation bites at terminals, and a node''s strategy
  is backward-induced over every terminal below it, so the property has to be stated
  over the subtree rather than over the actions already taken. Counting seats that
  have not folded rather than seats that have acted: 110 pass the ruled predicate,
  5,472 are terminal-clean, 86 are in both, and 24 of the 110 have a multiway terminal
  still reachable. The 24 are four of the five opens, the RFI defences with seats
  still behind, and the decisions facing a 100bb open-jam, and they carry 2,232 of
  the corpus''s 3,054 preflop decisions - 73 percent of everything the bot would still
  answer. It is visible in the cells: flatting a 2.5bb open runs 21 to 24 percent
  for the big blind, who closes the action with nobody behind, and 0.07 to 4.5 percent
  for every seat with players still to act, the button flatting a cutoff open 0.07
  percent of the time. Every three-bet frequency is close to right. Forward-simulated
  the solve walks the blinds on 71.2 percent of hands and reaches a multiway flop
  on 0.18, against 48.1 and 4.01 in the corpus. Two further blockers ride with it,
  both also for Taylor: the four-bet continuations inside the 110 fold JJ 97 percent
  at 32 percent pot odds, and the small blind facing a button open continues 22 at
  99.94 percent and 44 at 0.07 at full reach where the ruled band grouping cannot
  see it. Cutting to the 86 drops four of the five opens, so it is not obviously a
  chart; shipping the 110 ships 24 spots that teach a button never flatting a cutoff.
  Evidence in reports/phase_audits/reviews/PHASE_14_CHART_CUTOVER/stage-04-predicate-change-review.md.'
