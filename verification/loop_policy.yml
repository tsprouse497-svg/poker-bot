schema_version: 1

# Which phases the loop may advance into without stopping for a human.
#
# The rule is mechanical rather than a judgement made fresh each time: a phase may
# run unattended when it writes no new committed data. Data is where a wrong
# assumption becomes permanent, because every later phase is then measured against
# it. Behaviour and tooling can be corrected with an edit; a checksummed artifact
# or a golden fixture cannot, once things downstream depend on it.
#
# `needs_human_data` means the phase cannot even start until Taylor supplies
# something the repo does not have. The driver halts before stage 1 in that case
# rather than letting a session invent the input.

phases:
  "05":
    auto_advance: false
    needs_human_data: false
    reason: >-
      Commits a preflop chart artifact and its frequency expectations. Ranges and
      sizings become the reference every later phase is measured against, and
      source.kind is a human provenance claim the checksum cannot verify.
  "06":
    auto_advance: true
    needs_human_data: false
    reason: >-
      A conservative postflop fallback is a behavioural spec with a reference
      implementation already in the repo. It writes no data, and its oracle is
      exhaustive enumeration over engine-legal states.
  "07":
    auto_advance: true
    needs_human_data: false
    reason: >-
      Simulator mechanics are checked against the frozen replayer, chip
      conservation, and seed determinism. Outputs are generated reports, not
      committed fixtures. Absolute strategy-quality claims are out of scope until
      real hands exist, which is Phase 08.
  "08":
    auto_advance: false
    needs_human_data: false
    reason: >-
      The oracle no longer has to come from Taylor. The Pluribus subset of the
      public PHH dataset is 10000 hands of six-handed no-limit hold'em at 50/100
      with 10000-chip starting stacks, which is exactly the one spot the
      committed chart answers, and every hand carries all six hole cards plus a
      finishing_stacks line this repo did not write. It is public under a stable
      DOI, so the provenance claim is checkable rather than asserted. The phase
      still commits a normalized sample, and committed data is where a wrong
      assumption becomes permanent, so it does not auto-advance.
  "09":
    auto_advance: true
    needs_human_data: false
    reason: >-
      Every hardening claim is testable by breaking the thing deliberately and
      requiring the gate to go red, which is what check_gate_bite already does.
  "10":
    auto_advance: false
    needs_human_data: false
    reason: >-
      GTOpen is installed and has been run, so the input exists in the sense the
      loop cares about. It still commits a solver export that every later phase is
      measured against, and the phase's own point is a human looking at range grids
      and saying whether the extraction is faithful, which no check performs. Two
      things are unverified and belong to its contract stage: the same config has
      never been run twice and diffed, so determinism is unproven, and no solve time
      was ever recorded.
  "11":
    auto_advance: true
    needs_human_data: false
    reason: >-
      Closes engine and query defects that v1 found, diagnosed, and filed with
      reproductions. It writes no committed data, and each fix is provable by a test
      that fails against today's behaviour.
  "12":
    auto_advance: false
    needs_human_data: false
    reason: >-
      Widening the spot key re-derives the committed artifact, so every chart cell
      moves. The vocabulary is also what a later solve is configured against, which
      makes a wrong choice here expensive in exactly the way committed data is.
  "13":
    auto_advance: true
    needs_human_data: false
    reason: >-
      Per-seat committed chips are a query-shape change with an exhaustive oracle:
      chips in equal chips out, checked against the frozen replayer. It commits no
      data of its own.
  "14":
    auto_advance: false
    needs_human_data: false
    reason: >-
      Commits the chart the bot plays. It is the phase where a wrong range becomes
      the reference for everything after it, and its closing measurement is a claim
      about whether v1's calling gap was rake and price or a real defect, which is a
      judgement rather than a threshold.
  "15":
    auto_advance: false
    needs_human_data: false
    reason: >-
      Commits session records, and it is the first surface a human uses directly
      rather than reads about. What a drill asks and how it scores an answer is a
      product judgement no test settles.
  "16":
    auto_advance: false
    needs_human_data: false
    reason: >-
      No longer gated on a human input. It was declared blocked on a postflop sizing
      source that does not exist, which was wrong: GTOpen solves postflop as its main
      function and the Preflop Lab phase 10 uses is the bolt-on. The three rulings that
      replaced that premise were made on 2026-08-19 and are recorded in
      reports/phase_audits/decisions/PHASE_16_POSTFLOP_BETTING_DECISIONS.md: flop only,
      every canonical flop against a small head of common preflop lines, and board
      abstraction deferred rather than rejected as POSTFLOP-BOARD-ABSTRACTION. It still
      does not auto-advance, because it commits the solution the bot plays postflop and
      committed data is where a wrong assumption becomes permanent. One judgment call
      stays open by design: the exploitability target and whether a solve is reproducible
      are inherited from phase 10's measurements rather than ruled here, so stage 3
      halts if phase 10 never produced them.
  "17":
    auto_advance: false
    needs_human_data: false
    reason: >-
      Writes a report rather than committed data, which would normally auto-advance.
      It does not, because its output is a verdict: the phase says whether v1's calling
      gap was rake and price or a real defect in the ranges, and phase 08 could separate
      none of the three explanations it offered. Which of them survives is a judgement a
      human makes on the evidence, and the phase is designed so a miss in either
      direction against its pre-registered prediction is a result rather than something
      to explain away. Split from phase 14 by Taylor on 2026-08-31.
