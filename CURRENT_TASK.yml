  - date: 2026-08-12
    reason: The Phase 08 canaries were never authored at stage 4, so without them check_gate_bite would pass while proving nothing about this phase, which is the definition of a decorative gate. verification/mutations.yml comes back into approved_scope for canaries only. The freeze lock is untouched because no test changes, and the builder still cannot reach tests/.
