  - date: 2026-08-12
    reason: The stage 8 domain review found that 72 percent of scored decisions are folds and that folds agree 98.6 percent of the time, so a single headline agreement rate mostly measures how easy it is to fold trash. Splitting it by the action the player took shows raises agree 93.4 percent and calls only 60.6 percent, which is the phase's actual finding and the current report buries it. The fix is a report section, so comparison.py comes back into scope; no rule, test, or measurement changes.
  - date: 2026-08-12
