  - date: 2026-08-18
    reason: >-
      The loop runs one phase because its state is one file, its worktree lock is one path, and
      nothing reads depends_on. MAINT-20 builds the fleet: per-lane state under
      verification/loop_runs/, a lock resolved through the worktree's own git dir rather than
      REPO_ROOT/.git, which is a file and not a directory inside a linked worktree, a driver that
      computes eligible phases from the contract DAG, and a derived pause board so everything
