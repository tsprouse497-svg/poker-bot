scope_change_log:
  - date: 2026-06-08
    reason: Phase 00 scaffold requires root metadata, CI config, uv lockfile, and tiny sample fixtures.
  - date: 2026-06-08
    reason: Phase 01 requires deterministic poker core source, golden-hand fixtures, tests, reports, and audit evidence.
  - date: 2026-06-08
    reason: Phase 02 requires normalized hand-history schema, deterministic replay, fixtures, tests, reports, and audit evidence.
  - date: 2026-08-10
    reason: Structure maintenance requires derived verify gates, function-based naming, consolidated agent rules, idle task mode, and diff-based scope checks.
  - date: 2026-08-10
    reason: Phase 03 independent review found a pre-existing engine bug (min-raise not updated after a postflop bet); fixing it requires poker_core/engine.py and tests/test_poker_core.py.
  - date: 2026-08-11
    reason: Phase 04 requires the solver-artifacts package, the canonical position vocabulary in the poker core, committed chart artifacts, tests, the chart coverage report generator, command registration, schema docs, and audit evidence.
  - date: 2026-08-11
    reason: The committed chart artifact needs a reproducible, auditable origin, so scripts/build_preflop_chart_artifact.py is approved to expand the reviewable range spec and stamp the artifact checksum.
  - date: 2026-08-11
    reason: Independent review found the committed artifact was never exercised by tests and could drift from its builder, so tests/test_preflop_committed_charts.py is approved.
  - date: 2026-08-11
    reason: Phase 05 contract-update needs the phase contract itself plus a pre-implementation judgment-call record under reports/phase_audits/decisions/ so the domain choices a chart cannot settle are ruled on by a human before any code is written.
  - date: 2026-08-11
    reason: MAINT-02 builds the autonomous loop machinery, so it needs the scope and contract checkers it hardens, the new test-freeze, gate-bite, and consistency checkers, the loop stage driver, verification state under verification/, their tests, the command registry, and the loop process docs.
  - date: 2026-08-11
    reason: The loop halts at its human gate with an active ExecPlan and no active task, which check_execplan_delegation.py treated as an error, so MAINT-02 also needs that checker and its tests to model a declared pause.
  - date: 2026-08-11
    reason: Driving Phase 05 through the loop needs its decision record annotated with the reversibility class each judgment call carries, which the loop driver reads to decide whether a human must rule before implementation.
  - date: 2026-08-11
    reason: The loop driver derives the decision record's filename from the phase contract, matching how audit packets are already named, so the record is renamed and the contract reference updated to match.
  - date: 2026-08-11
    reason: The loop's first real run blocked at stage 4 because the check rejected a red that comes from the implementation module not existing yet, which is the expected state when tests are authored before any code, so MAINT-04 fixes the driver check and its test.
  - date: 2026-08-11
    reason: A task that legitimately changes tests must also re-freeze them, so verification/freeze.lock belongs in that task's approved_scope rather than in standing_scope, where a builder could touch it.
  - date: 2026-08-11
    reason: Phase 05 implementation needs the committed solver export and derived artifact, the converter that reproduces it, the chart-backed strategy and its solver-sourced sizing table, the strategy report generator and command registration, the phase tests, the committed-chart tests that must follow the retirement of the hand-authored artifact, and the audit evidence.
  - date: 2026-08-11
    reason: Phase 05 halted because StrategyQuery carries no preflop action history, so a chart-backed strategy cannot derive its spot key; Phase 03's contract must first require the query to carry that history.
  - date: 2026-08-11
    reason: Implementing the Phase 03 contract addition needs StrategyQuery itself, its tests, and the test freeze lock those tests are recorded in.
  - date: 2026-08-11
    reason: A halt is meant to be resumable, but the driver shipped no way back, so restarting re-ran completed stages and demanded their transient task modes; MAINT-05 adds --resume.
  - date: 2026-08-11
    reason: Phase 05 implementation needs the committed solver export and derived artifact, the converter that reproduces them, the chart-backed strategy and its solver-sourced sizing table, the strategy report generator and command registration, the phase tests, the committed-chart tests that follow retiring the hand-authored artifact, and the audit evidence.
  - date: 2026-08-11
    reason: Loop stage 5 narrows scope so the builder cannot reach the tests it is measured by; tests/ and verification/ leave approved_scope and check_scope.py enforces that mechanically for the rest of the phase.
  - date: 2026-08-11
    reason: Retiring the hand-authored chart takes its builder script and the Phase 04 tests that describe it, and the phase tests need read-only accessors on PreflopChartLibrary, so lookup.py is approved for additive accessors only with no validation loosened. tests/test_full_table_preflop.py stays out of scope, because that is the file measuring this phase's own work.
  - date: 2026-08-11
    reason: Loop stage 5 narrows scope mid-task, so the diff has to be measured from the freeze commit rather than from the start of the phase; otherwise work that was legitimately in scope at stage 4 reads as out of scope afterwards.
  - date: 2026-08-11
    reason: Independent review measured the cost of the highest-weight collapse and it is a first-order exploit, so judgment call 3 is re-ruled to seeded weighted sampling and the contract criterion it came from must change first.
  - date: 2026-08-11
    reason: Implementing the re-ruled collapse changes the strategy, the tests that pinned the plurality rule, the freeze lock recording them, and the report that must now show the strategy's own frequencies.
  - date: 2026-08-11
    reason: The loop policy test demanded an exact match against incomplete phases, which fails the moment a phase in the policy completes, so MAINT-06 relaxes it to a coverage check and keeps completed entries as the record of why they could not auto-advance.
  - date: 2026-08-11
    reason: The loop policy test demanded an exact match against incomplete phases, which fails the moment a phase in the policy completes, so MAINT-06 relaxes it to a coverage check and keeps completed entries as the record of why they could not auto-advance.
  - date: 2026-08-11
    reason: MAINT-06 is split out of the Phase 05 closeout because the policy test only fails once phase 05 is marked completed, so the fix has to land in its own maintenance task before the closeout commit can be green.
  - date: 2026-08-12
    reason: Phase 06 contract-update needs the phase contract itself, whose skeleton claims a generate_decision_audit command and Phase 03's own latest_decision_audit.jsonl report, plus a pre-implementation judgment-call record under reports/phase_audits/decisions/ so the postflop choices no chart can settle are recorded with a reversibility class before any code is written.
  - date: 2026-08-12
    reason: Phase 06 implementation needs the phase tests, the command registry entries for its two new command IDs, the mutation canaries that must make the new pytest command fail, the postflop fallback strategy and the composite that routes preflop to the chart and postflop to it, the fallback report generator, and the audit evidence. The contract stays listed only because it already changed earlier in this task and the diff is measured from base_commit; implementation mode is what forbids editing it further.
  - date: 2026-08-12
    reason: Loop stage 5 narrows scope so the builders cannot reach the tests they are measured by. tests/, verification/, the command registry, and the contract all leave approved_scope, and base_commit moves to the freeze commit so the diff is measured from there rather than from the start of the phase, which is what keeps work that was legitimately in scope at stage 4 from reading as out of scope afterwards.
  - date: 2026-08-12
    reason: The stage 8 domain review showed that folding a hand no holding can beat is a certain loss rather than caution, and that the turn extension was declined on the flop's arithmetic. Judgment calls 2 and 3 are re-ruled to allow-guaranteed-chops and extend-to-turn, and both are acceptance criteria plus a named forbidden shortcut in the contract, so the contract and the decision record change first in contract-update mode.
  - date: 2026-08-12
    reason: Implementing the two re-rulings changes the fallback strategy, the frozen tests that pinned the strict bar and the river-only exception, the freeze lock recording them, the mutation canary that defended the strict bar and a new one for the turn rule, the report that must now show turn examples and the price of the turn claim, and the stage 8 review notes that record the resolution. tests/ and verification/ come back into scope because this task legitimately changes tests and must re-freeze them; the contract and the decision record leave scope again because implementation mode may not touch them.
  - date: 2026-08-12
    reason: Phase 07 contract-update needs the phase contract itself, whose skeleton carries only gate boilerplate, plus a pre-implementation judgment-call record under reports/phase_audits/decisions/ so the simulation choices no chart can settle are recorded with a reversibility class before any code is written.
  - date: 2026-08-12
    reason: Phase 07 implementation needs the phase tests, the command registry entries for its two new command IDs, the mutation canaries that must make the new pytest command fail, the simulator and profiles packages, the comparison report generator, and the audit evidence. It also files the river-only pot-odds design option in backlog.yml, which is standing scope, because Phase 07 is the phase that decides whether anything ever bets at the bot and therefore whether that option is worth building.
  - date: 2026-08-12
    reason: Loop stage 5 narrows scope so the builders cannot reach the tests they are measured by. tests/, verification/, and the command registry all leave approved_scope, and base_commit moves to the freeze commit so the diff is measured from there rather than from the start of the phase, which is what keeps work that was legitimately in scope at stage 4 from reading as out of scope afterwards.
  - date: 2026-08-12
    reason: Stage 7 halted because three Phase 07 canaries survive. Two are authoring errors in the canaries themselves and one is a genuine gap in the frozen tests, so repairing them needs verification/mutations.yml, the test file that has to pin judgment call 4, and the freeze lock recording it. The simulator and the report generator leave approved_scope, because this task must not be able to reshape the implementation to suit a canary - the point is the reverse.
  - date: 2026-08-12
    reason: The Phase 07 stage 8 blocker is not a code defect on its own. A refusal names the kind of miss and not the spot it missed, so the only record of which spot the charts failed on was the action sequence that a voided hand then discarded. Fixing that needs the Phase 03 contract to require a refusal to carry structured detail about what was missing, and the Phase 07 contract to require a refusal inventory keyed by that detail plus a refused hand that carries its own action without claiming to be a completed hand history. Both are semantic contract changes, so they land in contract-update mode before any code.
  - date: 2026-08-12
    reason: Implementing the refusal inventory needs StrategyRefusal to carry detail and its Phase 03 tests, the preflop chart to populate that detail from the lookup's own spot key, the simulator to keep a refused hand's partial street and stop claiming it is a completed history, the report generator that writes the inventory, the Phase 07 tests those changes move, a canary per half of the fix, and the freeze lock recording the re-frozen tests. The two contracts leave approved_scope because implementation mode may not touch them.
  - date: 2026-08-12
    reason: Phase 08 was gated on hands only Taylor could supply, and that gate is now answerable. The Pluribus subset of the public PHH dataset is 10000 six-handed 100bb hands at 50/100 with every hole card shown and a finishing_stacks oracle, fetchable from a public repository under a stable DOI, so the input is reproducible rather than a private export. Reopening the phase needs verification/loop_policy.yml alone; auto_advance stays false because the phase still commits sample data.
